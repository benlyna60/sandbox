<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>IA Mobile : Module C++ (Spécialisé)</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: monospace; padding: 15px; max-width: 700px; margin: auto; }
        .panel { background-color: #1a1a1a; padding: 15px; border-radius: 6px; border: 1px solid #333; margin-bottom: 15px; }
        button { background-color: #333; color: #fff; border: 1px solid #555; padding: 12px; cursor: pointer; width: 100%; margin-bottom: 8px; border-radius: 4px; font-weight: bold; }
        .output-box { background-color: #000; color: #00599c; padding: 15px; border-radius: 4px; font-size: 1.1em; min-height: 100px; border: 1px solid #444; white-space: pre-wrap; }
    </style>
</head>
<body onload="initApp()">
    <h1>IA Mobile : Module C++</h1>
    <div class="panel">
        <button onclick="selectionnerFichier()" id="btn-fichier">Lier fichier (cpp.json)</button>
        <button onclick="lancerEntrainement()" style="background-color: #00599c;">Lancer Apprentissage C++ Ciblié</button>
        <button onclick="arreterEntrainement()" style="background-color: #b71c1c;">Pause</button>
    </div>
    <div class="output-box" id="resultat">En attente d'apprentissage ciblée...</div>

    <script>
        let fichierHandle = null;
        let memoirePaires = {};
        let enCours = false;
        
        // Mots-clés ciblés pour explorer tout l'écosystème C++ en profondeur
        const motsClefsCpp = [
            "C++ programming language syntax",
            "Standard Template Library C++",
            "Object-oriented programming C++",
            "Pointer computer programming memory",
            "Template metaprogramming C++",
            "C++ exception handling",
            "Smart pointer C++11",
            "Lambda expression C++"
        ];

        async function ouvrirBDD() {
            return new Promise(res => {
                const req = indexedDB.open("MonAppDB_CPP", 1);
                req.onupgradeneeded = () => req.result.createObjectStore("handles");
                req.onsuccess = () => res(req.result);
            });
        }
        
        async function selectionnerFichier() {
            try {
                [fichierHandle] = await window.showOpenFilePicker();
                const db = await ouvrirBDD();
                db.transaction("handles", "readwrite").objectStore("handles").put(fichierHandle, "cppKey");
                document.getElementById("btn-fichier").innerText = "✔ Fichier lié (cpp.json)";
            } catch (err) {
                console.error(err);
            }
        }

        async function initApp() {
            const db = await ouvrirBDD();
            fichierHandle = await new Promise(res => {
                const req = db.transaction("handles").objectStore("handles").get("cppKey");
                req.onsuccess = () => res(req.result);
            });
            if (fichierHandle) {
                try {
                    const file = await fichierHandle.getFile();
                    const text = await file.text();
                    const json = text ? JSON.parse(text) : {};
                    memoirePaires = json.memoire_paires || json; // Rétrocompatibilité
                    document.getElementById("btn-fichier").innerText = "✔ Fichier lié (cpp.json)";
                    document.getElementById("resultat").innerText = "Prêt. Mémoire chargée (" + Object.keys(memoirePaires).length + " racines).";
                } catch(e) {
                    document.getElementById("resultat").innerText = "Erreur de lecture du fichier lié.";
                }
            }
        }
        
        async function lancerEntrainement() {
            if (!fichierHandle) {
                alert("Veuillez d'abord lier un fichier JSON !");
                return;
            }
            enCours = true;
            document.getElementById("resultat").innerText = "Apprentissage C++ en cours...";

            while(enCours) {
                try {
                    // 1. Choix d'un mot-clé technique aléatoire dans la liste
                    let query = motsClefsCpp[Math.floor(Math.random() * motsClefsCpp.length)];
                    
                    // 2. Recherche ciblée sur l'API Wikipédia anglophone (riche en documentation technique)
                    const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=10&format=json&origin=*`;
                    const searchRes = await fetch(searchUrl).then(r => r.json());
                    const results = searchRes.query?.search || [];
                    
                    if (results.length > 0) {
                        let hit = results[Math.floor(Math.random() * results.length)];
                        let title = hit.title;

                        // 3. Récupération du texte brut de l'article trouvé
                        const contentUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(title)}&format=json&origin=*`;
                        const res = await fetch(contentUrl).then(r => r.json());
                        const texte = Object.values(res.query.pages)[0].extract || "";
                        
                        // 4. Analyse et apprentissage des paires de caractères
                        for (let i = 0; i < texte.length - 1; i++) {
                            if (!enCours) break;
                            let a = texte[i], b = texte[i+1];
                            if (!memoirePaires[a]) memoirePaires[a] = {};
                            memoirePaires[a][b] = (memoirePaires[a][b] || 0) + 1;
                        }
                        
                        // 5. Sauvegarde automatique dans le fichier lié
                        const writable = await fichierHandle.createWritable();
                        await writable.write(JSON.stringify({ memoire_paires: memoirePaires }, null, 2));
                        await writable.close();

                        document.getElementById("resultat").innerText = `Dernier sujet exploré : "${title}"\nRacines en mémoire : ${Object.keys(memoirePaires).length}`;
                    }
                } catch (e) {
                    console.error(e);
                }
                await new Promise(r => setTimeout(r, 4000));
            }
        }
        
        function arreterEntrainement() { 
            enCours = false; 
            document.getElementById("resultat").innerText = "En pause. Données sauvegardées.";
        }
    </script>
</body>
</html>
