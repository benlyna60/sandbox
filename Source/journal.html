                <p>CATEGORIE: UNIVERSITÉ & RECHERCHE<br>SOURCE: Phys.org<br>DATE: 2026-08-21 20:00:04<br>TITRE: Iron hydride enters an exotic state of matter under Earth's inner-core conditions<br>LIEN: https://phys.org/news/2026-08-iron-hydride-exotic-state-earth.html<br>CONTENU: Earth's inner core, composed primarily of iron with a small percentage of light elements, may enter a superionic state at extreme pressure and temperature, according to experimental results from researchers at Science Tokyo. Using laser-heated and electrically wired diamond-anvil cells, the researchers identified experimental signatures of superionic iron hydride at conditions relevant to Earth's core. These findings provide new insights into the composition and dynamics of Earth's deep interior.</p>
            </div>
            <div class="article" style="margin-bottom: 20px; padding: 10px; border-bottom: 1px solid #ccc;">
                <p>CATEGORIE: UNIVERSITÉ & RECHERCHE<br>SOURCE: Phys.org<br>DATE: 2026-08-21 19:40:04<br>TITRE: New Monte Carlo method accelerates simulations of densely entangled polymer melts<br>LIEN: https://phys.org/news/2026-08-monte-carlo-method-simulations-densely.html<br>CONTENU: Long polymer chains are everywhere: in synthetic materials, soft matter, biological systems such as chromosomes, and mathematical models of filaments and knots. When many such chains are densely packed, they form what physicists call a polymer melt. In this crowded environment, each chain is constrained by the others around it. These entanglements are central to the behavior of polymeric materials, but they also make the systems extremely difficult to simulate. As chain length increases, the time needed to obtain a new independent configuration grows very rapidly. For very large systems, conventional simulations can therefore become computationally prohibitive.</p>
            </div>
            <div class="article" style="margin-bottom: 20px; padding: 10px; border-bottom: 1px solid #ccc;">
                <p>CATEGORIE: UNIVERSITÉ & RECHERCHE<br>SOURCE: Phys.org<br>DATE: 2026-08-21 19:20:03<br>TITRE: Realistic solid-state model brings fractons in quantum spin liquids closer to detection<br>LIEN: https://phys.org/news/2026-08-realistic-solid-state-fractons-quantum.html<br>CONTENU: Quasiparticles arise from the complex interaction of many particles in solids; for example, we describe lattice vibrations in crystals as phonons. Fractons are exotic quasiparticles that occur at the vertices of magnetic domain walls between different spin orders. What makes them special is that they are virtually immobile and can only be displaced by other fractons. In theory, this limited mobility could be exploited to robustly store quantum information.</p>
            </div>
