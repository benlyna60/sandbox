name: Mettre a jour les flux statiques

on:
  schedule:
    - cron: '*/5 * * * *' # S'exécute toutes les 5 minutes
  workflow_dispatch: # Te permet aussi de le forcer à la main en 1 clic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurer les autorisations CORS (pour les fichiers HTML)
        run: |
          echo "headers:" > _config.yml
          echo "  - scope:" >> _config.yml
          echo "      path: \"Source/*.html\"" >> _config.yml
          echo "    values:" >> _config.yml
          echo "      Access-Control-Allow-Origin: \"*\"" >> _config.yml

      - name: Lancer ton script de mise à jour directement
        run: |
          node mettre-a-jour.js

      - name: Enregistrer et publier les modifications
        run: |
          git config --global user.name "Assistant Statique"
          git config --global user.email "assistant@actions.github.com"
          git add Source/ _config.yml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des flux et configuration CORS" && git push)
