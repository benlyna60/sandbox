name: Mettre a jour les flux statiques

on:
  schedule:
    - cron: '*/5 * * * *' # S'exécute toutes les 5 minutes
  workflow_dispatch: # Te permet aussi de le forcer à la main en 1 clic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installer l'environnement Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44825db2a # v4.2.0
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install

      - name: Lancer ton script de mise à jour
        run: node mettre-a-jour.js

      - name: Enregistrer et publier les modifications
        run: |
          git config --global user.name "Assistant Statique"
          git config --global user.email "assistant@actions.github.com"
          git add Source/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des flux en dur" && git push)
