<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub IA - Chat Fichier JSON</title>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --panel-alt: #2b3847;
            --text: #c5c6c7;
            --text-dim: #8892b0;
            --cyan: #00d9ff;
            --hair: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--hair);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
            font-size: 15px;
            color: #fff;
        }

        #status-badge {
            font-size: 11px;
            background: rgba(0, 255, 102, 0.1);
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 4px 8px;
            border-radius: 6px;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background: var(--panel-alt);
            color: #fff;
            align-self: flex-end;
            border: 1px solid var(--hair);
            border-bottom-right-radius: 2px;
        }

        .message.hub {
            background: #000;
            color: #fff;
            align-self: flex-start;
            border: 1px solid var(--cyan);
            border-bottom-left-radius: 2px;
        }

        form {
            background: var(--panel);
            border-top: 1px solid var(--hair);
            padding: 12px;
            display: flex;
            gap: 10px;
            margin: 0;
        }

        textarea#user-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--hair);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            resize: none;
            height: 22px;
            font-family: inherit;
        }

        #btn-envoyer {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Chat Hub Mobile</h2>
        <span id="status-badge">Prêt</span>
    </header>

    <div id="chat-container">
        <div class="message hub">Mode fichier JSON activé. Tapez votre message ci-dessous pour l'envoyer au Hub.</div>
    </div>

    <form id="chat-form">
        <textarea id="user-input" placeholder="Écrire un message..."></textarea>
        <button id="btn-envoyer" type="submit">➤</button>
    </form>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');
        const statusBadge = document.getElementById('status-badge');

        // URL du fichier JSON partagé (adaptée vers ton GitHub Pages)
        let jsonBridgeUrl = localStorage.getItem('hub_json_bridge_url') || 'https://benlyna60.github.io/sandbox/hub-state.json';

        let dernierMessageRecuAffiche = "";

        // Envoi d'un message
        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const texte = userInput.value.trim();
            if (!texte) return;

            // Affichage local immédiat du message utilisateur
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = texte;
            chatContainer.appendChild(userDiv);
            userInput.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            statusBadge.innerText = "En attente du Hub...";

            // Sauvegarde locale ou simulation d'envoi pour que ton PC puisse le récupérer via le flux continu
            try {
                // Si ton PC surveille le fichier via l'API locale, il récupérera le texte actualisé.
                // Tu peux aussi stocker la dernière action pour usage local mobile.
                localStorage.setItem('dernier_message_envoye', texte);
                statusBadge.innerText = "En attente...";
            } catch (err) {
                statusBadge.innerText = "Erreur d'envoi";
            }
        };

        // Vérification périodique des réponses du Hub (toutes les 1.5 secondes)
        setInterval(async () => {
            try {
                const response = await fetch(jsonBridgeUrl + '?t=' + Date.now());
                if (!response.ok) return;
                const data = await response.json();

                // Si le Hub a répondu et que ce n'est pas déjà affiché
                if (data.dernierMessageHub && data.dernierMessageHub !== dernierMessageRecuAffiche) {
                    dernierMessageRecuAffiche = data.dernierMessageHub;

                    const hubDiv = document.createElement('div');
                    hubDiv.className = 'message hub';
                    hubDiv.innerText = data.dernierMessageHub;
                    chatContainer.appendChild(hubDiv);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    
                    statusBadge.innerText = "Connecté";
                }
            } catch (e) {
                // Ignore les erreurs réseau temporaires
            }
        }, 1500);
    </script>
</body>
</html>
