<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub IA - Chat P2P par Fichier & QR</title>
    <!-- Intégration de LZ-String pour compresser les clés de liaison P2P -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <!-- Intégration de Html5QrcodeScanner pour la lecture par caméra (mis en attente) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5.min.js"></script>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --panel-alt: #2b3847;
            --text: #c5c6c7;
            --text-dim: #8892b0;
            --cyan: #00d9ff;
            --hair: rgba(255, 255, 255, 0.1);
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--hair);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        header h2 {
            margin: 0;
            font-size: 15px;
            color: #fff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #status-badge {
            font-size: 11px;
            background: rgba(255, 176, 0, 0.1);
            color: #ffb000;
            border: 1px solid #ffb000;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        #nav-menu {
            position: fixed;
            top: 0;
            right: -280px;
            width: 260px;
            height: 100%;
            background: var(--panel);
            border-left: 1px solid var(--hair);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            transition: right 0.3s ease;
            z-index: 1000;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #nav-menu.active {
            right: 0;
        }

        #nav-menu h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
            color: var(--cyan);
            border-bottom: 1px solid var(--hair);
            padding-bottom: 8px;
        }

        .menu-action-btn {
            background: var(--panel-alt);
            color: #fff;
            border: 1px solid var(--hair);
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            font-weight: 500;
            transition: background 0.2s;
        }

        .menu-action-btn:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--cyan);
        }

        #mobile-p2p-panel {
            background: var(--bg);
            border: 1px solid var(--cyan);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 11px;
        }

        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }
        #menu-overlay.active {
            display: block;
        }

        #qr-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
        }

        #reader {
            width: 100%;
            max-width: 350px;
            min-height: 250px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--cyan);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background: var(--panel-alt);
            color: #fff;
            align-self: flex-end;
            border: 1px solid var(--hair);
            border-bottom-right-radius: 2px;
        }

        .message.hub {
            background: #000;
            color: #fff;
            align-self: flex-start;
            border: 1px solid var(--cyan);
            border-bottom-left-radius: 2px;
        }

        .message-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 6px;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: var(--cyan);
            color: #000;
        }

        form {
            background: var(--panel);
            border-top: 1px solid var(--hair);
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            margin: 0;
            flex-shrink: 0;
        }

        textarea#user-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--hair);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            resize: none;
            height: 22px;
            font-family: inherit;
        }

        #btn-envoyer {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <h2>Chat Hub Mobile</h2>
        <div class="header-right">
            <span id="status-badge">Déconnecté</span>
            <button class="hamburger-btn" id="btn-toggle-menu" aria-label="Menu">☰</button>
        </div>
    </header>

    <div id="menu-overlay"></div>
    <nav id="nav-menu">
        <h3>Actions</h3>
        <button class="menu-action-btn" id="menu-clear">🧹 Nettoyer la mare</button>
        <button class="menu-action-btn" id="menu-new-conv">✨ Nouvelle conversation</button>

        <h3 style="margin-top: 10px;">Liaison P2P (Fichiers & JSON)</h3>
        <div id="mobile-p2p-panel">
            <div style="color:var(--cyan); font-weight:bold;">📁 1. Charger l'offre du PC :</div>
            <input type="file" id="input-charger-json" accept=".json" style="font-size:10px; color:#fff; width:100%;">
            
            <button id="btn-partager-email" style="background:var(--panel-alt); color:#fff; border:1px solid var(--hair); padding:8px; border-radius:4px; cursor:pointer; margin-top:4px;">✉️ 2. Partager / Envoyer la réponse JSON</button>
        </div>

        <h3 style="margin-top: 10px; color:var(--text-dim);">Options Caméra / QR (Bêta)</h3>
        <div id="mobile-p2p-panel" style="border-color:var(--text-dim); opacity:0.7;">
            <button id="btn-scanner-qr" style="background:var(--panel-alt); color:#fff; font-weight:bold; padding:6px; border-radius:4px; border:1px solid var(--hair); cursor:pointer;">📷 Scanner QR (En pause)</button>
        </div>
    </nav>

    <div id="qr-modal">
        <div style="color: #fff; margin-bottom: 10px; font-weight: bold; font-size: 13px; text-align: center;">Module Caméra (Option en cours de réglage)</div>
        <div id="reader"></div>
        <button id="btn-fermer-qr" style="margin-top: 15px; background: var(--panel-alt); color: #fff; border: 1px solid var(--hair); padding: 8px 16px; border-radius: 6px; cursor: pointer;">Fermer</button>
    </div>

    <div id="chat-container">
        <div class="message hub">
            <div class="message-header"><button class="btn-copy" onclick="copyText(this)">📋 Copier</button></div>
            <div>Mode Fichiers JSON actif. Ouvrez le menu ☰ pour charger l'offre du PC.</div>
        </div>
    </div>

    <form id="chat-form">
        <textarea id="user-input" placeholder="Écrire un message..."></textarea>
        <button id="btn-envoyer" type="submit">➤</button>
    </form>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');
        const statusBadge = document.getElementById('status-badge');

        const navMenu = document.getElementById('nav-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const btnToggleMenu = document.getElementById('btn-toggle-menu');

        function toggleMenu() {
            navMenu.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        }

        btnToggleMenu.onclick = toggleMenu;
        menuOverlay.onclick = toggleMenu;

        document.getElementById('menu-clear').onclick = () => {
            chatContainer.innerHTML = '<div class="message hub"><div class="message-header"><button class="btn-copy" onclick="copyText(this)">📋 Copier</button></div><div>Mare nettoyée. Prêt pour de nouveaux tests.</div></div>';
            toggleMenu();
        };

        document.getElementById('menu-new-conv').onclick = () => {
            chatContainer.innerHTML = '<div class="message hub"><div class="message-header"><button class="btn-copy" onclick="copyText(this)">📋 Copier</button></div><div>Nouvelle conversation initialisée.</div></div>';
            toggleMenu();
        };

        window.copyText = function(btn) {
            const contentDiv = btn.parentElement.nextElementSibling;
            const textToCopy = contentDiv ? contentDiv.innerText : '';
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.innerText = 'Copié ! ✅';
                setTimeout(() => btn.innerText = '📋 Copier', 2000);
            });
        };

        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        let dataChannel = null;

        pc.ondatachannel = (e) => {
            dataChannel = e.channel;
            setupDataChannel();
        };

        function setupDataChannel() {
            dataChannel.onopen = () => {
                statusBadge.innerText = "Connecté ✅";
                statusBadge.style.background = "rgba(0, 255, 102, 0.1)";
                statusBadge.style.color = "#00ff66";
                statusBadge.style.borderColor = "#00ff66";
            };

            dataChannel.onmessage = (e) => {
                const texteReponse = e.data;
                const hubDiv = document.createElement('div');
                hubDiv.className = 'message hub';
                
                const headerDiv = document.createElement('div');
                headerDiv.className = 'message-header';
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'btn-copy';
                copyBtn.innerText = '📋 Copier';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(texteReponse).then(() => {
                        copyBtn.innerText = 'Copié ! ✅';
                        setTimeout(() => copyBtn.innerText = '📋 Copier', 2000);
                    });
                };
                
                headerDiv.appendChild(copyBtn);
                
                const textSpan = document.createElement('div');
                textSpan.innerText = texteReponse;
                
                hubDiv.appendChild(headerDiv);
                hubDiv.appendChild(textSpan);
                
                chatContainer.appendChild(hubDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };
        }

        // --- GESTION DU CHARGEMENT DU FICHIER JSON VENANT DU PC ---
        document.getElementById('input-charger-json').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                const data = JSON.parse(text);

                let decompressedOffer = data.payload;
                try {
                    const maybeJson = LZString.decompressFromEncodedURIComponent(data.payload);
                    if (maybeJson) decompressedOffer = maybeJson;
                } catch (err) {}

                const offerDesc = JSON.parse(atob(decompressedOffer));
                await pc.setRemoteDescription(new RTCSessionDescription(offerDesc));

                statusBadge.innerText = "Offre chargée !";
                toggleMenu();
                alert("Offre du PC chargée avec succès ! Vous pouvez maintenant générer/partager la réponse JSON.");
            } catch (err) {
                alert("Erreur lors de la lecture du fichier JSON : " + err.message);
            }
        };

        // --- GESTION DU PARTAGE / EMAIL DE LA RÉPONSE ---
        document.getElementById('btn-partager-email').onclick = async () => {
            try {
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                setTimeout(async () => {
                    const rawAnswer = JSON.stringify(pc.localDescription);
                    const answerB64 = btoa(rawAnswer);
                    const compressedAnswer = LZString.compressToEncodedURIComponent(answerB64);

                    const blob = new Blob([JSON.stringify({ type: "p2p-answer", payload: compressedAnswer }, null, 2)], { type: "application/json" });
                    const fichier = new File([blob], 'liaison-mobile-vers-pc.json', { type: 'application/json' });

                    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
                        await navigator.share({
                            title: 'Fichier de liaison P2P Hub IA',
                            text: 'Voici le fichier JSON de réponse pour établir la connexion avec le Hub.',
                            files: [fichier],
                        });
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = "liaison-mobile-vers-pc.json";
                        a.click();

                        window.location.href = `mailto:?subject=Fichier%20de%20liaison%20Hub%20IA&body=Bonjour,%20veuillez%20trouver%20ci-joint%20(ou%20télécharger)%20le%20fichier%20JSON%20généré%20pour%20la%20connexion.`;
                    }

                    statusBadge.innerText = "Réponse partagée !";
                    toggleMenu();
                }, 1000);
            } catch (err) {
                alert("Erreur lors de la génération ou du partage de la réponse : " + err.message);
            }
        };

        // --- MODE CAMÉRA (MIS EN ATTENTE / RÉGLAGE FUTUR) ---
        let html5QrCode = null;
        document.getElementById('btn-scanner-qr').onclick = () => {
            alert("Le module caméra est mis en pause (en attente de HTTPS). Utilisez l'import de fichier JSON au-dessus.");
        };

        document.getElementById('btn-fermer-qr').onclick = () => {
            document.getElementById('qr-modal').style.display = 'none';
        };

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const texte = userInput.value.trim();
            if (!texte) return;

            if (!dataChannel || dataChannel.readyState !== 'open') {
                alert("La liaison P2P n'est pas établie. Chargez le fichier JSON du PC via le menu ☰.");
                return;
            }

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = texte;
            chatContainer.appendChild(userDiv);
            userInput.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            dataChannel.send(texte);
        };
    </script>
</body>
</html>
