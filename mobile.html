<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub IA - Chat Formulaire Direct</title>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --panel-alt: #2b3847;
            --text: #c5c6c7;
            --text-dim: #8892b0;
            --cyan: #00d9ff;
            --hair: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--hair);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
            font-size: 15px;
            color: #fff;
        }

        .settings-toggle {
            background: none;
            border: 1px solid var(--hair);
            color: var(--text-dim);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        #config-panel {
            background: var(--panel-alt);
            border-bottom: 1px solid var(--hair);
            padding: 10px 16px;
            display: none;
            gap: 8px;
            align-items: center;
        }

        #config-panel input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--hair);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        #config-panel button {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.user {
            background: var(--panel-alt);
            color: #fff;
            align-self: flex-end;
            border: 1px solid var(--hair);
            border-bottom-right-radius: 2px;
        }

        .message.hub {
            background: #000;
            color: #fff;
            align-self: flex-start;
            border: 1px solid var(--cyan);
            border-bottom-left-radius: 2px;
        }

        /* Formulaire en bas */
        form {
            background: var(--panel);
            border-top: 1px solid var(--hair);
            padding: 12px;
            display: flex;
            gap: 10px;
            margin: 0;
        }

        textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--hair);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            resize: none;
            height: 22px;
            font-family: inherit;
        }

        #btn-envoyer {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Chat Hub Mobile (Formulaire)</h2>
        <button class="settings-toggle" id="btn-toggle-config" type="button">⚙️ Source URL</button>
    </header>

    <div id="config-panel">
        <input type="text" id="input-url" placeholder="URL du serveur (ex: http://192.168.0.35:8000/hub-state.json)">
        <button id="btn-save-url" type="button">OK</button>
    </div>

    <div id="chat-container">
        <div class="message hub">Mode formulaire direct initialisé.</div>
    </div>

    <!-- On utilise un formulaire standard pour forcer l'envoi brut -->
    <form id="chat-form">
        <textarea id="user-input" placeholder="Écrire un message..."></textarea>
        <button id="btn-envoyer" type="submit">➤</button>
    </form>

    <script>
        const inputUrl = document.getElementById('input-url');
        const btnSaveUrl = document.getElementById('btn-save-url');
        const configPanel = document.getElementById('config-panel');
        const btnToggleConfig = document.getElementById('btn-toggle-config');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');

        let serverUrl = localStorage.getItem('hub_server_url') || '';
        inputUrl.value = serverUrl;

        btnToggleConfig.onclick = () => {
            configPanel.style.display = configPanel.style.display === 'flex' ? 'none' : 'flex';
        };

        btnSaveUrl.onclick = () => {
            serverUrl = inputUrl.value.trim();
            localStorage.setItem('hub_server_url', serverUrl);
            configPanel.style.display = 'none';
            alert("URL enregistrée : " + serverUrl);
        };

        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const texte = userInput.value.trim();
            if (!texte) return;

            if (!serverUrl) {
                alert("Veuillez configurer l'URL du serveur via 'Source URL'.");
                configPanel.style.display = 'flex';
                return;
            }

            // Affiche immédiatement le message utilisateur à l'écran
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = texte;
            chatContainer.appendChild(userDiv);

            userInput.value = "";

            try {
                // Envoi direct via fetch basique
                await fetch(serverUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dernierMessageUser: texte,
                        dernierMessageHub: "En attente...",
                        reflexion: "Transmis via formulaire"
                    })
                });

                const hubDiv = document.createElement('div');
                hubDiv.className = 'message hub';
                hubDiv.innerText = "Message envoyé au PC !";
                chatContainer.appendChild(hubDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (err) {
                const errDiv = document.createElement('div');
                errDiv.className = 'message hub';
                errDiv.innerText = "Erreur d'envoi réseau.";
                chatContainer.appendChild(errDiv);
            }
        };
    </script>
</body>
</html>
