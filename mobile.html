<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub IA - Chat P2P Direct</title>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --panel-alt: #2b3847;
            --text: #c5c6c7;
            --text-dim: #8892b0;
            --cyan: #00d9ff;
            --hair: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--hair);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
            font-size: 15px;
            color: #fff;
        }

        .settings-toggle {
            background: none;
            border: 1px solid var(--hair);
            color: var(--text-dim);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        #config-panel {
            background: var(--panel-alt);
            border-bottom: 1px solid var(--hair);
            padding: 10px 16px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        #config-panel textarea, #config-panel input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--hair);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
            box-sizing: border-box;
            resize: none;
            height: 40px;
        }

        #config-panel button {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.user {
            background: var(--panel-alt);
            color: #fff;
            align-self: flex-end;
            border: 1px solid var(--hair);
            border-bottom-right-radius: 2px;
        }

        .message.hub {
            background: #000;
            color: #fff;
            align-self: flex-start;
            border: 1px solid var(--cyan);
            border-bottom-left-radius: 2px;
        }

        form {
            background: var(--panel);
            border-top: 1px solid var(--hair);
            padding: 12px;
            display: flex;
            gap: 10px;
            margin: 0;
        }

        textarea#user-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--hair);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            resize: none;
            height: 22px;
            font-family: inherit;
        }

        #btn-envoyer {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Chat Hub Mobile (P2P Direct)</h2>
        <button class="settings-toggle" id="btn-toggle-config" type="button">⚙️ Connexion P2P</button>
    </header>

    <div id="config-panel">
        <div style="font-size: 12px; color: var(--cyan); font-weight: bold;" id="p2p-status">Statut : Non connecté</div>
        <textarea id="input-offer-remote" placeholder="Coller l'offre du PC ici..."></textarea>
        <button id="btn-connect-remote" type="button">1. Établir la connexion</button>
        <div style="font-size: 11px; color: var(--text-dim); margin-top: 4px;" id="output-answer-container"></div>
    </div>

    <div id="chat-container">
        <div class="message hub">Mode P2P initialisé. Ouvrez le panneau 'Connexion P2P' en haut à droite pour lier l'appareil.</div>
    </div>

    <form id="chat-form">
        <textarea id="user-input" placeholder="Écrire un message..."></textarea>
        <button id="btn-envoyer" type="submit">➤</button>
    </form>

    <script>
        const btnToggleConfig = document.getElementById('btn-toggle-config');
        const configPanel = document.getElementById('config-panel');
        const p2pStatus = document.getElementById('p2p-status');
        const inputOfferRemote = document.getElementById('input-offer-remote');
        const btnConnectRemote = document.getElementById('btn-connect-remote');
        const outputAnswerContainer = document.getElementById('output-answer-container');
        
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');

        // Configuration WebRTC P2P
        let pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        let dataChannel = null;

        btnToggleConfig.onclick = () => {
            configPanel.style.display = configPanel.style.display === 'flex' ? 'none' : 'flex';
        };

        // Si l'URL contient une offre directe (?offer=...), on la récupère automatiquement
        const urlParams = new URLSearchParams(window.location.search);
        const autoOffer = urlParams.get('offer');
        if (autoOffer) {
            inputOfferRemote.value = autoOffer;
            configPanel.style.display = 'flex';
        }

        // Établissement de la connexion P2P en tant que Répondant (ou Initiateur)
        btnConnectRemote.onclick = async () => {
            try {
                const offerB64 = inputOfferRemote.value.trim();
                if (!offerB64) {
                    alert("Veuillez coller l'offre valide.");
                    return;
                }

                p2pStatus.innerText = "Statut : Connexion en cours...";
                
                // Réception de l'offre distante
                const offerDesc = JSON.parse(atob(offerB64));
                await pc.setRemoteDescription(new RTCSessionDescription(offerDesc));

                // Création de la réponse
                const answerDesc = await pc.createAnswer();
                await pc.setLocalDescription(answerDesc);

                setTimeout(() => {
                    const answerB64 = btoa(JSON.stringify(pc.localDescription));
                    p2pStatus.innerText = "Statut : Prêt ! Copiez la réponse ci-dessous :";
                    outputAnswerContainer.innerHTML = `<textarea readonly style="height:40px; background:#000; color:#00d9ff;" onclick="this.select()">${answerB64}</textarea>`;
                }, 1000);

            } catch (err) {
                p2pStatus.innerText = "Statut : Erreur de connexion";
                alert("Erreur P2P : " + err.message);
            }
        };

        // Gestion du canal de données direct
        pc.ondatachannel = (e) => {
            dataChannel = e.channel;
            setupDataChannel();
        };

        function setupDataChannel() {
            dataChannel.onopen = () => {
                p2pStatus.innerText = "Statut : Connecté en direct ! ✅";
                configPanel.style.display = 'none';
                const successDiv = document.createElement('div');
                successDiv.className = 'message hub';
                successDiv.innerText = "Liaison P2P établie avec succès !";
                chatContainer.appendChild(successDiv);
            };

            dataChannel.onmessage = (e) => {
                const hubDiv = document.createElement('div');
                hubDiv.className = 'message hub';
                hubDiv.innerText = e.data;
                chatContainer.appendChild(hubDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };
        }

        // Envoi du message en P2P direct
        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const texte = userInput.value.trim();
            if (!texte) return;

            if (!dataChannel || dataChannel.readyState !== 'open') {
                alert("La connexion P2P n'est pas active. Ouvrez le panneau 'Connexion P2P'.");
                configPanel.style.display = 'flex';
                return;
            }

            // Affichage local du message utilisateur
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = texte;
            chatContainer.appendChild(userDiv);

            userInput.value = "";

            // Envoi direct par le canal P2P
            dataChannel.send(texte);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };
    </script>
</body>
</html>
