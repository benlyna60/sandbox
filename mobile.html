<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub IA - Chat P2P par Fichier</title>
    <!-- Intégration de LZ-String pour compresser les clés de liaison P2P -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --panel-alt: #2b3847;
            --text: #c5c6c7;
            --text-dim: #8892b0;
            --cyan: #00d9ff;
            --hair: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--hair);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
            font-size: 15px;
            color: #fff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #status-badge {
            font-size: 11px;
            background: rgba(255, 176, 0, 0.1);
            color: #ffb000;
            border: 1px solid #ffb000;
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* Menu Hamburger & Tiroir */
        .hamburger-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        #nav-menu {
            position: fixed;
            top: 0;
            right: -260px;
            width: 240px;
            height: 100%;
            background: var(--panel);
            border-left: 1px solid var(--hair);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 12px;
            transition: right 0.3s ease;
            z-index: 1000;
            box-sizing: border-box;
        }

        #nav-menu.active {
            right: 0;
        }

        #nav-menu h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: var(--cyan);
            border-bottom: 1px solid var(--hair);
            padding-bottom: 8px;
        }

        .menu-action-btn {
            background: var(--panel-alt);
            color: #fff;
            border: 1px solid var(--hair);
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            font-weight: 500;
            transition: background 0.2s;
        }

        .menu-action-btn:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--cyan);
        }

        /* Overlay sombre lorsque le menu est ouvert */
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }
        #menu-overlay.active {
            display: block;
        }

        /* Panneau de configuration P2P mobile par fichier */
        #mobile-p2p-panel {
            background: var(--panel);
            border-bottom: 1px solid var(--cyan);
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }

        #mobile-p2p-panel input[type="file"] {
            font-size: 11px;
            color: var(--text);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background: var(--panel-alt);
            color: #fff;
            align-self: flex-end;
            border: 1px solid var(--hair);
            border-bottom-right-radius: 2px;
        }

        .message.hub {
            background: #000;
            color: #fff;
            align-self: flex-start;
            border: 1px solid var(--cyan);
            border-bottom-left-radius: 2px;
        }

        form {
            background: var(--panel);
            border-top: 1px solid var(--hair);
            padding: 12px;
            display: flex;
            gap: 10px;
            margin: 0;
        }

        textarea#user-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--hair);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            resize: none;
            height: 22px;
            font-family: inherit;
        }

        #btn-envoyer {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Chat Hub Mobile</h2>
        <div class="header-right">
            <span id="status-badge">Déconnecté</span>
            <button class="hamburger-btn" id="btn-toggle-menu" aria-label="Menu">☰</button>
        </div>
    </header>

    <!-- Overlay et Menu Hamburger -->
    <div id="menu-overlay"></div>
    <nav id="nav-menu">
        <h3>Options & Actions</h3>
        <button class="menu-action-btn" id="menu-clear">🧹 Nettoyer la mare</button>
        <button class="menu-action-btn" id="menu-new-conv">✨ Nouvelle conversation</button>
    </nav>

    <!-- Panneau mobile pour charger le fichier du PC et générer la réponse -->
    <div id="mobile-p2p-panel">
        <div style="color:var(--cyan); font-weight:bold;">🔗 Liaison P2P par Fichier :</div>
        <div style="display:flex; flex-direction:column; gap:4px;">
            <span style="font-size:10px; color:var(--text-dim);">1. Glisser ou sélectionner le fichier du PC (`liaison-pc-vers-mobile.json`) :</span>
            <input type="file" id="input-file-offer" accept=".json">
        </div>
        <button id="btn-generer-reponse-json" style="background:var(--cyan); color:#000; font-weight:bold; padding:6px; border-radius:4px; border:none; cursor:pointer; margin-top:2px;">2. Générer et télécharger le fichier de réponse</button>
    </div>

    <div id="chat-container">
        <div class="message hub">Chargez le fichier de liaison du PC ci-dessus pour initialiser la discussion P2P.</div>
    </div>

    <form id="chat-form">
        <textarea id="user-input" placeholder="Écrire un message..."></textarea>
        <button id="btn-envoyer" type="submit">➤</button>
    </form>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');
        const statusBadge = document.getElementById('status-badge');

        // --- GESTION DU MENU HAMBURGER ---
        const navMenu = document.getElementById('nav-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const btnToggleMenu = document.getElementById('btn-toggle-menu');

        function toggleMenu() {
            navMenu.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        }

        btnToggleMenu.onclick = toggleMenu;
        menuOverlay.onclick = toggleMenu;

        // --- ACTIONS DU MENU ---
        document.getElementById('menu-clear').onclick = () => {
            chatContainer.innerHTML = '<div class="message hub">Mare nettoyée. Prêt pour de nouveaux tests.</div>';
            toggleMenu();
        };

        document.getElementById('menu-new-conv').onclick = () => {
            chatContainer.innerHTML = '<div class="message hub">Nouvelle conversation initialisée. Chargez le fichier de liaison ou continuez via le canal actif.</div>';
            toggleMenu();
        };

        // --- CONFIGURATION WEBRTC P2P VIA FICHIER ---
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        let dataChannel = null;

        // Écouter les canaux de données entrants créés par le PC
        pc.ondatachannel = (e) => {
            dataChannel = e.channel;
            setupDataChannel();
        };

        function setupDataChannel() {
            dataChannel.onopen = () => {
                statusBadge.innerText = "Connecté ✅";
                statusBadge.style.background = "rgba(0, 255, 102, 0.1)";
                statusBadge.style.color = "#00ff66";
                statusBadge.style.borderColor = "#00ff66";
            };

            dataChannel.onmessage = (e) => {
                const texteReponse = e.data;
                const hubDiv = document.createElement('div');
                hubDiv.className = 'message hub';
                hubDiv.innerText = texteReponse;
                chatContainer.appendChild(hubDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };
        }

        // 1. Charger le fichier de liaison envoyé par le PC
        document.getElementById('input-file-offer').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                const data = JSON.parse(text);

                let decompressedOffer = data.payload;
                try {
                    const maybeJson = LZString.decompressFromEncodedURIComponent(data.payload);
                    if (maybeJson) decompressedOffer = maybeJson;
                } catch (err) {}

                const offerDesc = JSON.parse(atob(decompressedOffer));
                await pc.setRemoteDescription(new RTCSessionDescription(offerDesc));

                statusBadge.innerText = "Offre reçue !";
            } catch (err) {
                alert("Erreur de lecture du fichier offre : " + err.message);
            }
        };

        // 2. Générer la réponse et télécharger le fichier JSON à renvoyer au PC
        document.getElementById('btn-generer-reponse-json').onclick = async () => {
            try {
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                setTimeout(() => {
                    const rawAnswer = JSON.stringify(pc.localDescription);
                    const answerB64 = btoa(rawAnswer);
                    const compressedAnswer = LZString.compressToEncodedURIComponent(answerB64);

                    // Création du fichier JSON de réponse
                    const blob = new Blob([JSON.stringify({ type: "p2p-answer", payload: compressedAnswer }, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "liaison-mobile-vers-pc.json";
                    a.click();

                    statusBadge.innerText = "Réponse générée !";
                }, 1000);
            } catch (err) {
                alert("Erreur lors de la génération de la réponse : " + err.message);
            }
        };

        // Envoi d'un message textuel via le canal P2P direct
        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const texte = userInput.value.trim();
            if (!texte) return;

            if (!dataChannel || dataChannel.readyState !== 'open') {
                alert("La liaison P2P n'est pas encore établie. Chargez le fichier du PC et renvoyez la réponse.");
                return;
            }

            // Affichage local immédiat
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = texte;
            chatContainer.appendChild(userDiv);
            userInput.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Envoi direct au PC par WebRTC
            dataChannel.send(texte);
        };
    </script>
</body>
</html>
