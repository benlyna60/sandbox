<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>IA Mobile : Module Python (Spécialisé)</title>
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: #00ff66;
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }
        h1 { color: #fff; }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        button:hover { background: #00cc52; }
        .panel { background-color: #1a1a1a; padding: 15px; border-radius: 6px; border: 1px solid #333; margin-bottom: 15px; }
        .box {
            border: 1px solid #444;
            background: #000;
            color: #00ff66;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            min-height: 120px;
            max-height: 350px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 1.1em;
        }
    </style>
</head>
<body onload="initApp()">

    <h1>IA Mobile : Module Python</h1>
    
    <div class="panel">
        <button onclick="chargerMemoireJSON()" id="btn-fichier">1. Choisir ton fichier memoire_python.json</button>
        <button onclick="lancerApprentissage()" style="background-color: #00cc52;">2. Lancer l'Apprentissage Python Ciblé</button>
        <button onclick="arreterApprentissage()" style="background-color: #b71c1c; color: #fff;">3. Stop</button>
    </div>

    <div class="panel">
        <h3 style="margin-top:0; color:#fff;">Journal d'activité / Génération :</h3>
        <div id="status">En attente de liaison JSON...</div>
        <div class="box" id="output">Rien pour l'instant.</div>
    </div>

<script>
    let fichierHandle = null;
    let memoire = {};
    let enCours = false;

    // Mots-clés ciblés pour explorer l'écosystème Python, la syntaxe et les bibliothèques
    const motsClefsPython = [
        "Python programming language",
        "Python software foundation",
        "NumPy library Python",
        "Pandas software library",
        "TensorFlow machine learning",
        "OpenCV computer vision Python",
        "Django web framework Python",
        "Asyncio Python module"
    ];

    async function ouvrirBDD() {
        return new Promise(res => {
            const req = indexedDB.open("MonAppDB_Python", 1);
            req.onupgradeneeded = () => req.result.createObjectStore("handles");
            req.onsuccess = () => res(req.result);
        });
    }

    async function initApp() {
        try {
            const db = await ouvrirBDD();
            fichierHandle = await new Promise(res => {
                const req = db.transaction("handles").objectStore("handles").get("pythonKey");
                req.onsuccess = () => res(req.result);
            });
            if (fichierHandle) {
                const fichier = await fichierHandle.getFile();
                const contenu = await fichier.text();
                const json = contenu ? JSON.parse(contenu) : {};
                memoire = json.memoire_paires || json;
                let nb = Object.keys(memoire).length;
                document.getElementById('btn-fichier').innerText = "✔ Fichier lié (memoire_python.json)";
                document.getElementById('status').innerText = `Mémoire chargée (${nb} racines). Prêt.`;
            }
        } catch (e) {
            console.error("Erreur d'initialisation :", e);
        }
    }

    async function chargerMemoireJSON() {
        try {
            [fichierHandle] = await window.showOpenFilePicker({
                types: [{ description: 'Fichiers JSON', accept: {'application/json': ['.json']} }]
            });
            const db = await ouvrirBDD();
            db.transaction("handles", "readwrite").objectStore("handles").put(fichierHandle, "pythonKey");

            const fichier = await fichierHandle.getFile();
            const contenu = await fichier.text();
            const json = contenu ? JSON.parse(contenu) : {};
            memoire = json.memoire_paires || json;
            let nb = Object.keys(memoire).length;
            
            document.getElementById('btn-fichier').innerText = "✔ Fichier lié (memoire_python.json)";
            document.getElementById('status').innerText = `Fichier JSON lié et chargé avec succès (${nb} racines) ! Prêt.`;
        } catch (err) {
            if (err.name !== 'AbortError') {
                document.getElementById('status').innerText = "Erreur de liaison : " + err.message;
            }
        }
    }

    async function sauvegarderMemoireJSON() {
        if (!fichierHandle) return;
        try {
            const writable = await fichierHandle.createWritable();
            await writable.write(JSON.stringify({ memoire_paires: memoire }, null, 2));
            await writable.close();
        } catch (e) {
            console.error("Erreur de sauvegarde :", e);
        }
    }

    async function fetchArticlePython() {
        try {
            let query = motsClefsPython[Math.floor(Math.random() * motsClefsPython.length)];
            
            // Recherche ciblée sur Wikipédia
            const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=10&format=json&origin=*`;
            const searchRes = await fetch(searchUrl).then(r => r.json());
            const results = searchRes.query?.search || [];
            
            if (results.length > 0) {
                let hit = results[Math.floor(Math.random() * results.length)];
                let title = hit.title;

                const resPage = await fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(title)}&format=json&origin=*`);
                const dataPage = await resPage.json();
                const pages = dataPage.query.pages;
                const pageId = Object.keys(pages)[0];
                return { title, text: pages[pageId].extract || "" };
            }
            return { title: "", text: "" };
        } catch (e) {
            return { title: "", text: "" };
        }
    }

    function ingérerTexte(texte) {
        for (let i = 0; i < texte.length - 1; i++) {
            let c1 = texte[i];
            let c2 = texte[i+1];
            if (!memoire[c1]) memoire[c1] = {};
            memoire[c1][c2] = (memoire[c1][c2] || 0) + 1;
        }
    }

    function genererTexte() {
        let keys = Object.keys(memoire);
        if (keys.length === 0) return "Mémoire vide, lance d'abord l'apprentissage !";
        let courant = keys[Math.floor(Math.random() * keys.length)];
        let resultat = courant;
        for (let i = 0; i < 300; i++) {
            let suivants = memoire[courant];
            if (!suivants) break;
            let total = Object.values(suivants).reduce((a, b) => a + b, 0);
            let rand = Math.random() * total;
            let cumul = 0;
            let prochain = "";
            for (let [char, poids] of Object.entries(suivants)) {
                cumul += poids;
                if (rand <= cumul) {
                    prochain = char;
                    break;
                }
            }
            if (!prochain) break;
            resultat += prochain;
            courant = prochain;
        }
        return resultat;
    }

    async function lancerApprentissage() {
        if (!fichierHandle) {
            alert("Veuillez d'abord lier le fichier memoire_python.json !");
            return;
        }
        enCours = true;
        document.getElementById('status').innerText = "Apprentissage Python ciblé en cours...";

        while (enCours) {
            let resArticle = await fetchArticlePython();
            if (resArticle.text) {
                ingérerTexte(resArticle.text);
                await sauvegarderMemoireJSON();
                let gen = genererTexte();
                let nb = Object.keys(memoire).length;
                document.getElementById('status').innerText = `✔ Analyse Python : "${resArticle.title}" (${nb} racines)`;
                document.getElementById('output').innerText = gen;
            }
            await new Promise(r => setTimeout(r, 4000));
        }
    }

    function arreterApprentissage() {
        enCours = false;
        document.getElementById('status').innerText = "En pause. Données sauvegardées.";
    }
</script>

</body>
</html>
