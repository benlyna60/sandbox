<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthétiseur Pyramidal Multi-Sources V5</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#20242a}
body{display:flex;flex-direction:column}
header{flex:0 0 auto;padding:14px 18px;background:#fff;border-bottom:1px solid #e1e5ea;display:flex;align-items:center;justify-content:space-between;gap:12px}

header small{color:#6b7280;font-size:12px}
#clear{border:1px solid #d5dae0;background:#fff;color:#333;border-radius:8px;padding:7px 11px;cursor:pointer}
#clear:hover{background:#f0f2f5}
#chat{flex:1;overflow-y:auto;padding:20px max(14px,calc((100% - 900px)/2));scroll-behavior:smooth}
.message{max-width:850px;margin:0 auto 18px}
.user{display:flex;justify-content:flex-end}
.user .bubble{background:#1f2937;color:#fff;border-radius:16px 16px 4px 16px;padding:11px 14px;max-width:75%;white-space:pre-wrap;overflow-wrap:anywhere}
.assistant{position:relative}

.answer-actions{margin-top:8px;display:flex;justify-content:flex-end}
.copy{border:1px solid #d8dde3;background:#fff;color:#555;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12px}

.sources{margin-top:8px;padding-left:3px;color:#9299a3;font-size:10px;line-height:1.4}
.step-line{max-width:850px;margin:3px auto 14px;color:#737b86;font-size:13px;line-height:1.4;padding:2px 0;opacity:0;animation:stepIn .18s ease forwards}

.composer-inner{max-width:850px;margin:auto;display:flex;gap:8px;align-items:flex-end}
#input{flex:1;resize:none;min-height:44px;max-height:150px;padding:11px 13px;border:1px solid #cfd5dc;border-radius:11px;outline:none;font:inherit;line-height:1.4;background:#fff}
#input:focus{border-color:#8d98a6}
#send{flex:0 0 auto;height:44px;padding:0 17px;border:0;border-radius:10px;background:#1f2937;color:#fff;cursor:pointer;font-weight:600}

header{padding:12px}
header h1{font-size:16px}
#chat{padding:15px 10px}
.user .bubble{max-width:88%}
.answer{padding:14px}

.composer-inner{gap:6px}

}
</style>

<body>

<header>
<div>
<h1>Synthétiseur Pyramidal Multi-Sources V5</h1>
<small>Analyse, recherche, raisonnement et vérification multi-sources</small>
</div>
<button id="clear" type="button">Effacer</button>
</header>

<main id="chat"></main>

<div class="composer">
<div class="composer-inner">
<textarea id="input" placeholder="Pose ta question..." aria-label="Question"></textarea>
<button id="send" type="button">Envoyer</button>
</div>
<div id="status" class="status"></div>
</div>

<script>
"use strict";

/* =========================================================
   SYNTHÉTISEUR PYRAMIDAL MULTI-SOURCES V5
   ========================================================= */

class PyramidV5{

constructor(stepCallback){

this.stepCallback=typeof stepCallback==="function"?stepCallback:function(){};

this.sources=[
{name:"Wikipédia",url:"https://fr.wikipedia.org/w/api.php"},
{name:"Wiktionnaire",url:"https://fr.wiktionary.org/w/api.php"},
{name:"Wikiversité",url:"https://fr.wikiversity.org/w/api.php"},
{name:"Wikivoyage",url:"https://fr.wikivoyage.org/w/api.php"},
{name:"Wikisource",url:"https://fr.wikisource.org/w/api.php"},
{name:"Wikiquote",url:"https://fr.wikiquote.org/w/api.php"},
{name:"Wikibooks",url:"https://fr.wikibooks.org/w/api.php"}
];

this.stop=new Set((
"a afin ai ainsi après au aux avec avoir avant c car ce ceci cela celle celles celui ceux comme dans de des du donc elle elles en entre est et eu faire faut il ils je l la le les leur leurs lui mais me mes moi mon même ne nos notre nous on ont ou par pas pour pourquoi que quel quelle quelles quels qu est qui quoi sa sans se sera sont sur ta te tes toi ton tous tout toute toutes très tu un une vos votre vous vous y d n s c l m t j"
).normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/\s+/));

this.cache=new Map();
this.searchCache=new Map();
this.busy=false;
}

/* ---------------------------------------------------------
   ÉTAPES
   --------------------------------------------------------- */

step(text,number){
this.stepCallback({number:number,text:text});
}

/* ---------------------------------------------------------
   NORMALISATION
   --------------------------------------------------------- */

norm(value){
return String(value||"")
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.toLowerCase()
.replace(/[’‘ʼʻ`´]/g,"'")
.replace(/[^\p{L}\p{N}'\s-]/gu," ")
.replace(/\s+/g," ")
.trim();
}

words(value){
return this.norm(value).split(/\s+/).filter(Boolean);
}

unique(arr){
return [...new Set(arr)];
}

/* ---------------------------------------------------------
   ENTITÉS HTML
   --------------------------------------------------------- */

decodeEntities(value){

let text=String(value||"");

try{
const area=document.createElement("textarea");
area.innerHTML=text;
text=area.value;
area.innerHTML=text;
text=area.value;
}catch(e){}

return text;
}

/* ---------------------------------------------------------
   NETTOYAGE
   --------------------------------------------------------- */

clean(value){

let text=String(value||"");

if(!text)return "";

text=text
.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g," ")
.replace(/[\u200B-\u200D\u2060\uFEFF]/g,"")
.replace(/\u00A0/g," ");

text=this.decodeEntities(text);

text=text
.replace(/<ref\b[^>]*>[\s\S]*?<\/ref>/gi," ")
.replace(/<gallery\b[^>]*>[\s\S]*?<\/gallery>/gi," ")
.replace(/<math\b[^>]*>[\s\S]*?<\/math>/gi," ")
.replace(/<nowiki\b[^>]*>[\s\S]*?<\/nowiki>/gi," ")
.replace(/<source\b[^>]*>[\s\S]*?<\/source>/gi," ")
.replace(/<syntaxhighlight\b[^>]*>[\s\S]*?<\/syntaxhighlight>/gi," ")
.replace(/<timeline\b[^>]*>[\s\S]*?<\/timeline>/gi," ");

text=text
.replace(/<br\s*\/?>/gi," ")
.replace(/<\/p\s*>/gi," ")
.replace(/<\/div\s*>/gi," ")
.replace(/<\/li\s*>/gi," ")
.replace(/<\/h[1-6]\s*>/gi," ");

text=text.replace(/\[\[\s*([^|\]]+?)\s*\|\s*([^\]]+?)\s*\]\]/g,"$2");
text=text.replace(/\[\[\s*([^\]]+?)\s*\]\]/g,"$1");

text=text.replace(/\[\[\s*(?:Fichier|File|Image)\s*:[\s\S]*?\]\]/gi," ");

for(let i=0;i<6;i++){
text=text.replace(/\{\{[^{}]*\}\}/g," ");
}

text=text.replace(/<[^>]*>/g," ");

text=this.decodeEntities(text);

text=text.replace(/\bhttps?:\/\/[^\s<>"']+/gi," ");

text=text
.replace(/&(?:amp|lt|gt|quot|apos|nbsp|#\d+|#x[\da-f]+);/gi," ")
.replace(/\[\s*\]/g," ")
.replace(/\{\s*\}/g," ")
.replace(/\|\s*\|+/g," ")
.replace(/^\s*[|=#:;]+\s*/g," ");

text=text
.replace(/[’‘ʼʻ`´]/g,"'")
.replace(/[“”„‟]/g,'"')
.replace(/[–—―]/g,"-")
.replace(/…/g,"...");

text=text
.replace(/([!?.,])\1{2,}/g,"$1")
.replace(/[ \t]+/g," ")
.replace(/\s+\n\s*/g,"\n")
.replace(/\n{3,}/g,"\n\n")
.trim();

text=text
.replace(/^[|=:;,.\-]+\s*/,"")
.replace(/\s*[|=:;]+\s*$/,"")
.trim();

return text;
}

cleanFinalText(value){

let text=this.clean(value);

if(!text)return "";

text=text
.replace(/\r/g,"")
.replace(/[ \t]+\n/g,"\n")
.replace(/\n[ \t]+/g,"\n")
.replace(/\n{3,}/g,"\n\n")
.trim();

text=text.replace(/(^|\n)\s*(?:[-*•▪◦]|\d+[.)])\s+/g,"$1");

text=text.replace(/(^|\n)\s*(?:sources?|références?|notes?|bibliographie)\s*:?\s*(?=\n|$)/gi,"$1");

text=text.replace(/&(?:[a-z][a-z0-9]+|#\d+|#x[\da-f]+);/gi," ");

text=this.clean(text);

return text.trim();
}

/* ---------------------------------------------------------
   ANALYSE DE LA QUESTION
   --------------------------------------------------------- */

extractTerms(question){

const ws=this.words(question);

return this.unique(
ws.filter(w=>{
if(w.length<3)return false;
if(this.stop.has(w))return false;
if(/^\d+$/.test(w))return false;
return true;
})
).slice(0,22);
}

extractPhrases(question){

const clean=this.clean(question);
const phrases=[];

const quoted=clean.match(/["«](.+?)["»]/g)||[];

quoted.forEach(x=>{
const p=x.replace(/^["«]|["»]$/g,"").trim();
if(p.length>2)phrases.push(p);
});

const ws=this.words(clean);

for(let i=0;i<ws.length-1;i++){
const a=ws[i],b=ws[i+1];

if(
a.length>=3&&
b.length>=3&&
!this.stop.has(a)&&
!this.stop.has(b)
){
phrases.push(a+" "+b);
}
}

for(let i=0;i<ws.length-2;i++){
const a=ws[i],b=ws[i+1],c=ws[i+2];

if(
a.length>=3&&
b.length>=3&&
c.length>=3&&
!this.stop.has(a)
){
phrases.push(a+" "+b+" "+c);
}
}

return this.unique(phrases).slice(0,15);
}

/* ---------------------------------------------------------
   STRUCTURE SÉMANTIQUE GÉNÉRIQUE
   --------------------------------------------------------- */

detectSuperlative(question){

const q=this.norm(question);

const patterns=[
{regex:/\b(le|la|les|l')?\s*plus\s+([a-zÀ-ÿ-]+)/i,type:"max",value:"$2"},
{regex:/\b(le|la|les|l')?\s*moins\s+([a-zÀ-ÿ-]+)/i,type:"min",value:"$2"},
{regex:/\bmeilleur(?:e|s)?\b/i,type:"max",value:"meilleur"},
{regex:/\bmeilleur(?:e|s)?\b/i,type:"max",value:"meilleur"},
{regex:/\bpire\b/i,type:"min",value:"pire"}
];

for(const p of patterns){

const m=q.match(p.regex);

if(m){

return{
active:true,
type:p.type,
property:m[2]||m[0]
};

}
}

return{
active:false,
type:null,
property:null
};
}

detectQuestionType(question){

const q=this.norm(question);

if(/\b(pourquoi|raison|cause)\b/.test(q))return"causal";
if(/\b(comment|de quelle maniere|de quelle façon)\b/.test(q))return"procedural";
if(/\b(quand|date|annee|année)\b/.test(q))return"temporal";
if(/\b(ou|où|lieu|endroit)\b/.test(q))return"location";
if(/\b(combien|nombre|quantite|quantité)\b/.test(q))return"quantity";
if(/\b(qui)\b/.test(q))return"person";
if(/\b(definition|définition|signifie|signification|c'est quoi|qu'est-ce que|qu est ce que)\b/.test(q))return"definition";
if(/\b(capital|capitale|chef-lieu)\b/.test(q))return"relation";
if(/\b(compar|difference|différence|versus|contre)\b/.test(q))return"comparison";

return"general";
}

extractDomainCandidates(question){

const ws=this.words(question);

const markers=[
"en","dans","d","du","de","des","sur"
];

const found=[];

for(let i=0;i<ws.length;i++){

if(markers.includes(ws[i])){

for(let j=i+1;j<Math.min(i+4,ws.length);j++){

if(
ws[j].length>=4&&
!this.stop.has(ws[j])
){
found.push(ws[j]);
}

}

}

}

return this.unique(found).slice(0,8);
}

analyzeQuestion(question){

const original=this.clean(question);
const terms=this.extractTerms(original);
const phrases=this.extractPhrases(original);
const superlative=this.detectSuperlative(original);
const type=this.detectQuestionType(original);
const domains=this.extractDomainCandidates(original);

let relation=null;

if(type==="relation"){
const q=this.norm(original);

if(/\bcapitale\b/.test(q))relation="capital_of";
else if(/\blangue\b/.test(q))relation="language_of";
else if(/\bpopulation\b/.test(q))relation="population_of";
else if(/\bsuperficie\b/.test(q))relation="area_of";
else relation="unknown";
}

return{
original,
terms,
phrases,
superlative,
questionType:type,
domains,
relation
};
}

/* ---------------------------------------------------------
   REQUÊTES
   --------------------------------------------------------- */

buildQueries(analysis){

const queries=[];

if(analysis.original){
queries.push(analysis.original);
}

analysis.phrases.forEach(p=>{
if(p.length>=4)queries.push(p);
});

if(analysis.superlative.active){

const property=analysis.superlative.property;

if(analysis.domains.length){
queries.push(
property+" "+analysis.domains.slice(0,3).join(" ")
);
}

queries.push(
"plus "+property+" "+analysis.terms.slice(0,5).join(" ")
);

}

if(analysis.relation==="capital_of"){
queries.push(
"capitale "+analysis.terms.slice(0,6).join(" ")
);
}

if(analysis.terms.length){
queries.push(
analysis.terms.slice(0,7).join(" ")
);
}

return this.unique(
queries
.map(x=>this.clean(x))
.filter(x=>x.length>=2)
).slice(0,7);
}

/* ---------------------------------------------------------
   API
   --------------------------------------------------------- */

async api(url,params){

const query=new URLSearchParams({
...params,
format:"json",
origin:"*"
});

const response=await fetch(
url+"?"+query.toString(),
{
method:"GET",
cache:"no-store"
}
);

if(!response.ok){
throw new Error("HTTP "+response.status);
}

return await response.json();
}

/* ---------------------------------------------------------
   RECHERCHE
   --------------------------------------------------------- */

async searchSource(source,query){

const key=source.url+"|"+query;

if(this.searchCache.has(key)){
return this.searchCache.get(key);
}

try{

const data=await this.api(
source.url,
{
action:"query",
list:"search",
srsearch:query,
srnamespace:"0",
srlimit:"7",
srprop:"snippet|titlesnippet",
utf8:"1"
}
);

const results=data.query&&data.query.search
?data.query.search
:[];

const cleaned=results.map(item=>({
title:this.clean(item.title||""),
snippet:this.clean(item.snippet||""),
source:source.name,
url:source.url
})).filter(x=>x.title);

this.searchCache.set(key,cleaned);

return cleaned;

}catch(error){
return [];
}
}

async searchAll(queries){

const tasks=[];

for(const source of this.sources){

for(const query of queries.slice(0,4)){

tasks.push(
this.searchSource(source,query)
);

}

}

const results=await Promise.all(tasks);

return results.flat();
}

/* ---------------------------------------------------------
   EXTRACTION
   --------------------------------------------------------- */

async fetchExtract(item){

const key=item.source+"|"+item.title;

if(this.cache.has(key)){
return this.cache.get(key);
}

const source=this.sources.find(
s=>s.name===item.source
);

if(!source)return null;

try{

const data=await this.api(
source.url,
{
action:"query",
prop:"extracts",
titles:item.title,
exintro:"0",
explaintext:"1",
exsectionformat:"plain",
exchars:"3500",
redirects:"1"
}
);

const pages=
data.query&&data.query.pages
?data.query.pages:{};

let page=null;

Object.keys(pages).some(id=>{
if(
pages[id]&&
pages[id].extract
){
page=pages[id];
return true;
}
return false;
});

if(!page)return null;

const text=this.cleanFinalText(
page.extract||""
);

if(!text)return null;

const result={
title:this.clean(page.title||item.title),
text:text,
source:item.source,
url:source.url
};

this.cache.set(key,result);

return result;

}catch(error){
return null;
}
}

/* ---------------------------------------------------------
   DÉCOUVERTE DE CONCEPTS
   --------------------------------------------------------- */

discoverConcepts(results,analysis){

const counts=new Map();

const add=(word,weight)=>{

const n=this.norm(word);

if(
n.length<4||
this.stop.has(n)||
/^\d+$/.test(n)
)return;

counts.set(
n,
(counts.get(n)||0)+weight
);
};

results.forEach(r=>{

this.words(r.title).forEach(w=>add(w,5));
this.words(r.snippet).forEach(w=>add(w,1));

});

analysis.terms.forEach(w=>add(w,10));

return [...counts.entries()]
.sort((a,b)=>b[1]-a[1])
.slice(0,24)
.map(x=>x[0]);
}

/* ---------------------------------------------------------
   DEUXIÈME RECHERCHE
   --------------------------------------------------------- */

async secondPass(concepts,analysis){

const queries=[];

if(concepts.length){

queries.push(
concepts.slice(0,7).join(" ")
);

concepts.slice(0,12).forEach(c=>{

if(
!analysis.terms.includes(c)&&
c.length>=4
){
queries.push(c);
}

});

}

if(analysis.relation){

queries.push(
analysis.relation.replace(/_/g," ")+" "+
concepts.slice(0,5).join(" ")
);

}

return await this.searchAll(
this.unique(queries).slice(0,7)
);
}

/* ---------------------------------------------------------
   TYPE D'ENTITÉ APPROXIMATIF
   --------------------------------------------------------- */

inferEntityType(item){

const text=this.norm(
(item.title||"")+" "+
(item.text||item.snippet||"")
);

const title=this.norm(item.title||"");

const scores={
person:0,
place:0,
country:0,
city:0,
organization:0,
work:0,
science:0,
event:0,
other:0
};

const add=(type,words,weight)=>{
words.forEach(w=>{
if(text.includes(w))scores[type]+=weight;
});
};

add("country",[
"pays","etat","république","royaume",
"frontiere","frontière","territoire"
],2);

add("city",[
"ville","commune","municipalite",
"municipalité","agglomeration","agglomération"
],2);

add("place",[
"region","région","continent","province",
"territoire","geographie","géographie"
],1.5);

add("person",[
"né en","née en","écrivain","écrivaine",
"acteur","actrice","politicien","président",
"présidente","scientifique","artiste"
],2);

add("organization",[
"organisation","entreprise","association",
"université","institution","parti"
],2);

add("work",[
"film","roman","album","chanson",
"livre","bande dessinée","série","oeuvre","œuvre"
],3);

add("science",[
"théorie","concept","processus","espèce",
"molécule","réaction","physique","chimie"
],2);

add("event",[
"guerre","bataille","élection","traité",
"événement","evenement","révolution"
],2);

if(/\b(film|album|roman|livre|chanson)\b/.test(title)){
scores.work+=5;
}

let best="other";
let bestScore=0;

Object.keys(scores).forEach(k=>{
if(scores[k]>bestScore){
bestScore=scores[k];
best=k;
}
});

return{
type:best,
scores
};
}

/* ---------------------------------------------------------
   SCORE SÉMANTIQUE
   --------------------------------------------------------- */

termScore(text,analysis){

const n=this.norm(text);
let score=0;

analysis.terms.forEach(term=>{
if(n.includes(term)){
score+=3;
}
});

return score;
}

phraseScore(text,analysis){

const n=this.norm(text);
let score=0;

analysis.phrases.forEach(phrase=>{

const p=this.norm(phrase);

if(
p.length>=5&&
n.includes(p)
){
score+=4;
}

});

return score;
}

domainScore(text,analysis){

const n=this.norm(text);
let score=0;

analysis.domains.forEach(domain=>{
if(n.includes(domain))score+=2;
});

return score;
}

superlativeScore(text,analysis){

if(!analysis.superlative.active)return 0;

const n=this.norm(text);
const property=this.norm(
analysis.superlative.property
);

let score=0;

if(n.includes(property))score+=3;

const variants={
grand:["superficie","vaste","étendu","étendue","large","territoire"],
petit:["petit","faible","réduit"],
peuple:["population","habitants","populeux"],
haut:["altitude","sommet","hauteur"],
long:["longueur","distance"],
ancien:["ancien","histoire","historique"],
jeune:["jeune"],
meilleur:["meilleur","performance","qualite","qualité"],
pire:["pire","mauvais"]
};

Object.keys(variants).forEach(k=>{

if(property.includes(k)){

variants[k].forEach(v=>{
if(n.includes(v))score+=1;
});

}

});

return Math.min(score,8);
}

relationScore(text,analysis){

if(!analysis.relation)return 0;

const n=this.norm(text);
let score=0;

if(
analysis.relation==="capital_of"&&
/\bcapitale\b/.test(n)
){
score+=8;
}

if(
analysis.relation==="language_of"&&
/blangue\b/.test(n)
){
score+=6;
}

if(
analysis.relation==="population_of"&&
/population\b/.test(n)
){
score+=6;
}

if(
analysis.relation==="area_of"&&
/superficie\b/.test(n)
){
score+=6;
}

return score;
}

/* ---------------------------------------------------------
   PÉNALITÉS DE TYPE
   --------------------------------------------------------- */

typePenalty(item,analysis){

const entity=this.inferEntityType(item);

let penalty=0;

if(
analysis.relation==="capital_of"&&
entity.type==="work"
){
penalty+=15;
}

if(
analysis.relation==="capital_of"&&
entity.type==="person"
){
penalty+=12;
}

if(
analysis.relation==="capital_of"&&
entity.type==="organization"
){
penalty+=10;
}

if(
analysis.superlative.active&&
entity.type==="work"&&
analysis.domains.length
){
penalty+=8;
}

return penalty;
}

driftPenalty(text,analysis){

const n=this.norm(text);

if(!analysis.terms.length)return 0;

let matches=0;

analysis.terms.forEach(term=>{
if(n.includes(term))matches++;
});

const ratio=matches/analysis.terms.length;

if(ratio===0)return 12;
if(ratio<.12)return 8;
if(ratio<.25)return 4;

return 0;
}

score(item,analysis){

const text=
(item.title||"")+" "+
(item.text||item.snippet||"");

return(
this.termScore(text,analysis)+
this.phraseScore(text,analysis)+
this.domainScore(text,analysis)+
this.superlativeScore(text,analysis)+
this.relationScore(text,analysis)-
this.typePenalty(item,analysis)-
this.driftPenalty(text,analysis)
);
}

/* ---------------------------------------------------------
   PASSAGES
   --------------------------------------------------------- */

buildPassages(items){

const passages=[];

items.forEach(item=>{

const text=this.cleanFinalText(
item.text||item.snippet||""
);

if(!text)return;

const sentences=text
.split(/(?<=[.!?])\s+/)
.map(x=>this.cleanFinalText(x))
.filter(x=>x.length>=35);

sentences.slice(0,10).forEach(sentence=>{

passages.push({
text:sentence,
title:this.clean(item.title||""),
source:item.source||"",
entityType:this.inferEntityType({
title:item.title,
text:sentence
}).type
});

});

});

return passages;
}

/* ---------------------------------------------------------
   SIMILARITÉ
   --------------------------------------------------------- */

similarity(a,b){

const A=new Set(this.words(a));
const B=new Set(this.words(b));

if(!A.size||!B.size)return 0;

let common=0;

A.forEach(x=>{
if(B.has(x))common++;
});

return common/Math.max(A.size,B.size);
}

/* ---------------------------------------------------------
   SÉLECTION
   --------------------------------------------------------- */

selectPassages(passages,analysis){

const scored=passages
.map(p=>({
...p,
score:this.score(p,analysis)
}))
.sort((a,b)=>b.score-a.score);

const selected=[];

for(const p of scored){

if(p.score<2)continue;

const duplicate=selected.some(
x=>this.similarity(x.text,p.text)>.72
);

if(duplicate)continue;

selected.push(p);

if(selected.length>=10)break;
}

return selected;
}

/* ---------------------------------------------------------
   VALIDATION
   --------------------------------------------------------- */

validateCandidate(selected,analysis){

if(!selected.length){
return{
valid:false,
confidence:0,
reason:"aucun passage pertinent"
};
}

let evidence=0;
let total=0;

selected.forEach(p=>{

const text=this.norm(p.text);
total++;

let local=0;

analysis.terms.forEach(term=>{
if(text.includes(term))local++;
});

if(
analysis.relation==="capital_of"&&
text.includes("capitale")
){
local+=3;
}

if(
analysis.superlative.active&&
text.includes(
this.norm(analysis.superlative.property)
)
){
local+=2;
}

if(local>0)evidence++;

});

const confidence=total
?evidence/total
:0;

return{
valid:confidence>=.25,
confidence:confidence,
reason:confidence>=.25
?"preuves suffisantes"
:"preuves insuffisantes"
};
}

/* ---------------------------------------------------------
   CONTRADICTIONS
   --------------------------------------------------------- */

findContradictions(passages){

const result=[];

for(let i=0;i<passages.length;i++){

for(let j=i+1;j<passages.length;j++){

const a=this.norm(passages[i].text);
const b=this.norm(passages[j].text);

if(
a.includes("contrairement")||
b.includes("contrairement")
){
result.push({
a:passages[i],
b:passages[j]
});
}

}

}

return result;
}

/* ---------------------------------------------------------
   SYNTHÈSE
   --------------------------------------------------------- */

synthesize(selected,analysis){

if(!selected.length){

return{
answerText:"Je n'ai pas trouvé suffisamment d'informations pertinentes pour répondre correctement à cette question.",
sources:[],
concepts:[],
confidence:0
};

}

const validation=
this.validateCandidate(
selected,
analysis
);

const sentences=[];
const seen=new Set();

selected.forEach(p=>{

const clean=this.cleanFinalText(p.text);

if(!clean)return;

const key=this.norm(clean);

if(
key.length<20||
seen.has(key)
)return;

seen.add(key);
sentences.push(clean);

});

let answer=sentences
.slice(0,9)
.join(" ");

answer=this.cleanFinalText(answer);

if(answer.length>6500){

answer=this.cleanFinalText(
sentences.slice(0,6).join(" ")
);

}

const sources=this.unique(
selected
.map(x=>this.clean(x.source))
.filter(Boolean)
);

const concepts=this.discoverConcepts(
selected.map(x=>({
title:x.title,
snippet:x.text
})),
analysis
);

return{
answerText:answer,
sources:sources,
concepts:concepts,
confidence:validation.confidence
};
}

/* ---------------------------------------------------------
   EXÉCUTION
   --------------------------------------------------------- */

async run(question){

if(this.busy){
throw new Error(
"Une recherche est déjà en cours."
);
}

this.busy=true;

try{

this.step(
"Analyse de la structure de la question...",
1
);

const analysis=
this.analyzeQuestion(question);

await new Promise(r=>setTimeout(r,70));

this.step(
"Identification des termes et contraintes...",
2
);

const queries=
this.buildQueries(analysis);

await new Promise(r=>setTimeout(r,70));

this.step(
"Recherche initiale dans les sources...",
3
);

const firstResults=
await this.searchAll(queries);

await new Promise(r=>setTimeout(r,70));

this.step(
"Découverte des concepts et entités...",
4
);

const concepts=
this.discoverConcepts(
firstResults,
analysis
);

await new Promise(r=>setTimeout(r,70));

this.step(
"Construction d'une recherche plus ciblée...",
5
);

const secondResults=
await this.secondPass(
concepts,
analysis
);

await new Promise(r=>setTimeout(r,70));

this.step(
"Récupération des informations détaillées...",
6
);

const allResults=[
...firstResults,
...secondResults
];

const uniqueResults=[];
const keys=new Set();

allResults.forEach(item=>{

const key=
this.norm(item.source)+"|"+
this.norm(item.title);

if(!keys.has(key)){
keys.add(key);
uniqueResults.push(item);
}

});

const candidates=
uniqueResults.slice(0,50);

const extracts=[];

for(let i=0;i<candidates.length;i+=7){

const batch=
candidates.slice(i,i+7);

const batchResults=
await Promise.all(
batch.map(x=>this.fetchExtract(x))
);

batchResults.forEach(x=>{
if(x)extracts.push(x);
});

}

await new Promise(r=>setTimeout(r,70));

this.step(
"Évaluation sémantique des informations...",
7
);

const passages=
this.buildPassages(extracts);

const selected=
this.selectPassages(
passages,
analysis
);

await new Promise(r=>setTimeout(r,70));

this.step(
"Élimination des résultats hors sujet...",
8
);

const contradictions=
this.findContradictions(selected);

void contradictions;

await new Promise(r=>setTimeout(r,70));

this.step(
"Vérification des preuves disponibles...",
9
);

let validation=
this.validateCandidate(
selected,
analysis
);

/*
 * Si les preuves sont faibles, on tente une
 * passe supplémentaire à partir des meilleurs
 * concepts découverts.
 */
if(
!validation.valid&&
concepts.length
){

this.step(
"Preuves insuffisantes, recherche de vérification...",
10
);

const verificationQueries=
this.unique([
...analysis.phrases.slice(0,3),
...concepts.slice(0,5).map(
c=>analysis.original+" "+c
)
]).slice(0,5);

const verificationResults=
await this.searchAll(
verificationQueries
);

const moreExtracts=[];

for(
let i=0;
i<verificationResults.length;
i+=7
){

const batch=
verificationResults.slice(i,i+7);

const batchResults=
await Promise.all(
batch.map(x=>this.fetchExtract(x))
);

batchResults.forEach(x=>{
if(x)moreExtracts.push(x);
});

}

const morePassages=
this.buildPassages(
moreExtracts
);

const merged=[
...selected,
...morePassages
];

const rescored=
this.selectPassages(
merged,
analysis
);

selected.length=0;

rescored.forEach(x=>{
selected.push(x);
});

validation=
this.validateCandidate(
selected,
analysis
);

}

await new Promise(r=>setTimeout(r,70));

this.step(
"Construction de la réponse...",
11
);

const result=
this.synthesize(
selected,
analysis
);

await new Promise(r=>setTimeout(r,70));

this.step(
"Nettoyage du texte final...",
12
);

result.answerText=
this.cleanFinalText(
result.answerText
);

result.sources=
this.unique(
(result.sources||[])
.map(x=>this.clean(x))
.filter(Boolean)
);

/*
 * Dernière barrière contre le markup.
 */
result.answerText=
result.answerText
.replace(/\[\[[\s\S]*?\]\]/g," ")
.replace(/\{\{[\s\S]*?\}\}/g," ")
.replace(/<[^>]*>/g," ")
.replace(/&(?:[a-z][a-z0-9]+|#\d+|#x[\da-f]+);/gi," ");

result.answerText=
this.cleanFinalText(
result.answerText
);

return result;

}finally{

this.busy=false;

}

}

}


/* =========================================================
   INTERFACE
   ========================================================= */

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const clear=document.getElementById("clear");
const status=document.getElementById("status");

let engine=null;
let stepElement=null;
let sending=false;


/* ---------------------------------------------------------
   MESSAGE UTILISATEUR
   --------------------------------------------------------- */

function addUserMessage(text){

const wrapper=document.createElement("div");
wrapper.className="message user";

const bubble=document.createElement("div");
bubble.className="bubble";
bubble.textContent=text;

wrapper.appendChild(bubble);
chat.appendChild(wrapper);

scrollBottom();
}


/* ---------------------------------------------------------
   ÉTAPE
   --------------------------------------------------------- */

function showStep(data){

if(stepElement){
stepElement.remove();
stepElement=null;
}

stepElement=document.createElement("div");
stepElement.className="step-line";

const number=document.createElement("span");
number.className="step-number";
number.textContent="Étape "+data.number;

const text=document.createElement("span");
text.textContent=data.text;

stepElement.appendChild(number);
stepElement.appendChild(text);

chat.appendChild(stepElement);

scrollBottom();
}


/* ---------------------------------------------------------
   SUPPRIMER ÉTAPE
   --------------------------------------------------------- */

function removeStep(){

if(stepElement){
stepElement.remove();
stepElement=null;
}

}


/* ---------------------------------------------------------
   RÉSULTAT
   --------------------------------------------------------- */

function addAssistantMessage(result){

removeStep();

const wrapper=document.createElement("div");
wrapper.className="message assistant";

const answer=document.createElement("div");
answer.className="answer";

answer.textContent=
result.answerText||
"Aucune réponse exploitable n'a été produite.";

wrapper.appendChild(answer);

const actions=document.createElement("div");
actions.className="answer-actions";

const copy=document.createElement("button");
copy.type="button";
copy.className="copy";
copy.textContent="Copier";

copy.addEventListener("click",async()=>{

const text=result.answerText||"";

try{

await navigator.clipboard.writeText(text);

copy.textContent="Copié";

setTimeout(()=>{
copy.textContent="Copier";
},1200);

}catch(error){

const area=document.createElement("textarea");

area.value=text;
area.style.position="fixed";
area.style.opacity="0";

document.body.appendChild(area);

area.focus();
area.select();

try{

document.execCommand("copy");

copy.textContent="Copié";

setTimeout(()=>{
copy.textContent="Copier";
},1200);

}catch(e){}

area.remove();

}

});

actions.appendChild(copy);
wrapper.appendChild(actions);


/*
 * SOURCES :
 * petites, en bas, jamais copiées.
 */

if(
result.sources&&
result.sources.length
){

const sources=document.createElement("div");
sources.className="sources";

sources.textContent=
result.sources.join(" · ");

wrapper.appendChild(sources);

}

chat.appendChild(wrapper);

scrollBottom();
}


/* ---------------------------------------------------------
   SCROLL
   --------------------------------------------------------- */

function scrollBottom(){

requestAnimationFrame(()=>{
chat.scrollTop=chat.scrollHeight;
});

}


/* ---------------------------------------------------------
   ENVOI
   --------------------------------------------------------- */

async function submit(){

if(sending)return;

const question=input.value.trim();

if(!question)return;

sending=true;

send.disabled=true;
input.disabled=true;
status.textContent="";

addUserMessage(question);

input.value="";
input.style.height="44px";

try{

const result=
await engine.run(question);

removeStep();

addAssistantMessage(result);

}catch(error){

removeStep();

const wrapper=document.createElement("div");
wrapper.className="message assistant";

const answer=document.createElement("div");
answer.className="answer";

answer.textContent=
"Une erreur est survenue pendant la recherche. Vérifie ta connexion Internet puis réessaie.";

wrapper.appendChild(answer);
chat.appendChild(wrapper);

scrollBottom();

console.error("Erreur V5 :",error);

}finally{

sending=false;

send.disabled=false;
input.disabled=false;

input.focus();

}

}


/* ---------------------------------------------------------
   BOUTON ENVOYER
   --------------------------------------------------------- */

send.addEventListener(
"click",
submit
);


/* ---------------------------------------------------------
   ENTRÉE
   --------------------------------------------------------- */

input.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter"&&
!event.shiftKey
){

event.preventDefault();
submit();

}

}
);


/* ---------------------------------------------------------
   TEXTAREA
   --------------------------------------------------------- */

input.addEventListener(
"input",
()=>{

input.style.height="44px";

input.style.height=
Math.min(
input.scrollHeight,
150
)+"px";

}
);


/* ---------------------------------------------------------
   EFFACER
   --------------------------------------------------------- */

clear.addEventListener(
"click",
()=>{

chat.innerHTML="";

removeStep();

status.textContent="";

input.value="";
input.style.height="44px";

input.focus();

}
);


/* ---------------------------------------------------------
   INITIALISATION
   --------------------------------------------------------- */

window.addEventListener(
"load",
()=>{

engine=
new PyramidV5(
showStep
);

input.focus();

}
);

</script>
