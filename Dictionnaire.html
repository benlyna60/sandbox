<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthétiseur Pyramidal Multi-Sources V4</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fa;
  color:#20242a;
}

body{
  display:flex;
  flex-direction:column;
}

header{
  flex:0 0 auto;
  padding:14px 18px;
  background:#ffffff;
  border-bottom:1px solid #e1e5ea;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

header h1{
  margin:0;
  font-size:18px;
  font-weight:700;
}

header small{
  color:#6b7280;
  font-size:12px;
}

#clear{
  border:1px solid #d5dae0;
  background:#fff;
  color:#333;
  border-radius:8px;
  padding:7px 11px;
  cursor:pointer;
}

#clear:hover{
  background:#f0f2f5;
}

#chat{
  flex:1 1 auto;
  overflow-y:auto;
  padding:20px max(14px,calc((100% - 900px)/2));
  scroll-behavior:smooth;
}

.message{
  max-width:850px;
  margin:0 auto 18px auto;
}

.user{
  display:flex;
  justify-content:flex-end;
}

.user .bubble{
  background:#1f2937;
  color:white;
  border-radius:16px 16px 4px 16px;
  padding:11px 14px;
  max-width:75%;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.assistant{
  position:relative;
}

.answer{
  background:#fff;
  border:1px solid #e2e6eb;
  border-radius:14px;
  padding:16px 18px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}

.answer-actions{
  margin-top:8px;
  display:flex;
  justify-content:flex-end;
}

.copy{
  border:1px solid #d8dde3;
  background:#fff;
  color:#555;
  border-radius:7px;
  padding:5px 9px;
  cursor:pointer;
  font-size:12px;
}

.copy:hover{
  background:#f2f4f6;
}

.sources{
  margin-top:8px;
  padding-left:3px;
  color:#9299a3;
  font-size:10px;
  line-height:1.4;
}

.step-line{
  max-width:850px;
  margin:3px auto 14px auto;
  color:#737b86;
  font-size:13px;
  line-height:1.4;
  padding:2px 0;
  opacity:0;
  animation:stepIn .18s ease forwards;
}

.step-number{
  font-weight:700;
  color:#555e69;
  margin-right:7px;
}

@keyframes stepIn{
  from{
    opacity:0;
    transform:translateY(2px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.composer{
  flex:0 0 auto;
  background:#fff;
  border-top:1px solid #e1e5ea;
  padding:12px max(14px,calc((100% - 900px)/2));
}

.composer-inner{
  max-width:850px;
  margin:auto;
  display:flex;
  gap:8px;
  align-items:flex-end;
}

#input{
  flex:1;
  resize:none;
  min-height:44px;
  max-height:150px;
  padding:11px 13px;
  border:1px solid #cfd5dc;
  border-radius:11px;
  outline:none;
  font:inherit;
  line-height:1.4;
  background:#fff;
}

#input:focus{
  border-color:#8d98a6;
}

#send{
  flex:0 0 auto;
  height:44px;
  padding:0 17px;
  border:0;
  border-radius:10px;
  background:#1f2937;
  color:#fff;
  cursor:pointer;
  font-weight:600;
}

#send:hover{
  background:#111827;
}

#send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  max-width:850px;
  margin:5px auto 0 auto;
  min-height:14px;
  font-size:10px;
  color:#9aa1aa;
}

@media(max-width:600px){
  header{
    padding:12px;
  }

  header h1{
    font-size:16px;
  }

  #chat{
    padding:15px 10px;
  }

  .user .bubble{
    max-width:88%;
  }

  .answer{
    padding:14px;
  }

  .composer{
    padding:10px;
  }

  .composer-inner{
    gap:6px;
  }

  #send{
    padding:0 13px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>Synthétiseur Pyramidal Multi-Sources V4</h1>
    <small>Recherche et synthèse locale à partir de sources Wikimedia</small>
  </div>
  <button id="clear" type="button">Effacer</button>
</header>

<main id="chat"></main>

<div class="composer">
  <div class="composer-inner">
    <textarea
      id="input"
      placeholder="Pose ta question..."
      aria-label="Question"
    ></textarea>

    <button id="send" type="button">Envoyer</button>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
"use strict";

/* =========================================================
   SYNTHÉTISEUR PYRAMIDAL MULTI-SOURCES V4
   ========================================================= */

class PyramidV4{

  constructor(stepCallback){

    this.stepCallback=typeof stepCallback==="function"
      ? stepCallback
      : function(){};

    this.sources=[
      {
        name:"Wikipédia",
        url:"https://fr.wikipedia.org/w/api.php"
      },
      {
        name:"Wiktionnaire",
        url:"https://fr.wiktionary.org/w/api.php"
      },
      {
        name:"Wikiversité",
        url:"https://fr.wikiversity.org/w/api.php"
      },
      {
        name:"Wikivoyage",
        url:"https://fr.wikivoyage.org/w/api.php"
      },
      {
        name:"Wikisource",
        url:"https://fr.wikisource.org/w/api.php"
      },
      {
        name:"Wikiquote",
        url:"https://fr.wikiquote.org/w/api.php"
      },
      {
        name:"Wikibooks",
        url:"https://fr.wikibooks.org/w/api.php"
      }
    ];

    this.stop=new Set(
      (
        "a afin ai ainsi après au aux avec avoir avant " +
        "c car ce ceci cela celle celles celui ceux comme " +
        "dans de des du donc elle elles en entre est et eu " +
        "faire faut il ils je l la le les leur leurs lui " +
        "mais me mes moi mon même ne nos notre nous on ont " +
        "ou par pas pour pourquoi que quel quelle quelles " +
        "quelles quels qu est qui quoi sa sans se sera sont " +
        "sur ta te tes toi ton tous tout toute toutes très " +
        "tu un une vos votre vous y d n s c l m t j " +
        "est-ce"
      )
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .split(/\s+/)
    );

    this.cache=new Map();
    this.searchCache=new Map();
    this.busy=false;
  }

  /* -------------------------------------------------------
     ÉTAPES
     ------------------------------------------------------- */

  step(text,number){
    this.stepCallback({
      number:number,
      text:text
    });
  }

  /* -------------------------------------------------------
     NORMALISATION POUR LA RECHERCHE
     ------------------------------------------------------- */

  norm(value){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .replace(/[’‘`´]/g,"'")
      .replace(/[^\p{L}\p{N}'\s-]/gu," ")
      .replace(/\s+/g," ")
      .trim();
  }

  words(value){
    return this.norm(value)
      .split(/\s+/)
      .filter(Boolean);
  }

  unique(arr){
    return [...new Set(arr)];
  }

  /* -------------------------------------------------------
     DÉCODAGE HTML
     ------------------------------------------------------- */

  decodeEntities(value){

    let text=String(value||"");

    try{
      const area=document.createElement("textarea");
      area.innerHTML=text;
      text=area.value;

      /*
       * Deuxième passage pour les entités doublement encodées.
       */
      area.innerHTML=text;
      text=area.value;
    }catch(e){}

    return text;
  }

  /* -------------------------------------------------------
     NETTOYAGE WIKIMEDIA / HTML
     ------------------------------------------------------- */

  clean(value){

    let text=String(value||"");

    if(!text) return "";

    /*
     * Caractères invisibles.
     */
    text=text
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g," ")
      .replace(/[\u200B-\u200D\u2060\uFEFF]/g,"")
      .replace(/\u00A0/g," ");

    /*
     * Décodage initial des entités.
     */
    text=this.decodeEntities(text);

    /*
     * Balises dont le contenu entier doit disparaître.
     */
    text=text
      .replace(/<ref\b[^>]*>[\s\S]*?<\/ref>/gi," ")
      .replace(/<gallery\b[^>]*>[\s\S]*?<\/gallery>/gi," ")
      .replace(/<math\b[^>]*>[\s\S]*?<\/math>/gi," ")
      .replace(/<nowiki\b[^>]*>[\s\S]*?<\/nowiki>/gi," ")
      .replace(/<source\b[^>]*>[\s\S]*?<\/source>/gi," ")
      .replace(/<syntaxhighlight\b[^>]*>[\s\S]*?<\/syntaxhighlight>/gi," ")
      .replace(/<timeline\b[^>]*>[\s\S]*?<\/timeline>/gi," ");

    /*
     * Balises de ligne.
     */
    text=text
      .replace(/<br\s*\/?>/gi," ")
      .replace(/<\/p\s*>/gi," ")
      .replace(/<\/div\s*>/gi," ")
      .replace(/<\/li\s*>/gi," ")
      .replace(/<\/h[1-6]\s*>/gi," ");

    /*
     * Liens Wikimedia :
     * [[cible|texte]] -> texte
     * [[cible]] -> cible
     */
    text=text.replace(
      /\[\[\s*([^|\]]+?)\s*\|\s*([^\]]+?)\s*\]\]/g,
      "$2"
    );

    text=text.replace(
      /\[\[\s*([^\]]+?)\s*\]\]/g,
      "$1"
    );

    /*
     * Fichiers/images.
     */
    text=text.replace(
      /\[\[\s*(?:Fichier|File|Image)\s*:[\s\S]*?\]\]/gi,
      " "
    );

    /*
     * Modèles Wikimedia.
     * Plusieurs passages pour les modèles imbriqués simples.
     */
    for(let i=0;i<5;i++){
      text=text.replace(/\{\{[^{}]*\}\}/g," ");
    }

    /*
     * Restes de balises HTML.
     */
    text=text.replace(/<[^>]*>/g," ");

    /*
     * Entités restantes.
     */
    text=this.decodeEntities(text);

    /*
     * URL.
     */
    text=text.replace(
      /\bhttps?:\/\/[^\s<>"']+/gi,
      " "
    );

    /*
     * Références ou marqueurs résiduels.
     */
    text=text
      .replace(/&(?:amp|lt|gt|quot|apos|nbsp|#\d+|#x[\da-f]+);/gi," ")
      .replace(/\[\s*\]/g," ")
      .replace(/\{\s*\}/g," ")
      .replace(/\|\s*\|+/g," ")
      .replace(/^\s*[|=#:;]+\s*/g," ");

    /*
     * Caractères typographiques :
     * on conserve les lettres accentuées mais on normalise
     * les apostrophes/guillemets/tirets problématiques.
     */
    text=text
      .replace(/[’‘ʼʻ`´]/g,"'")
      .replace(/[“”„‟]/g,'"')
      .replace(/[–—―]/g,"-")
      .replace(/…/g,"...");

    /*
     * Nettoyage des répétitions de ponctuation artificielles.
     */
    text=text
      .replace(/([!?.,])\1{2,}/g,"$1")
      .replace(/[ \t]+/g," ")
      .replace(/\s+\n\s*/g,"\n")
      .replace(/\n{3,}/g,"\n\n")
      .trim();

    /*
     * Supprime quelques artefacts de début/fin.
     */
    text=text
      .replace(/^[|=:;,.\-]+\s*/,"")
      .replace(/\s*[|=:;]+\s*$/,"")
      .trim();

    return text;
  }

  /* -------------------------------------------------------
     NETTOYAGE FINAL SPÉCIAL RÉPONSE
     ------------------------------------------------------- */

  cleanFinalText(value){

    let text=this.clean(value);

    if(!text) return "";

    /*
     * Une ligne par paragraphe maximum.
     */
    text=text
      .replace(/\r/g,"")
      .replace(/[ \t]+\n/g,"\n")
      .replace(/\n[ \t]+/g,"\n")
      .replace(/\n{3,}/g,"\n\n")
      .trim();

    /*
     * Retire les puces automatiques.
     */
    text=text.replace(
      /(^|\n)\s*(?:[-*•▪◦]|\d+[.)])\s+/g,
      "$1"
    );

    /*
     * Retire les titres Wikimedia évidents.
     */
    text=text.replace(
      /(^|\n)\s*(?:sources?|références?|notes?|bibliographie)\s*:?\s*(?=\n|$)/gi,
      "$1"
    );

    /*
     * Ne laisse jamais des entités HTML dans le texte final.
     */
    text=text.replace(
      /&(?:[a-z][a-z0-9]+|#\d+|#x[\da-f]+);/gi,
      " "
    );

    /*
     * Dernier passage.
     */
    text=this.clean(text);

    return text.trim();
  }

  /* -------------------------------------------------------
     EXTRACTION DES TERMES
     ------------------------------------------------------- */

  extractTerms(question){

    const ws=this.words(question);

    const terms=ws.filter(w=>{
      if(w.length<3) return false;
      if(this.stop.has(w)) return false;
      if(/^\d+$/.test(w)) return false;
      return true;
    });

    return this.unique(terms).slice(0,18);
  }

  extractPhrases(question){

    const clean=this.clean(question);

    const phrases=[];

    const quoted=clean.match(/["«](.+?)["»]/g)||[];

    quoted.forEach(x=>{
      const p=x.replace(/^["«]|["»]$/g,"").trim();
      if(p.length>2) phrases.push(p);
    });

    const ws=this.words(clean);

    for(let i=0;i<ws.length-1;i++){

      const a=ws[i];
      const b=ws[i+1];

      if(
        a.length>=3 &&
        b.length>=3 &&
        !this.stop.has(a) &&
        !this.stop.has(b)
      ){
        phrases.push(a+" "+b);
      }
    }

    return this.unique(phrases).slice(0,10);
  }

  /* -------------------------------------------------------
     INTENTION
     ------------------------------------------------------- */

  detectIntent(question){

    const q=this.norm(question);

    if(/\b(comment|de quelle facon|de quelle manière)\b/.test(q))
      return "how";

    if(/\b(pourquoi|raison|cause)\b/.test(q))
      return "why";

    if(/\b(qui|quel|quelle|quels|quelles)\b/.test(q))
      return "who";

    if(/\b(quand|date|annee|année|moment)\b/.test(q))
      return "when";

    if(/\b(ou|où|lieu|endroit)\b/.test(q))
      return "where";

    if(/\b(combien|nombre|quantite|quantité)\b/.test(q))
      return "quantity";

    if(/\b(definition|définition|signifie|signification|c'est quoi|qu'est-ce)\b/.test(q))
      return "definition";

    if(/\b(compar|difference|différence|versus|contre)\b/.test(q))
      return "comparison";

    return "general";
  }

  analyzeQuestion(question){

    return {
      original:this.clean(question),
      terms:this.extractTerms(question),
      phrases:this.extractPhrases(question),
      intent:this.detectIntent(question)
    };
  }

  /* -------------------------------------------------------
     CONSTRUCTION DES REQUÊTES
     ------------------------------------------------------- */

  buildQueries(analysis){

    const queries=[];

    if(analysis.original){
      queries.push(analysis.original);
    }

    analysis.phrases.forEach(p=>{
      if(p.length>=4) queries.push(p);
    });

    if(analysis.terms.length){
      queries.push(
        analysis.terms.slice(0,6).join(" ")
      );
    }

    return this.unique(
      queries
        .map(x=>this.clean(x))
        .filter(x=>x.length>=2)
    ).slice(0,5);
  }

  /* -------------------------------------------------------
     REQUÊTE API
     ------------------------------------------------------- */

  async api(url,params){

    const query=new URLSearchParams({
      ...params,
      format:"json",
      origin:"*"
    });

    const response=await fetch(
      url+"?"+query.toString(),
      {
        method:"GET",
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    return await response.json();
  }

  /* -------------------------------------------------------
     RECHERCHE D'UNE SOURCE
     ------------------------------------------------------- */

  async searchSource(source,query){

    const key=source.url+"|"+query;

    if(this.searchCache.has(key)){
      return this.searchCache.get(key);
    }

    try{

      const data=await this.api(
        source.url,
        {
          action:"query",
          list:"search",
          srsearch:query,
          srnamespace:"0",
          srlimit:"5",
          srprop:"snippet|titlesnippet",
          utf8:"1"
        }
      );

      const results=(data.query&&data.query.search)
        ? data.query.search
        : [];

      const cleaned=results.map(item=>({
        title:this.clean(item.title||""),
        snippet:this.clean(item.snippet||""),
        source:source.name,
        url:source.url
      })).filter(x=>x.title);

      this.searchCache.set(key,cleaned);

      return cleaned;

    }catch(error){

      return [];
    }
  }

  /* -------------------------------------------------------
     RECHERCHE MULTI-SOURCES
     ------------------------------------------------------- */

  async searchAll(queries){

    const tasks=[];

    for(const source of this.sources){

      for(const query of queries.slice(0,3)){

        tasks.push(
          this.searchSource(source,query)
        );

      }
    }

    const results=await Promise.all(tasks);

    return results.flat();
  }

  /* -------------------------------------------------------
     EXTRACTION D'UNE PAGE
     ------------------------------------------------------- */

  async fetchExtract(item){

    const key=item.source+"|"+item.title;

    if(this.cache.has(key)){
      return this.cache.get(key);
    }

    const source=this.sources.find(
      s=>s.name===item.source
    );

    if(!source) return null;

    try{

      const data=await this.api(
        source.url,
        {
          action:"query",
          prop:"extracts",
          titles:item.title,
          exintro:"1",
          explaintext:"1",
          exsectionformat:"plain",
          exchars:"2200",
          redirects:"1"
        }
      );

      const pages=
        data.query &&
        data.query.pages
          ? data.query.pages
          : {};

      let page=null;

      Object.keys(pages).some(id=>{
        if(pages[id] && pages[id].extract){
          page=pages[id];
          return true;
        }
        return false;
      });

      if(!page) return null;

      const text=this.cleanFinalText(
        page.extract||""
      );

      if(!text) return null;

      const result={
        title:this.clean(page.title||item.title),
        text:text,
        source:item.source,
        url:source.url
      };

      this.cache.set(key,result);

      return result;

    }catch(error){

      return null;
    }
  }

  /* -------------------------------------------------------
     DÉCOUVERTE DES CONCEPTS
     ------------------------------------------------------- */

  discoverConcepts(results,analysis){

    const counts=new Map();

    const add=(word,weight)=>{

      const n=this.norm(word);

      if(
        n.length<4 ||
        this.stop.has(n) ||
        /^\d+$/.test(n)
      ){
        return;
      }

      counts.set(
        n,
        (counts.get(n)||0)+weight
      );
    };

    results.forEach(r=>{

      this.words(r.title).forEach(w=>{
        add(w,4);
      });

      this.words(r.snippet).forEach(w=>{
        add(w,1);
      });

    });

    analysis.terms.forEach(w=>{
      add(w,8);
    });

    return [...counts.entries()]
      .sort((a,b)=>b[1]-a[1])
      .slice(0,18)
      .map(x=>x[0]);
  }

  /* -------------------------------------------------------
     DEUXIÈME PASSAGE
     ------------------------------------------------------- */

  async secondPass(concepts,analysis){

    const queries=[];

    if(concepts.length){

      queries.push(
        concepts.slice(0,5).join(" ")
      );

      concepts.slice(0,8).forEach(c=>{
        if(
          !analysis.terms.includes(c) &&
          c.length>=4
        ){
          queries.push(c);
        }
      });
    }

    const results=await this.searchAll(
      this.unique(queries).slice(0,4)
    );

    return results;
  }

  /* -------------------------------------------------------
     SCORE DES MOTS
     ------------------------------------------------------- */

  termScore(text,analysis){

    const n=this.norm(text);

    let score=0;

    analysis.terms.forEach(term=>{

      if(n.includes(term)){
        score+=3;
      }

    });

    return score;
  }

  phraseScore(text,analysis){

    const n=this.norm(text);

    let score=0;

    analysis.phrases.forEach(phrase=>{

      const p=this.norm(phrase);

      if(
        p.length>=4 &&
        n.includes(p)
      ){
        score+=4;
      }

    });

    return score;
  }

  titleScore(title,analysis){

    return this.termScore(
      title,
      analysis
    )*1.5;
  }

  intentScore(text,analysis){

    const n=this.norm(text);

    let score=0;

    if(analysis.intent==="definition"){

      if(/\b(est|désigne|signifie|définit|définition)\b/.test(n))
        score+=3;
    }

    if(analysis.intent==="why"){

      if(/\b(parce que|car|cause|raison|permet|provoque)\b/.test(n))
        score+=2;
    }

    if(analysis.intent==="how"){

      if(/\b(comment|étape|méthode|processus|permet de)\b/.test(n))
        score+=2;
    }

    if(analysis.intent==="comparison"){

      if(/\b(différence|contrairement|alors que|comparaison)\b/.test(n))
        score+=2;
    }

    return score;
  }

  specificityScore(text,analysis){

    const n=this.norm(text);

    let score=0;

    analysis.terms.forEach(term=>{

      const count=n.split(term).length-1;

      if(count>0){
        score+=Math.min(count,3);
      }

    });

    return score;
  }

  driftPenalty(text,analysis){

    const n=this.norm(text);

    if(!analysis.terms.length){
      return 0;
    }

    let matches=0;

    analysis.terms.forEach(term=>{
      if(n.includes(term)){
        matches++;
      }
    });

    const ratio=matches/analysis.terms.length;

    if(ratio===0) return 8;
    if(ratio<0.15) return 5;
    if(ratio<0.30) return 2;

    return 0;
  }

  score(item,analysis){

    const text=
      (item.title||"")+" "+
      (item.text||item.snippet||"");

    return (
      this.termScore(text,analysis)+
      this.phraseScore(text,analysis)+
      this.titleScore(item.title||"",analysis)+
      this.intentScore(text,analysis)+
      this.specificityScore(text,analysis)-
      this.driftPenalty(text,analysis)
    );
  }

  /* -------------------------------------------------------
     CONSTRUCTION DES PASSAGES
     ------------------------------------------------------- */

  buildPassages(items){

    const passages=[];

    items.forEach(item=>{

      const text=this.cleanFinalText(
        item.text||item.snippet||""
      );

      if(!text) return;

      const sentences=text
        .split(/(?<=[.!?])\s+/)
        .map(x=>this.cleanFinalText(x))
        .filter(x=>x.length>=35);

      sentences.slice(0,8).forEach(sentence=>{

        passages.push({
          text:sentence,
          title:this.clean(item.title||""),
          source:item.source||""
        });

      });

    });

    return passages;
  }

  /* -------------------------------------------------------
     SIMILARITÉ
     ------------------------------------------------------- */

  similarity(a,b){

    const A=new Set(
      this.words(a)
    );

    const B=new Set(
      this.words(b)
    );

    if(!A.size || !B.size){
      return 0;
    }

    let common=0;

    A.forEach(x=>{
      if(B.has(x)) common++;
    });

    return common/
      Math.max(A.size,B.size);
  }

  /* -------------------------------------------------------
     SÉLECTION DES PASSAGES
     ------------------------------------------------------- */

  selectPassages(passages,analysis){

    const scored=passages
      .map(p=>({
        ...p,
        score:this.score(p,analysis)
      }))
      .sort((a,b)=>b.score-a.score);

    const selected=[];

    for(const p of scored){

      if(p.score<1) continue;

      const duplicate=selected.some(
        x=>this.similarity(
          x.text,
          p.text
        )>0.72
      );

      if(duplicate) continue;

      selected.push(p);

      if(selected.length>=8){
        break;
      }
    }

    return selected;
  }

  /* -------------------------------------------------------
     CONTRADICTIONS SIMPLES
     ------------------------------------------------------- */

  findContradictions(passages){

    const result=[];

    for(let i=0;i<passages.length;i++){

      for(let j=i+1;j<passages.length;j++){

        const a=this.norm(passages[i].text);
        const b=this.norm(passages[j].text);

        if(
          a.includes("contrairement") ||
          b.includes("contrairement")
        ){
          result.push({
            a:passages[i],
            b:passages[j]
          });
        }

      }

    }

    return result;
  }

  /* -------------------------------------------------------
     CONCEPTS FINAUX
     ------------------------------------------------------- */

  finalConcepts(passages,analysis){

    const map=new Map();

    passages.forEach(p=>{

      this.words(p.text).forEach(w=>{

        if(
          w.length<5 ||
          this.stop.has(w) ||
          analysis.terms.includes(w)
        ){
          return;
        }

        map.set(
          w,
          (map.get(w)||0)+1
        );

      });

    });

    return [...map.entries()]
      .sort((a,b)=>b[1]-a[1])
      .slice(0,10)
      .map(x=>x[0]);
  }

  /* -------------------------------------------------------
     SYNTHÈSE
     ------------------------------------------------------- */

  synthesize(selected,analysis){

    if(!selected.length){

      return {
        answerText:
          "Je n'ai pas trouvé suffisamment d'informations pertinentes pour répondre correctement à cette question.",
        sources:[],
        concepts:[]
      };
    }

    const sentences=[];
    const seen=new Set();

    selected.forEach(p=>{

      const clean=this.cleanFinalText(
        p.text
      );

      if(!clean) return;

      const key=this.norm(clean);

      if(
        key.length<20 ||
        seen.has(key)
      ){
        return;
      }

      seen.add(key);
      sentences.push(clean);
    });

    /*
     * Maximum raisonnable pour conserver une réponse lisible.
     */
    let answer=sentences
      .slice(0,8)
      .join(" ");

    answer=this.cleanFinalText(answer);

    /*
     * Si le texte est trop long, on conserve les phrases
     * les plus pertinentes déjà sélectionnées.
     */
    if(answer.length>6000){

      answer=sentences
        .slice(0,6)
        .join(" ");

      answer=this.cleanFinalText(answer);
    }

    const sources=this.unique(
      selected
        .map(x=>this.clean(x.source))
        .filter(Boolean)
    );

    const concepts=this.finalConcepts(
      selected,
      analysis
    );

    return {
      answerText:answer,
      sources:sources,
      concepts:concepts
    };
  }

  /* -------------------------------------------------------
     EXÉCUTION COMPLÈTE
     ------------------------------------------------------- */

  async run(question){

    if(this.busy){
      throw new Error(
        "Une recherche est déjà en cours."
      );
    }

    this.busy=true;

    try{

      this.step(
        "Analyse de la question...",
        1
      );

      const analysis=
        this.analyzeQuestion(question);

      await new Promise(
        r=>setTimeout(r,80)
      );

      this.step(
        "Extraction des termes importants...",
        2
      );

      const queries=
        this.buildQueries(analysis);

      await new Promise(
        r=>setTimeout(r,80)
      );

      this.step(
        "Recherche dans les sources...",
        3
      );

      const firstResults=
        await this.searchAll(queries);

      await new Promise(
        r=>setTimeout(r,80)
      );

      this.step(
        "Découverte des concepts associés...",
        4
      );

      const concepts=
        this.discoverConcepts(
          firstResults,
          analysis
        );

      await new Promise(
        r=>setTimeout(r,80)
      );

      this.step(
        "Recherche ciblée des concepts...",
        5
      );

      const secondResults=
        await this.secondPass(
          concepts,
          analysis
        );

      await new Promise(
        r=>setTimeout(r,80)
      );

      this.step(
        "Récupération des passages pertinents...",
        6
      );

      const allResults=[
        ...firstResults,
        ...secondResults
      ];

      /*
       * Déduplication des résultats.
       */
      const uniqueResults=[];
      const resultKeys=new Set();

      allResults.forEach(item=>{

        const key=
          this.norm(item.source)+"|"+
          this.norm(item.title);

        if(!resultKeys.has(key)){

          resultKeys.add(key);
          uniqueResults.push(item);

        }

      });

      /*
       * Limite pour éviter trop de requêtes.
       */
      const candidates=
        uniqueResults.slice(0,35);

      const extracts=[];

      /*
       * Extraction en petits lots pour éviter
       * de surcharger le navigateur.
       */
      for(
        let i=0;
        i<candidates.length;
        i+=7
      ){

        const batch=
          candidates.slice(i,i+7);

        const batchResults=
          await Promise.all(
            batch.map(
              x=>this.fetchExtract(x)
            )
          );

        batchResults.forEach(x=>{
          if(x) extracts.push(x);
        });

      }

      await new Promise(
        r=>setTimeout(r,80)
      );

      this.step(
        "Évaluation de la pertinence...",
        7
      );

      const passages=
        this.buildPassages(
          extracts
        );

      const selected=
        this.selectPassages(
          passages,
          analysis
        );

      await new Promise(
        r=>setTimeout(r,80)
      );

      this.step(
        "Élimination des informations hors sujet...",
        8
      );

      const contradictions=
        this.findContradictions(
          selected
        );

      /*
       * On garde la variable pour permettre
       * une extension future sans casser le moteur.
       */
      void contradictions;

      await new Promise(
        r=>setTimeout(r,80)
      );

      this.step(
        "Construction de la réponse...",
        9
      );

      const result=
        this.synthesize(
          selected,
          analysis
        );

      await new Promise(
        r=>setTimeout(r,80)
      );

      this.step(
        "Nettoyage du texte final...",
        10
      );

      result.answerText=
        this.cleanFinalText(
          result.answerText
        );

      result.sources=
        this.unique(
          result.sources
            .map(x=>this.clean(x))
            .filter(Boolean)
        );

      /*
       * Protection supplémentaire :
       * aucun markup ne doit arriver au résultat.
       */
      result.answerText=
        result.answerText
          .replace(/\[\[[\s\S]*?\]\]/g," ")
          .replace(/\{\{[\s\S]*?\}\}/g," ")
          .replace(/<[^>]*>/g," ")
          .replace(/&(?:[a-z][a-z0-9]+|#\d+|#x[\da-f]+);/gi," ");

      result.answerText=
        this.cleanFinalText(
          result.answerText
        );

      return result;

    }finally{

      this.busy=false;

    }
  }
}


/* =========================================================
   INTERFACE
   ========================================================= */

const chat=
  document.getElementById("chat");

const input=
  document.getElementById("input");

const send=
  document.getElementById("send");

const clear=
  document.getElementById("clear");

const status=
  document.getElementById("status");

let engine=null;

let stepElement=null;


/* ---------------------------------------------------------
   ÉCHAPPEMENT HTML
   --------------------------------------------------------- */

function escapeHtml(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ---------------------------------------------------------
   AJOUT MESSAGE UTILISATEUR
   --------------------------------------------------------- */

function addUserMessage(text){

  const wrapper=
    document.createElement("div");

  wrapper.className=
    "message user";

  const bubble=
    document.createElement("div");

  bubble.className=
    "bubble";

  bubble.textContent=
    text;

  wrapper.appendChild(
    bubble
  );

  chat.appendChild(
    wrapper
  );

  scrollBottom();
}


/* ---------------------------------------------------------
   ÉTAPE TEMPORAIRE
   --------------------------------------------------------- */

function showStep(data){

  /*
   * Supprime immédiatement l'étape précédente.
   */
  if(stepElement){

    stepElement.remove();
    stepElement=null;

  }

  stepElement=
    document.createElement("div");

  stepElement.className=
    "step-line";

  const number=
    document.createElement("span");

  number.className=
    "step-number";

  number.textContent=
    "Étape "+data.number;

  const text=
    document.createElement("span");

  text.textContent=
    data.text;

  stepElement.appendChild(
    number
  );

  stepElement.appendChild(
    text
  );

  chat.appendChild(
    stepElement
  );

  scrollBottom();
}


/* ---------------------------------------------------------
   SUPPRESSION ÉTAPE
   --------------------------------------------------------- */

function removeStep(){

  if(stepElement){

    stepElement.remove();
    stepElement=null;

  }

}


/* ---------------------------------------------------------
   RÉSULTAT FINAL
   --------------------------------------------------------- */

function addAssistantMessage(result){

  removeStep();

  const wrapper=
    document.createElement("div");

  wrapper.className=
    "message assistant";

  const answer=
    document.createElement("div");

  answer.className=
    "answer";

  answer.textContent=
    result.answerText ||
    "Aucune réponse exploitable n'a été produite.";

  wrapper.appendChild(
    answer
  );

  const actions=
    document.createElement("div");

  actions.className=
    "answer-actions";

  const copy=
    document.createElement("button");

  copy.type="button";
  copy.className="copy";
  copy.textContent="Copier";

  copy.addEventListener(
    "click",
    async()=>{
      try{

        await navigator.clipboard.writeText(
          result.answerText||""
        );

        copy.textContent="Copié";

        setTimeout(()=>{
          copy.textContent="Copier";
        },1200);

      }catch(error){

        /*
         * Fallback pour certains navigateurs.
         */
        const area=
          document.createElement("textarea");

        area.value=
          result.answerText||"";

        area.style.position="fixed";
        area.style.opacity="0";

        document.body.appendChild(area);
        area.select();

        try{
          document.execCommand("copy");
          copy.textContent="Copié";

          setTimeout(()=>{
            copy.textContent="Copier";
          },1200);

        }catch(e){}

        area.remove();
      }
    }
  );

  actions.appendChild(
    copy
  );

  wrapper.appendChild(
    actions
  );

  /*
   * Sources très discrètes tout en bas.
   * Elles ne sont PAS incluses dans le texte copié.
   */
  if(
    result.sources &&
    result.sources.length
  ){

    const sources=
      document.createElement("div");

    sources.className=
      "sources";

    sources.textContent=
      result.sources.join(" · ");

    wrapper.appendChild(
      sources
    );

  }

  chat.appendChild(
    wrapper
  );

  scrollBottom();
}


/* ---------------------------------------------------------
   SCROLL
   --------------------------------------------------------- */

function scrollBottom(){

  requestAnimationFrame(()=>{
    chat.scrollTop=
      chat.scrollHeight;
  });

}


/* ---------------------------------------------------------
   ENVOI
   --------------------------------------------------------- */

let sending=false;

async function submit(){

  if(sending) return;

  const question=
    input.value.trim();

  if(!question) return;

  sending=true;

  send.disabled=true;
  input.disabled=true;

  status.textContent="";

  addUserMessage(question);

  input.value="";
  input.style.height="44px";

  try{

    const result=
      await engine.run(
        question
      );

    removeStep();

    addAssistantMessage(
      result
    );

  }catch(error){

    removeStep();

    const wrapper=
      document.createElement("div");

    wrapper.className=
      "message assistant";

    const answer=
      document.createElement("div");

    answer.className=
      "answer";

    answer.textContent=
      "Une erreur est survenue pendant la recherche. Vérifie ta connexion Internet puis réessaie.";

    wrapper.appendChild(
      answer
    );

    chat.appendChild(
      wrapper
    );

    scrollBottom();

    console.error(
      "Erreur V4:",
      error
    );

  }finally{

    sending=false;

    send.disabled=false;
    input.disabled=false;

    input.focus();

  }
}


/* ---------------------------------------------------------
   BOUTON ENVOYER
   --------------------------------------------------------- */

send.addEventListener(
  "click",
  submit
);


/* ---------------------------------------------------------
   ENTRÉE / SHIFT+ENTRÉE
   --------------------------------------------------------- */

input.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();
      submit();

    }

  }
);


/* ---------------------------------------------------------
   HAUTEUR AUTOMATIQUE DU TEXTAREA
   --------------------------------------------------------- */

input.addEventListener(
  "input",
  ()=>{

    input.style.height="44px";

    input.style.height=
      Math.min(
        input.scrollHeight,
        150
      )+"px";

  }
);


/* ---------------------------------------------------------
   EFFACER
   --------------------------------------------------------- */

clear.addEventListener(
  "click",
  ()=>{

    chat.innerHTML="";

    removeStep();

    status.textContent="";

    input.value="";
    input.style.height="44px";

    input.focus();

  }
);


/* ---------------------------------------------------------
   INITIALISATION
   --------------------------------------------------------- */

window.addEventListener(
  "load",
  ()=>{

    engine=
      new PyramidV4(
        showStep
      );

    input.focus();

  }
);

</script>
