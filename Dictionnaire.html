<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracteur Wiktionnaire Pur v18</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #ccc;
            --header-color: #2c3e50;
            --btn-bg: #3498db;
            --btn-hover: #2980b9;
            --btn-disabled: #95a5a6;
            --copy-bg: #2ecc71;
            --copy-hover: #27ae60;
            --download-bg: #9b59b6;
            --download-hover: #8e44ad;
            --status-color: #555;
            --error-color: #c0392b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1a1a1a;
                --text-color: #e0e0e0;
                --card-bg: #2d2d2d;
                --border-color: #444;
                --header-color: #ecf0f1;
                --btn-bg: #2980b9;
                --btn-hover: #3498db;
                --btn-disabled: #555555;
                --copy-bg: #27ae60;
                --copy-hover: #27ae61;
                --download-bg: #8e44ad;
                --download-hover: #9b59b6;
                --status-color: #aaa;
                --error-color: #e74c3c;
            }
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        h1 {
            color: var(--header-color);
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: var(--btn-hover);
        }
        button:disabled {
            background-color: var(--btn-disabled);
            color: #ccc;
            cursor: not-allowed;
        }
        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            min-height: 24px;
        }
        #status {
            font-style: italic;
            color: var(--status-color);
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--btn-bg);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .output-container {
            position: relative;
        }
        textarea {
            width: 100%;
            height: 450px;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-color);
            resize: vertical;
            line-height: 1.5;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .copy-btn {
            background-color: var(--copy-bg);
        }
        .copy-btn:hover:not(:disabled) {
            background-color: var(--copy-hover);
        }
        .download-btn {
            background-color: var(--download-bg);
        }
        .download-btn:hover:not(:disabled) {
            background-color: var(--download-hover);
        }
    </style>
</head>
<body>

    <h1>Extracteur Wiktionnaire Pur</h1>
    <p>Version v18 : Nettoyage renforcé (suppression des liens d'édition, des étiquettes de métadonnées, des guillemets superflus et du bruit rédactionnel).</p>

    <div class="search-box">
        <input type="text" id="wordInput" placeholder="Ex: Maison, courir, éco-..." aria-label="Mot à rechercher sur le Wiktionnaire" autofocus>
        <button id="searchBtn" onclick="fetchWiktionary()">Rechercher</button>
    </div>

    <div class="status-container" role="region" aria-label="Zone de statut">
        <div class="spinner" id="loadingSpinner" aria-hidden="true"></div>
        <div id="status" aria-live="polite" aria-atomic="true" tabindex="-1"></div>
    </div>

    <div class="output-container">
        <label for="outputArea" class="visually-hidden" style="display:none;">Texte extrait et nettoyé</label>
        <textarea id="outputArea" placeholder="Le texte pur apparaîtra ici..." aria-label="Résultat de l'extraction textuelle" tabindex="0"></textarea>
        <div class="actions">
            <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()" aria-label="Copier le texte dans le presse-papier">Copier dans le presse-papier</button>
            <button class="download-btn" id="downloadBtn" onclick="downloadTextFile()" aria-label="Télécharger le texte en fichier .txt">Télécharger (.txt)</button>
        </div>
    </div>

    <script>
        let currentAbortController = null;
        
        class PersistentCache {
            constructor(maxSize = 50, ttlMs = 3600000 * 24, storageKey = 'wiktionary_extract_cache_v18') {
                this.maxSize = maxSize;
                this.ttlMs = ttlMs;
                this.storageKey = storageKey;
                this.cacheMap = this._loadFromStorage();
            }

            _normalizeKey(key) {
                if (!key) return '';
                return String(key).trim().toLowerCase().normalize('NFC');
            }

            _loadFromStorage() {
                try {
                    const raw = localStorage.getItem(this.storageKey);
                    if (!raw) return new Map();
                    const parsed = JSON.parse(raw);
                    const map = new Map();
                    for (const [k, v] of Object.entries(parsed)) {
                        map.set(this._normalizeKey(k), v);
                    }
                    return map;
                } catch (e) {
                    return new Map();
                }
            }

            _saveToStorage() {
                try {
                    const obj = Object.fromEntries(this.cacheMap);
                    localStorage.setItem(this.storageKey, JSON.stringify(obj));
                } catch (e) {}
            }

            get(key) {
                const normalizedKey = this._normalizeKey(key);
                if (!this.cacheMap.has(normalizedKey)) return undefined;
                const item = this.cacheMap.get(normalizedKey);
                if (Date.now() - item.timestamp > this.ttlMs) {
                    this.cacheMap.delete(normalizedKey);
                    this._saveToStorage();
                    return undefined;
                }
                this.cacheMap.delete(normalizedKey);
                this.cacheMap.set(normalizedKey, item);
                return item.value;
            }

            set(key, value) {
                const normalizedKey = this._normalizeKey(key);
                if (!normalizedKey) return;
                if (this.cacheMap.has(normalizedKey)) {
                    this.cacheMap.delete(normalizedKey);
                } else if (this.cacheMap.size >= this.maxSize) {
                    const oldestKey = this.cacheMap.keys().next().value;
                    this.cacheMap.delete(oldestKey);
                }
                this.cacheMap.set(normalizedKey, { value, timestamp: Date.now() });
                this._saveToStorage();
            }

            has(key) {
                return this.get(key) !== undefined;
            }
        }

        const searchCache = new PersistentCache(50);

        document.getElementById('wordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !document.getElementById('searchBtn').disabled) {
                fetchWiktionary();
            }
        });

        function updateStatus(message, isError = false, moveFocus = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.style.color = isError ? 'var(--error-color)' : 'var(--status-color)';
            if (isError || moveFocus) {
                statusDiv.focus();
            }
        }

        async function fetchWiktionary() {
            const wordInput = document.getElementById('wordInput');
            const searchBtn = document.getElementById('searchBtn');
            const spinner = document.getElementById('loadingSpinner');
            const outputArea = document.getElementById('outputArea');
            
            const word = wordInput.value.trim().normalize('NFC');
            if (!word) {
                alert('Veuillez entrer un mot.');
                return;
            }

            if (searchCache.has(word)) {
                outputArea.value = searchCache.get(word);
                updateStatus(`Succès ! Article "${word}" chargé instantanément depuis le cache.`);
                return;
            }

            if (currentAbortController) {
                currentAbortController.abort();
            }
            currentAbortController = new AbortController();
            const { signal } = currentAbortController;

            searchBtn.disabled = true;
            wordInput.disabled = true;
            spinner.style.display = 'block';
            updateStatus('Résolution du terme et recherche...');
            outputArea.value = '';

            try {
                let canonicalTitle = word;
                const queryEndpoint = `https://fr.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&redirects=1&format=json&origin=*`;
                
                const queryRes = await fetch(queryEndpoint, { signal });
                if (!queryRes.ok) throw new Error(`Erreur HTTP réseau : ${queryRes.status}`);
                
                const queryData = await queryRes.json();
                if (queryData.error) {
                    throw new Error(queryData.error.info || 'Erreur lors de la requête API Wiktionnaire.');
                }
                
                if (queryData.query && queryData.query.redirects && queryData.query.redirects.length > 0) {
                    let rawTarget = queryData.query.redirects[queryData.query.redirects.length - 1].to;
                    canonicalTitle = decodeURIComponent(rawTarget).replace(/_/g, ' ');
                } else if (queryData.query && queryData.query.pages) {
                    const pages = queryData.query.pages;
                    const pageId = Object.keys(pages)[0];
                    if (pageId === '-1') {
                        const searchEndpoint = `https://fr.wiktionary.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(word)}&srlimit=1&format=json&origin=*`;
                        const searchRes = await fetch(searchEndpoint, { signal });
                        const searchData = await searchRes.json();
                        if (!searchData.query || !searchData.query.search || searchData.query.search.length === 0) {
                            throw new Error(`Aucun résultat trouvé pour "${word}".`);
                        }
                        canonicalTitle = searchData.query.search[0].title;
                    } else {
                        canonicalTitle = pages[pageId].title;
                    }
                } else {
                    throw new Error("Réponse inattendue de l'API MediaWiki.");
                }

                updateStatus(`Chargement de l'article : "${canonicalTitle}" depuis le réseau...`);

                const parseEndpoint = `https://fr.wiktionary.org/w/api.php?action=parse&page=${encodeURIComponent(canonicalTitle)}&prop=text&format=json&origin=*`;
                const parseRes = await fetch(parseEndpoint, { signal });
                const parseData = await parseRes.json();
                
                if (parseData.error) {
                    throw new Error(parseData.error.info || 'Erreur API Wiktionnaire lors du rendu.');
                }

                if (parseData.parse && parseData.parse.text) {
                    const htmlContent = parseData.parse.text['*'];
                    
                    const frenchHtml = extractFrenchSections(htmlContent);
                    let cleanText = parseHtmlToCleanText(frenchHtml);

                    if (!cleanText || cleanText.trim().length === 0) {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlContent, 'text/html');
                        cleanText = doc.body.textContent || "Aucun texte lisible extrait.";
                    }

                    searchCache.set(word, cleanText);
                    searchCache.set(canonicalTitle, cleanText);

                    outputArea.value = cleanText;
                    updateStatus(`Succès ! Article "${canonicalTitle}" récupéré du réseau et mis en cache.`);
                } else {
                    updateStatus('Aucun contenu exploitable trouvé.');
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    updateStatus('Recherche annulée.');
                    return;
                }
                console.error("Erreur attrapée :", error);
                updateStatus(`Erreur : ${error.message}`, true, true);
            } finally {
                searchBtn.disabled = false;
                wordInput.disabled = false;
                spinner.style.display = 'none';
            }
        }

        function extractFrenchSections(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            const h2Elements = doc.querySelectorAll('h2');
            let combinedHtml = '';

            if (!h2Elements || h2Elements.length === 0) {
                return htmlString;
            }

            for (let h2 of h2Elements) {
                let idAttr = h2.id ? decodeURIComponent(h2.id).toLowerCase() : '';
                let textContent = h2.textContent.toLowerCase();
                
                if (textContent.includes('français') || textContent.includes('francais') || idAttr.includes('français') || idAttr.includes('francais') || idAttr.includes('_français') || idAttr.includes('_francais')) {
                    let current = h2.nextElementSibling;
                    while (current && current.tagName !== 'H2') {
                        combinedHtml += current.outerHTML;
                        current = current.nextElementSibling;
                    }
                }
            }

            return combinedHtml.trim() ? combinedHtml : htmlString;
        }

        function parseHtmlToCleanText(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            // 1. Suppression agressive de tous les éléments parasites, balises d'édition et blocs annexes
            const selectorsToRemove = [
                '.mw-editsection', '.mw-editsection-bracket', 'script', 'style', '.printfooter', 
                '.navigation-not-searchable', '.toc', '#toc', 
                '.mw-references-wrap', '.references', '.ambox', 
                '.infobox', '.navbox', '.thumb', '.mw-empty-elt',
                '.reference', '.audiolink', 'sup', '.sister-project', 
                '.NavFrame', '.mw-jump-link', '.interproject',
                'table', 'small', '.lexicographer', '.vector-menu',
                '.mw-indicators', 'header', 'footer', 'nav'
            ];
            
            selectorsToRemove.forEach(selector => {
                try {
                    doc.querySelectorAll(selector).forEach(el => el.remove());
                } catch (e) {}
            });

            // 2. Suppression des sections non désirées (Traductions, Prononciation, Anagrammes, Références, etc.)
            doc.querySelectorAll('h3, h4, h5').forEach(heading => {
                const title = heading.textContent.toLowerCase();
                if (
                    title.includes('traduction') || 
                    title.includes('prononciation') || 
                    title.includes('homophone') || 
                    title.includes('anagramme') || 
                    title.includes('référence') || 
                    title.includes('voir aussi') ||
                    title.includes('apparenté') ||
                    title.includes('dérivé') ||
                    title.includes('synonyme') ||
                    title.includes('hyperonyme')
                ) {
                    let current = heading.nextElementSibling;
                    while (current && !['H2', 'H3'].includes(current.tagName)) {
                        let next = current.nextElementSibling;
                        current.remove();
                        current = next;
                    }
                    heading.remove();
                }
            });

            // 3. Suppression des paragraphes/lignes de citations littéraires ou métadonnées résiduelles
            doc.querySelectorAll('p, dd, li').forEach(el => {
                let text = el.textContent;
                if (text.includes('—') || text.includes('page') || text.includes('no ') || text.includes('édition')) {
                    el.remove();
                }
            });

            // 4. Nettoyage des liens et transformation en texte brut
            doc.querySelectorAll('a').forEach(a => {
                const text = a.textContent.trim();
                if (text) {
                    a.replaceWith(document.createTextNode(text));
                } else {
                    a.remove();
                }
            });

            doc.querySelectorAll('br').forEach(el => el.replaceWith(document.createTextNode('\n')));

            // 5. Formatage propre des listes et paragraphes restants
            doc.querySelectorAll('li, dd').forEach(el => {
                if (el.dataset.processed) return;
                let depth = 0;
                let parent = el.parentElement;
                while (parent && (parent.tagName === 'UL' || parent.tagName === 'OL' || parent.tagName === 'DL')) {
                    depth++;
                    parent = parent.parentElement;
                }
                const indent = '  '.repeat(Math.max(0, depth - 1));
                el.prepend(`${indent}- `);
                el.dataset.processed = 'true';
            });

            doc.querySelectorAll('p, dt, h3, h4').forEach(el => {
                el.prepend('\n');
                el.append('\n');
            });

            let text = doc.body.textContent || "";

            // 6. Nettoyage global approfondi des mots parasites, bruits, guillemets superflus et ponctuations orphelines
            return text
                .replace(/\b(modifier|modifier le wikicode|data précisée|français)\b/gi, '')
                .replace(/\\[^\\}]*\\/g, '')
                .replace(/[„“""«»]/g, '') // Supprime les guillemets superflus
                .replace(/\r\n/g, '\n')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .replace(/[ \t]{2,}/g, ' ')
                .replace(/^\s*[,.;:]\s*$/gm, '') // Supprime les lignes composées uniquement de ponctuations seules
                .trim();
        }

        async function copyToClipboard() {
            const outputArea = document.getElementById('outputArea');
            const copyBtn = document.getElementById('copyBtn');
            if (!outputArea.value) {
                alert('Rien à copier !');
                return;
            }

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(outputArea.value);
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = 'Copié !';
                    copyBtn.style.backgroundColor = '#27ae60';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                        copyBtn.style.backgroundColor = '';
                    }, 2000);
                } else {
                    outputArea.select();
                    document.execCommand('copy');
                    alert('Texte copié.');
                }
            } catch (err) {
                alert('Impossible de copier automatiquement.');
            }
        }

        function downloadTextFile() {
            const outputArea = document.getElementById('outputArea');
            const wordInput = document.getElementById('wordInput');
            if (!outputArea.value) {
                alert('Rien à télécharger !');
                return;
            }

            const wordName = wordInput.value.trim() || 'wiktionnaire';
            const blob = new Blob([outputArea.value], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${wordName.replace(/[^a-z0-9àâäéèêëîïôöùûüç-]+/gi, '_')}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
