<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Synthétiseur Pyramidal Multi-Sources V6</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#0d1117;
  --panel:#151b23;
  --panel2:#1b222c;
  --border:#293241;
  --text:#e7edf4;
  --muted:#8b98a8;
  --accent:#5aa9ff;
  --accent2:#78c2ff;
  --user:#26384d;
  --success:#65d18a;
  --warning:#e5b85c;
  --danger:#e87575;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  display:flex;
  flex-direction:column;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  height:64px;
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:rgba(13,17,23,.97);
}

.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.brand-title{
  font-size:16px;
  font-weight:700;
  letter-spacing:.2px;
}

.brand-sub{
  font-size:11px;
  color:var(--muted);
}

.header-actions{
  display:flex;
  gap:7px;
}

.small-btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:7px 11px;
  border-radius:7px;
  font-size:12px;
}

.small-btn:hover{
  color:var(--text);
  border-color:#3b4a5e;
}

#chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:18px max(14px,calc((100vw - 850px)/2));
  scroll-behavior:smooth;
}

#chat::-webkit-scrollbar{
  width:8px;
}

#chat::-webkit-scrollbar-track{
  background:transparent;
}

#chat::-webkit-scrollbar-thumb{
  background:#303b49;
  border-radius:10px;
}

.message{
  width:100%;
  margin:0 0 20px;
  animation:fadeIn .15s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(3px)}
  to{opacity:1;transform:none}
}

.user{
  display:flex;
  justify-content:flex-end;
}

.user .bubble{
  max-width:min(78%,680px);
  background:var(--user);
  border:1px solid #31475e;
  color:#edf5ff;
  border-radius:14px 14px 4px 14px;
  padding:10px 13px;
  white-space:pre-wrap;
  line-height:1.5;
  font-size:14px;
}

.assistant{
  display:block;
}

.assistant .answer{
  width:100%;
  color:var(--text);
  line-height:1.65;
  font-size:14px;
  white-space:pre-wrap;
}

.answer-actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:9px;
}

.copy{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:3px 0;
  font-size:11px;
}

.copy:hover{
  color:var(--accent2);
}

.sources{
  margin-top:7px;
  color:#667384;
  font-size:10px;
  line-height:1.5;
  opacity:.9;
}

.step-line{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  padding:3px 0 15px;
}

.step-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:20px;
  height:20px;
  border-radius:50%;
  background:#202936;
  color:#9bb9d8;
  font-size:10px;
}

.step-spinner{
  width:11px;
  height:11px;
  border:2px solid #344253;
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.composer-wrap{
  border-top:1px solid var(--border);
  background:rgba(13,17,23,.98);
  padding:10px max(14px,calc((100vw - 850px)/2)) 12px;
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:8px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:12px;
  padding:7px;
}

#input{
  flex:1;
  min-height:22px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:7px 6px;
  line-height:1.45;
  font-size:14px;
}

#input::placeholder{
  color:#647183;
}

#send{
  width:38px;
  height:34px;
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:#07111d;
  font-weight:700;
}

#send:hover{
  background:var(--accent2);
}

#send:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.status{
  height:15px;
  margin-top:4px;
  color:#667384;
  font-size:9px;
  text-align:right;
}

.welcome{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  padding:15px 0;
}

.welcome strong{
  color:var(--text);
}

@media(max-width:600px){
  .header{
    padding:0 11px;
  }

  .brand-sub{
    display:none;
  }

  #chat{
    padding:14px 11px;
  }

  .composer-wrap{
    padding:8px 10px 10px;
  }

  .user .bubble{
    max-width:88%;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="brand-title">Synthétiseur Pyramidal V6</div>
    <div class="brand-sub">Recherche multi-sources · raisonnement · vérification</div>
  </div>

  <div class="header-actions">
    <button class="small-btn" id="clearBtn">Effacer</button>
  </div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <strong>Moteur prêt.</strong><br>
    Pose une question. Le moteur recherche les sources publiques, extrait les éléments pertinents, construit des relations et tente de vérifier la réponse.
  </div>
</main>

<div class="composer-wrap">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Pose ta question..."></textarea>
    <button id="send" aria-label="Envoyer">➤</button>
  </div>
  <div class="status" id="status">Prêt</div>
</div>

<script>
"use strict";

/* =========================================================
   SYNTHÉTISEUR PYRAMIDAL V6
   =========================================================
   Objectifs :
   - aucune réponse factuelle codée en dur
   - recherche multi-sources
   - Wikimedia + Wikidata
   - analyse générique
   - raisonnement relationnel
   - superlatifs
   - comparaison de valeurs
   - vérification croisée
   - synthèse extractive
   - cache local
   - interface légère
   ========================================================= */

class PyramidV6{

  constructor(stepCallback){

    this.stepCallback=stepCallback;

    this.sources=[
      {
        id:"wikipedia",
        name:"Wikipédia",
        url:"https://fr.wikipedia.org/w/api.php",
        weight:8
      },
      {
        id:"wiktionnaire",
        name:"Wiktionnaire",
        url:"https://fr.wiktionary.org/w/api.php",
        weight:4
      },
      {
        id:"wikiversite",
        name:"Wikiversité",
        url:"https://fr.wikiversity.org/w/api.php",
        weight:3
      },
      {
        id:"wikivoyage",
        name:"Wikivoyage",
        url:"https://fr.wikivoyage.org/w/api.php",
        weight:3
      },
      {
        id:"wikisource",
        name:"Wikisource",
        url:"https://fr.wikisource.org/w/api.php",
        weight:2
      },
      {
        id:"wikiquote",
        name:"Wikiquote",
        url:"https://fr.wikiquote.org/w/api.php",
        weight:2
      },
      {
        id:"wikibooks",
        name:"Wikibooks",
        url:"https://fr.wikibooks.org/w/api.php",
        weight:2
      },
      {
        id:"wikidata",
        name:"Wikidata",
        url:"https://www.wikidata.org/w/api.php",
        weight:10,
        structured:true
      }
    ];

    this.stopwords=new Set([
      "a","ai","as","au","aux","avec","ce","ceci","cela","ces",
      "cet","cette","d","dans","de","des","du","elle","elles",
      "en","es","est","et","eux","il","ils","je","la","le","les",
      "leur","leurs","lui","mais","me","mes","moi","mon","ne","nos",
      "notre","nous","on","ou","par","pas","pour","que","quel",
      "quelle","quelles","quels","qui","quoi","se","ses","son",
      "sont","sur","ta","te","tes","toi","ton","tu","un","une",
      "vos","votre","vous","y","du","des","dun","dune",
      "estce","est-ce","comment","pourquoi","quand","combien",
      "où","peut","peux","peut-on","faire","fait","être","avoir"
    ]);

    this.cache=new Map();
    this.searchCache=new Map();
    this.wikidataCache=new Map();
    this.busy=false;
    this.abortController=null;
    this.sessionMemory=[];
  }

  /* =========================================================
     OUTILS GÉNÉRAUX
     ========================================================= */

  step(text,number){
    if(typeof this.stepCallback==="function"){
      this.stepCallback(text,number);
    }
  }

  norm(value){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .replace(/[’‘`´]/g,"'")
      .replace(/[^\p{L}\p{N}'\s-]/gu," ")
      .replace(/\s+/g," ")
      .trim();
  }

  words(value){
    return this.norm(value)
      .split(/\s+/)
      .filter(Boolean);
  }

  unique(array){
    return [...new Set(array)];
  }

  decodeEntities(value){
    const box=document.createElement("textarea");
    box.innerHTML=String(value||"");
    return box.value;
  }

  clean(value){
    let text=String(value||"");

    text=this.decodeEntities(text);

    text=text
      .replace(/[\u0000-\u001F\u007F-\u009F]/g," ")
      .replace(/<ref[\s\S]*?<\/ref>/gi," ")
      .replace(/<ref[^>]*\/>/gi," ")
      .replace(/<gallery[\s\S]*?<\/gallery>/gi," ")
      .replace(/<math[\s\S]*?<\/math>/gi," ")
      .replace(/<nowiki[\s\S]*?<\/nowiki>/gi," ")
      .replace(/<source[\s\S]*?<\/source>/gi," ")
      .replace(/<syntaxhighlight[\s\S]*?<\/syntaxhighlight>/gi," ")
      .replace(/<timeline[\s\S]*?<\/timeline>/gi," ")
      .replace(/<[^>]+>/g," ")
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,"$2")
      .replace(/\[\[([^\]]+)\]\]/g,"$1")
      .replace(/\{\{[\s\S]*?\}\}/g," ")
      .replace(/\[https?:\/\/[^\s\]]+\s*([^\]]*)\]/gi,"$1")
      .replace(/https?:\/\/\S+/gi," ")
      .replace(/'''?/g,"")
      .replace(/&(?:amp|nbsp|quot|lt|gt);/gi," ")
      .replace(/^\s*[*#;:]+\s*/gm,"")
      .replace(/\s+/g," ")
      .trim();

    return text;
  }

  cleanFinalText(value){
    let text=this.clean(value);

    text=text
      .replace(/^\s*[-*•]\s*/gm,"")
      .replace(/^\s*\d+[.)]\s*/gm,"")
      .replace(/^(sources?|références?)\s*:?.*$/gim,"")
      .replace(/\s{2,}/g," ")
      .trim();

    return text;
  }

  escapeHTML(value){
    return String(value||"")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  async sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
  }

  /* =========================================================
     ANALYSE DE LA QUESTION
     ========================================================= */

  extractTerms(question){

    const normalized=this.norm(question);

    const raw=this.words(question);

    return this.unique(
      raw.filter(word=>{
        if(word.length<2)return false;
        if(this.stopwords.has(word))return false;
        if(/^\d+$/.test(word))return false;
        return true;
      })
    );
  }

  extractPhrases(question){

    const clean=this.clean(question);
    const result=[];

    const quoted=[...clean.matchAll(/["«](.+?)["»]/g)];

    for(const item of quoted){
      if(item[1])result.push(this.norm(item[1]));
    }

    const words=this.words(clean);

    for(let size=4;size>=2;size--){
      for(let i=0;i<=words.length-size;i++){

        const phrase=words.slice(i,i+size);

        if(
          phrase.filter(x=>!this.stopwords.has(x)).length>=2
        ){
          result.push(phrase.join(" "));
        }
      }
    }

    return this.unique(result).slice(0,35);
  }

  detectSuperlative(question){

    const q=this.norm(question);

    let direction=null;
    let property=null;
    let strength=0;

    if(/\bplus grand\b|\bplus grande\b|\bplus vast\b|\bplus vaste\b/.test(q)){
      direction="max";
      property="size";
      strength=1;
    }

    if(/\bplus petit\b|\bplus petite\b/.test(q)){
      direction="min";
      property="size";
      strength=1;
    }

    if(/\bplus peupl[eé]\b/.test(q)){
      direction="max";
      property="population";
      strength=1;
    }

    if(/\bmoins peupl[eé]\b/.test(q)){
      direction="min";
      property="population";
      strength=1;
    }

    if(/\bplus haut\b|\bplus haute\b/.test(q)){
      direction="max";
      property="height";
      strength=1;
    }

    if(/\bplus bas\b|\bplus basse\b/.test(q)){
      direction="min";
      property="height";
      strength=1;
    }

    if(/\bmeilleur\b|\bmeilleure\b/.test(q)){
      direction="max";
      property="quality";
      strength=1;
    }

    if(/\bmoins bon\b|\bmoins bonne\b|\bpire\b/.test(q)){
      direction="min";
      property="quality";
      strength=1;
    }

    return{
      detected:!!direction,
      direction,
      property,
      strength
    };
  }

  detectQuestionType(question){

    const q=this.norm(question);

    if(/\bpourquoi\b|\bpour quelle raison\b/.test(q))
      return"causal";

    if(/\bcomment\b/.test(q))
      return"procedural";

    if(/\bquand\b|\bquelle date\b|\bà quelle époque\b/.test(q))
      return"temporal";

    if(/\boù\b|\bdans quel pays\b|\bdans quelle ville\b/.test(q))
      return"location";

    if(/\bcombien\b|\bquelle quantité\b|\bquel nombre\b/.test(q))
      return"quantity";

    if(/\bqui\b|\bquel est le nom\b|\bquelle personne\b/.test(q))
      return"person";

    if(/\bqu'est-ce que\b|\bc'est quoi\b|\bque signifie\b|\bdefinition\b|\bdéfinition\b/.test(q))
      return"definition";

    if(/\bcapitale\b|\bprésident\b|\broi\b|\brelation\b|\bsiège\b|\blangue\b|\bchef-lieu\b/.test(q))
      return"relation";

    if(/\bcompare\b|\bcomparaison\b|\bentre\b.*\bet\b/.test(q))
      return"comparison";

    return"general";
  }

  extractDomainCandidates(question){

    const q=this.norm(question);

    const candidates=[];

    const patterns=[
      /\b(?:en|dans|sur)\s+([a-zà-ÿ][a-zà-ÿ' -]{2,50})$/i,
      /\b(?:de|du|des|d')\s+([a-zà-ÿ][a-zà-ÿ' -]{2,50})/i,
      /\b(?:d'|de la|de l'|du|des)\s+([a-zà-ÿ][a-zà-ÿ' -]{2,50})/i
    ];

    for(const pattern of patterns){
      const match=q.match(pattern);
      if(match&&match[1]){
        const value=match[1]
          .replace(/\b(quel|quelle|quels|quelles|est|sont)\b.*$/,"")
          .trim();

        if(value.length>2){
          candidates.push(value);
        }
      }
    }

    const geographic=[
      "afrique","europe","asie","amerique","amérique",
      "océanie","oceanie","antarctique","monde",
      "canada","france","québec","quebec"
    ];

    for(const geo of geographic){
      if(q.includes(geo))candidates.push(geo);
    }

    return this.unique(candidates);
  }

  analyzeQuestion(question){

    const q=this.norm(question);

    const relationMap=[];

    if(/\bcapital(?:e|es)?\b|\bchef-lieu\b/.test(q)){
      relationMap.push({
        type:"capital",
        labels:["capitale","chef-lieu"]
      });
    }

    if(/\bpopulation\b|\bhabitants?\b/.test(q)){
      relationMap.push({
        type:"population",
        labels:["population","nombre d'habitants","habitants"]
      });
    }

    if(/\bsuperficie\b|\bsurface\b|\baire\b/.test(q)){
      relationMap.push({
        type:"area",
        labels:["superficie","surface","aire"]
      });
    }

    if(/\blangue\b|\blangues\b/.test(q)){
      relationMap.push({
        type:"language",
        labels:["langue","langues officielles","langue officielle"]
      });
    }

    if(/\bprésident\b|\bprésidente\b/.test(q)){
      relationMap.push({
        type:"president",
        labels:["président","présidente"]
      });
    }

    if(/\bn[ée]\b|\bné à\b|\bnée à\b|\blieu de naissance\b/.test(q)){
      relationMap.push({
        type:"birthplace",
        labels:["lieu de naissance","né à","née à"]
      });
    }

    if(/\bfondateur\b|\bfondatrice\b|\bfondé par\b/.test(q)){
      relationMap.push({
        type:"founder",
        labels:["fondateur","fondatrice","fondé par"]
      });
    }

    if(/\bcréé\b|\bcréation\b|\bfondation\b/.test(q)){
      relationMap.push({
        type:"creation",
        labels:["date de création","création","fondation"]
      });
    }

    return{
      original:question,
      normalized:q,
      terms:this.extractTerms(question),
      phrases:this.extractPhrases(question),
      domains:this.extractDomainCandidates(question),
      type:this.detectQuestionType(question),
      superlative:this.detectSuperlative(question),
      relations:relationMap
    };
  }

  /* =========================================================
     CONSTRUCTION DES REQUÊTES
     ========================================================= */

  buildQueries(questionInfo){

    const q=questionInfo.normalized;
    const queries=[];

    const terms=questionInfo.terms;
    const phrases=questionInfo.phrases;

    if(q){
      queries.push(q);
    }

    for(const phrase of phrases.slice(0,8)){
      if(phrase.length>=5){
        queries.push(phrase);
      }
    }

    if(terms.length){
      queries.push(terms.slice(0,8).join(" "));
      queries.push(terms.slice(0,5).join(" "));
    }

    if(questionInfo.superlative.detected){

      const usefulTerms=terms
        .filter(x=>![
          "plus","moins","grand","grande",
          "petit","petite","haut","haute",
          "meilleur","meilleure","pire"
        ].includes(x));

      if(usefulTerms.length){
        queries.push(
          usefulTerms.slice(0,7).join(" ")
        );
      }
    }

    return this.unique(
      queries
        .map(x=>x.trim())
        .filter(x=>x.length>=2)
    ).slice(0,12);
  }

  /* =========================================================
     API WIKIMEDIA
     ========================================================= */

  async api(url,params={},signal=null){

    const query=new URLSearchParams({
      ...params,
      origin:"*"
    });

    const full=url+"?"+query.toString();

    if(this.cache.has(full)){
      return this.cache.get(full);
    }

    const response=await fetch(full,{
      method:"GET",
      signal
    });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data=await response.json();

    this.cache.set(full,data);

    return data;
  }

  /* =========================================================
     RECHERCHE TEXTUELLE
     ========================================================= */

  async searchSource(source,query,limit=6){

    const key=source.id+"|"+query+"|"+limit;

    if(this.searchCache.has(key)){
      return this.searchCache.get(key);
    }

    if(source.structured){
      return[];
    }

    try{

      const data=await this.api(
        source.url,
        {
          action:"query",
          list:"search",
          srsearch:query,
          srnamespace:0,
          srlimit:String(limit),
          format:"json"
        },
        this.abortController?.signal
      );

      const results=(data?.query?.search||[]).map(item=>({
        source:source.name,
        sourceId:source.id,
        title:item.title,
        pageid:item.pageid,
        snippet:this.clean(item.snippet||""),
        timestamp:item.timestamp||null
      }));

      this.searchCache.set(key,results);

      return results;

    }catch(error){

      return[];
    }
  }

  async searchAll(queries){

    const results=[];

    for(const query of queries){

      const batch=await Promise.all(
        this.sources
          .filter(source=>!source.structured)
          .map(source=>this.searchSource(source,query,5))
      );

      for(const group of batch){
        results.push(...group);
      }

      await this.sleep(20);
    }

    return results;
  }

  /* =========================================================
     EXTRACTION DES PAGES
     ========================================================= */

  async fetchExtract(result){

    const key=
      result.sourceId+
      "|" +
      result.pageid;

    if(this.cache.has("extract|"+key)){
      return this.cache.get("extract|"+key);
    }

    const source=this.sources.find(
      x=>x.id===result.sourceId
    );

    if(!source)return result;

    try{

      const data=await this.api(
        source.url,
        {
          action:"query",
          prop:"extracts|info",
          exintro:"0",
          explaintext:"1",
          inprop:"url",
          pageids:String(result.pageid),
          format:"json"
        },
        this.abortController?.signal
      );

      const page=data?.query?.pages?.[String(result.pageid)];

      const enriched={
        ...result,
        text:this.clean(page?.extract||result.snippet||""),
        url:page?.fullurl||null
      };

      this.cache.set("extract|"+key,enriched);

      return enriched;

    }catch(error){

      return{
        ...result,
        text:this.clean(result.snippet||"")
      };
    }
  }

  /* =========================================================
     WIKIDATA
     ========================================================= */

  async wikidataSearch(label,limit=5){

    const key="wdsearch|"+label+"|"+limit;

    if(this.wikidataCache.has(key)){
      return this.wikidataCache.get(key);
    }

    try{

      const data=await this.api(
        "https://www.wikidata.org/w/api.php",
        {
          action:"wbsearchentities",
          search:label,
          language:"fr",
          uselang:"fr",
          type:"item",
          limit:String(limit),
          format:"json"
        },
        this.abortController?.signal
      );

      const results=(data?.search||[]).map(item=>({
        id:item.id,
        label:item.label||"",
        description:item.description||"",
        url:item.concepturi||null,
        source:"Wikidata"
      }));

      this.wikidataCache.set(key,results);

      return results;

    }catch(error){

      return[];
    }
  }

  async wikidataEntities(ids){

    const cleanIds=this.unique(
      ids.filter(id=>/^Q\d+$/i.test(id))
    );

    if(!cleanIds.length)return[];

    const chunks=[];

    for(let i=0;i<cleanIds.length;i+=40){
      chunks.push(cleanIds.slice(i,i+40));
    }

    const all=[];

    for(const chunk of chunks){

      const key="wdentities|"+chunk.join("|");

      let data=this.wikidataCache.get(key);

      if(!data){

        try{

          data=await this.api(
            "https://www.wikidata.org/w/api.php",
            {
              action:"wbgetentities",
              ids:chunk.join("|"),
              languages:"fr|en",
              props:"labels|descriptions|claims|sitelinks",
              format:"json"
            },
            this.abortController?.signal
          );

          this.wikidataCache.set(key,data);

        }catch(error){
          continue;
        }
      }

      for(const id of chunk){

        const entity=data?.entities?.[id];

        if(entity){
          all.push(entity);
        }
      }

      await this.sleep(15);
    }

    return all;
  }

  async wikidataProperties(ids){

    const cleanIds=this.unique(
      ids.filter(id=>/^P\d+$/i.test(id))
    );

    if(!cleanIds.length)return{};

    const result={};

    for(let i=0;i<cleanIds.length;i+=40){

      const chunk=cleanIds.slice(i,i+40);

      const key="wdprops|"+chunk.join("|");

      let data=this.wikidataCache.get(key);

      if(!data){

        try{

          data=await this.api(
            "https://www.wikidata.org/w/api.php",
            {
              action:"wbgetentities",
              ids:chunk.join("|"),
              languages:"fr|en",
              props:"labels|descriptions",
              format:"json"
            },
            this.abortController?.signal
          );

          this.wikidataCache.set(key,data);

        }catch(error){
          continue;
        }
      }

      for(const id of chunk){

        const entity=data?.entities?.[id];

        if(entity){
          result[id]={
            id,
            label:
              entity.labels?.fr?.value||
              entity.labels?.en?.value||
              id,
            description:
              entity.descriptions?.fr?.value||
              entity.descriptions?.en?.value||
              ""
          };
        }
      }
    }

    return result;
  }

  getClaimValue(claim){

    const value=claim?.mainsnak?.datavalue?.value;

    if(value===undefined||value===null){
      return null;
    }

    const type=claim?.mainsnak?.datavalue?.type;

    if(type==="wikibase-entityid"){
      return{
        kind:"entity",
        id:value.id||null
      };
    }

    if(type==="quantity"){
      const amount=String(value.amount||"")
        .replace("+","");

      const number=Number(amount);

      return{
        kind:"quantity",
        amount:Number.isFinite(number)?number:null,
        raw:amount,
        unit:value.unit||null
      };
    }

    if(type==="monolingualtext"){
      return{
        kind:"text",
        text:value.text||""
      };
    }

    if(type==="string"){
      return{
        kind:"text",
        text:value
      };
    }

    if(type==="time"){
      return{
        kind:"time",
        time:value.time||""
      };
    }

    if(type==="globecoordinate"){
      return{
        kind:"coordinate",
        latitude:value.latitude,
        longitude:value.longitude
      };
    }

    return{
      kind:type||"unknown",
      value
    };
  }

  async buildWikidataFacts(entities){

    const propertyIds=new Set();
    const objectIds=new Set();

    for(const entity of entities){

      const claims=entity.claims||{};

      for(const propertyId of Object.keys(claims)){

        propertyIds.add(propertyId);

        for(const claim of claims[propertyId]||[]){

          const value=this.getClaimValue(claim);

          if(value?.kind==="entity"&&value.id){
            objectIds.add(value.id);
          }
        }
      }
    }

    const [properties,objects]=await Promise.all([
      this.wikidataProperties([...propertyIds]),
      this.wikidataEntities([...objectIds])
    ]);

    const objectMap=new Map();

    for(const entity of objects){

      objectMap.set(
        entity.id,
        entity.labels?.fr?.value||
        entity.labels?.en?.value||
        entity.id
      );
    }

    const facts=[];

    for(const entity of entities){

      const subjectLabel=
        entity.labels?.fr?.value||
        entity.labels?.en?.value||
        entity.id;

      const claims=entity.claims||{};

      for(const propertyId of Object.keys(claims)){

        const property=properties[propertyId];

        const propertyLabel=
          property?.label||
          propertyId;

        for(const claim of claims[propertyId]||[]){

          const value=this.getClaimValue(claim);

          if(!value)continue;

          let objectLabel="";
          let objectId=null;
          let numeric=null;

          if(value.kind==="entity"){

            objectId=value.id;
            objectLabel=objectMap.get(value.id)||value.id;

          }else if(value.kind==="quantity"){

            numeric=value.amount;
            objectLabel=value.raw;

          }else if(value.kind==="text"){

            objectLabel=value.text;

          }else if(value.kind==="time"){

            objectLabel=value.time;

          }else if(value.kind==="coordinate"){

            objectLabel=
              value.latitude+
              ", "+
              value.longitude;
          }

          facts.push({
            subjectId:entity.id,
            subjectLabel,
            propertyId,
            propertyLabel,
            objectId,
            objectLabel,
            numeric,
            source:"Wikidata",
            confidence:0.95,
            rank:claim.rank||"normal"
          });
        }
      }
    }

    return facts;
  }

  /* =========================================================
     DISCOVERY
     ========================================================= */

  async discoverConcepts(questionInfo,searchResults){

    const labels=[];

    for(const result of searchResults.slice(0,30)){

      if(result.title){
        labels.push(result.title);
      }
    }

    for(const term of questionInfo.terms){

      if(term.length>=4){
        labels.push(term);
      }
    }

    for(const phrase of questionInfo.phrases.slice(0,8)){
      if(phrase.length>=5){
        labels.push(phrase);
      }
    }

    const uniqueLabels=this.unique(labels).slice(0,30);

    const groups=await Promise.all(
      uniqueLabels.map(label=>this.wikidataSearch(label,3))
    );

    const entities=[];

    for(const group of groups){
      entities.push(...group);
    }

    const uniqueEntities=[];
    const seen=new Set();

    for(const entity of entities){

      if(seen.has(entity.id))continue;

      seen.add(entity.id);
      uniqueEntities.push(entity);
    }

    return uniqueEntities.slice(0,35);
  }

  async secondPass(questionInfo,initialResults){

    const candidates=[];

    for(const result of initialResults.slice(0,15)){
      if(result.title)candidates.push(result.title);
    }

    for(const domain of questionInfo.domains){
      candidates.push(domain);
    }

    const queries=[];

    if(questionInfo.superlative.detected){

      for(const candidate of candidates.slice(0,8)){
        queries.push(candidate);
      }
    }

    for(const relation of questionInfo.relations){

      for(const label of relation.labels){
        queries.push(label);
      }
    }

    if(questionInfo.domains.length){
      for(const domain of questionInfo.domains){
        for(const relation of questionInfo.relations){
          queries.push(
            domain+" "+relation.labels[0]
          );
        }
      }
    }

    if(!queries.length)return[];

    const results=await this.searchAll(
      this.unique(queries).slice(0,12)
    );

    return results;
  }

  /* =========================================================
     TYPES D'ENTITÉS
     ========================================================= */

  inferEntityType(entity){

    const text=this.norm(
      [
        entity?.label,
        entity?.description
      ].filter(Boolean).join(" ")
    );

    if(/\bpays\b|\bétat souverain\b/.test(text))
      return"country";

    if(/\bville\b|\bmunicipalité\b|\bcommune\b/.test(text))
      return"city";

    if(/\bpersonne\b|\bhomme\b|\bfemme\b|\bscientifique\b|\bpoliticien\b|\bpoliticienne\b/.test(text))
      return"person";

    if(/\bmontagne\b|\bsommet\b/.test(text))
      return"mountain";

    if(/\bfleuve\b|\brivière\b|\briviere\b/.test(text))
      return"river";

    if(/\bentreprise\b|\bsociété\b|\bsociete\b|\bcompagnie\b/.test(text))
      return"company";

    if(/\borganisation\b|\borganisation internationale\b/.test(text))
      return"organization";

    return"unknown";
  }

  /* =========================================================
     SCORING
     ========================================================= */

  termScore(text,terms){

    const n=this.norm(text);

    let score=0;

    for(const term of terms){

      const t=this.norm(term);

      if(!t)continue;

      if(n===t){
        score+=8;
      }else if(n.includes(t)){
        score+=3;
      }
    }

    return score;
  }

  phraseScore(text,phrases){

    const n=this.norm(text);

    let score=0;

    for(const phrase of phrases){

      const p=this.norm(phrase);

      if(p.length>=5&&n.includes(p)){
        score+=3;
      }
    }

    return score;
  }

  domainScore(text,domains){

    const n=this.norm(text);

    let score=0;

    for(const domain of domains){

      const d=this.norm(domain);

      if(d&&n.includes(d)){
        score+=4;
      }
    }

    return score;
  }

  superlativeScore(text,questionInfo){

    if(!questionInfo.superlative.detected)return 0;

    const n=this.norm(text);

    let score=0;

    if(questionInfo.superlative.property==="size"){
      if(/\bsuperficie\b|\bsurface\b|\baire\b/.test(n))
        score+=4;
    }

    if(questionInfo.superlative.property==="population"){
      if(/\bpopulation\b|\bhabitants?\b/.test(n))
        score+=4;
    }

    if(questionInfo.superlative.property==="height"){
      if(/\baltitude\b|\bhauteur\b|\bmètres?\b|\bmetres?\b/.test(n))
        score+=4;
    }

    return score;
  }

  relationScore(text,relations){

    const n=this.norm(text);

    let score=0;

    for(const relation of relations){

      for(const label of relation.labels){

        if(n.includes(this.norm(label))){
          score+=3;
        }
      }
    }

    return score;
  }

  typePenalty(result,questionInfo){

    if(!result)return 0;

    const text=this.norm(
      [
        result.title,
        result.snippet,
        result.text
      ].join(" ")
    );

    let penalty=0;

    if(questionInfo.type==="person"){

      if(/\bfilm\b|\bchanson\b|\balbum\b|\broman\b/.test(text)){
        penalty+=3;
      }
    }

    if(questionInfo.superlative.detected){

      if(/\bhomme\b|\bfemme\b|\bpersonne\b/.test(text) &&
         questionInfo.superlative.property==="size"){
        penalty+=2;
      }
    }

    return penalty;
  }

  driftPenalty(result,questionInfo){

    const text=[
      result.title,
      result.snippet,
      result.text
    ].join(" ");

    const terms=questionInfo.terms;

    if(!terms.length)return 0;

    const score=this.termScore(text,terms);

    return score===0?5:0;
  }

  score(result,questionInfo){

    const text=[
      result.title,
      result.snippet,
      result.text
    ].join(" ");

    const source=this.sources.find(
      s=>s.id===result.sourceId
    );

    const sourceWeight=source?.weight||1;

    let score=0;

    score+=this.termScore(
      text,
      questionInfo.terms
    );

    score+=this.phraseScore(
      text,
      questionInfo.phrases
    );

    score+=this.domainScore(
      text,
      questionInfo.domains
    );

    score+=this.superlativeScore(
      text,
      questionInfo
    );

    score+=this.relationScore(
      text,
      questionInfo.relations
    );

    score+=sourceWeight*.35;

    score-=this.typePenalty(
      result,
      questionInfo
    );

    score-=this.driftPenalty(
      result,
      questionInfo
    );

    return score;
  }

  /* =========================================================
     PASSAGES
     ========================================================= */

  buildPassages(results){

    const passages=[];

    for(const result of results){

      const text=this.clean(
        result.text||
        result.snippet||
        ""
      );

      if(!text)continue;

      const sentences=text
        .split(/(?<=[.!?])\s+/)
        .map(x=>x.trim())
        .filter(x=>x.length>25);

      for(const sentence of sentences.slice(0,25)){

        passages.push({
          text:sentence,
          title:result.title,
          source:result.source,
          sourceId:result.sourceId,
          pageid:result.pageid,
          url:result.url||null
        });
      }
    }

    return passages;
  }

  similarity(a,b){

    const aw=new Set(this.words(a));
    const bw=new Set(this.words(b));

    if(!aw.size||!bw.size)return 0;

    let common=0;

    for(const word of aw){
      if(bw.has(word))common++;
    }

    return common/
      Math.sqrt(aw.size*bw.size);
  }

  selectPassages(passages,questionInfo,limit=12){

    const scored=passages.map(item=>{

      const base=this.termScore(
        item.text,
        questionInfo.terms
      );

      const phrase=this.phraseScore(
        item.text,
        questionInfo.phrases
      );

      const domain=this.domainScore(
        item.text,
        questionInfo.domains
      );

      const relation=this.relationScore(
        item.text,
        questionInfo.relations
      );

      return{
        ...item,
        score:
          base+
          phrase+
          domain+
          relation
      };
    });

    scored.sort((a,b)=>b.score-a.score);

    const selected=[];

    for(const item of scored){

      if(selected.length>=limit)break;

      const duplicate=selected.some(
        existing=>
          this.similarity(
            existing.text,
            item.text
          )>.82
      );

      if(!duplicate){
        selected.push(item);
      }
    }

    return selected;
  }

  /* =========================================================
     EXTRACTION DE RELATIONS TEXTUELLES
     ========================================================= */

  extractTextRelations(passages){

    const relations=[];

    for(const passage of passages){

      const text=this.clean(passage.text);

      let match;

      match=text.match(
        /^(.{2,100}?)\s+(?:est|sont|a pour)\s+(?:la\s+)?capitale\s+(?:de|d')\s+(.{2,100}?)(?:[.!?]|$)/i
      );

      if(match){
        relations.push({
          subject:this.clean(match[2]),
          relation:"capitale",
          object:this.clean(match[1]),
          value:null,
          source:passage.source,
          evidence:text,
          url:passage.url||null
        });
      }

      match=text.match(
        /^(.{2,100}?)\s+(?:est|sont)\s+(?:la\s+)?capitale\s+(?:de|d')\s+(.{2,100}?)(?:[.!?]|$)/i
      );

      if(match){
        relations.push({
          subject:this.clean(match[2]),
          relation:"capitale",
          object:this.clean(match[1]),
          value:null,
          source:passage.source,
          evidence:text,
          url:passage.url||null
        });
      }

      match=text.match(
        /(.{2,100}?)\s+(?:compte|compterait|possède)\s+([\d\s.,]+)\s*(?:habitants|personnes)/i
      );

      if(match){

        const number=this.parseNumber(match[2]);

        if(number!==null){

          relations.push({
            subject:this.clean(match[1]),
            relation:"population",
            object:null,
            value:number,
            source:passage.source,
            evidence:text,
            url:passage.url||null
          });
        }
      }

      match=text.match(
        /(.{2,100}?)\s+(?:couvre|possède|a)\s+(?:une\s+)?superficie\s+(?:de\s+)?([\d\s.,]+)\s*(?:km²|km2|km)/i
      );

      if(match){

        const number=this.parseNumber(match[2]);

        if(number!==null){

          relations.push({
            subject:this.clean(match[1]),
            relation:"superficie",
            object:null,
            value:number,
            source:passage.source,
            evidence:text,
            url:passage.url||null
          });
        }
      }

      match=text.match(
        /(.{2,100}?)\s+(?:est|se trouve|se situe|est située|est situé)\s+(?:en|au|aux|dans)\s+(.{2,100}?)(?:[.!?]|$)/i
      );

      if(match){

        relations.push({
          subject:this.clean(match[1]),
          relation:"localisation",
          object:this.clean(match[2]),
          value:null,
          source:passage.source,
          evidence:text,
          url:passage.url||null
        });
      }

      match=text.match(
        /(.{2,100}?)\s+(?:est né|est née|naquit)\s+(?:à|en)\s+(.{2,100}?)(?:[.!?]|$)/i
      );

      if(match){

        relations.push({
          subject:this.clean(match[1]),
          relation:"naissance",
          object:this.clean(match[2]),
          value:null,
          source:passage.source,
          evidence:text,
          url:passage.url||null
        });
      }
    }

    return relations;
  }

  parseNumber(value){

    if(value===null||value===undefined)return null;

    let text=String(value)
      .replace(/\u00A0/g," ")
      .replace(/\s/g,"")
      .replace(/[^\d,.-]/g,"");

    if(!text)return null;

    const commas=(text.match(/,/g)||[]).length;
    const dots=(text.match(/\./g)||[]).length;

    if(commas===1&&dots===0){
      text=text.replace(",",".");
    }else{
      text=text.replace(/,/g,"");
    }

    const n=Number(text);

    return Number.isFinite(n)?n:null;
  }

  /* =========================================================
     GRAPHE DE CONNAISSANCES
     ========================================================= */

  createGraph(){

    return{
      nodes:new Map(),
      edges:[]
    };
  }

  addNode(graph,id,data={}){

    if(!id)return null;

    if(!graph.nodes.has(id)){

      graph.nodes.set(id,{
        id,
        label:data.label||id,
        type:data.type||"unknown",
        sources:new Set(),
        data:{}
      });

    }else{

      const node=graph.nodes.get(id);

      if(data.label&&(!node.label||node.label===node.id)){
        node.label=data.label;
      }

      if(data.type&&node.type==="unknown"){
        node.type=data.type;
      }
    }

    return graph.nodes.get(id);
  }

  addEdge(graph,edge){

    if(!edge.subject||!edge.relation)return;

    graph.edges.push({
      subject:edge.subject,
      relation:edge.relation,
      object:edge.object||null,
      value:
        edge.value===undefined?
        null:
        edge.value,
      source:edge.source||"inconnu",
      confidence:
        edge.confidence===undefined?
        .5:
        edge.confidence,
      evidence:edge.evidence||"",
      propertyId:edge.propertyId||null
    });
  }

  normalizeRelationLabel(label){

    const n=this.norm(label);

    if(/\bcapital/.test(n))
      return"capital";

    if(/\bsuperficie\b|\bsurface\b|\baire\b/.test(n))
      return"area";

    if(/\bpopulation\b|\bhabitant/.test(n))
      return"population";

    if(/\blangue/.test(n))
      return"language";

    if(/\bpresident/.test(n))
      return"president";

    if(/\bne\b|\bnaissance\b/.test(n))
      return"birthplace";

    if(/\bfond/.test(n))
      return"founder";

    if(/\baltitude\b|\bhauteur\b/.test(n))
      return"height";

    if(/\bcreation\b|\bfondation\b/.test(n))
      return"creation";

    return n;
  }

  relationMatches(edge,questionInfo){

    const relationType=this.normalizeRelationLabel(
      edge.relation
    );

    for(const relation of questionInfo.relations){

      if(relation.type===relationType){
        return true;
      }
    }

    return false;
  }

  propertyMatchesSuperlative(fact,questionInfo){

    if(!questionInfo.superlative.detected){
      return false;
    }

    const label=this.norm(
      fact.propertyLabel||""
    );

    const property=
      questionInfo.superlative.property;

    if(property==="size"){
      return /\bsuperficie\b|\bsurface\b|\baire\b/.test(label);
    }

    if(property==="population"){
      return /\bpopulation\b|\bhabitants?\b/.test(label);
    }

    if(property==="height"){
      return /\baltitude\b|\bhauteur\b/.test(label);
    }

    return false;
  }

  buildKnowledgeGraph(facts,textRelations,entities){

    const graph=this.createGraph();

    for(const entity of entities){

      this.addNode(
        graph,
        entity.id,
        {
          label:
            entity.label||
            entity.labels?.fr?.value||
            entity.id,
          type:this.inferEntityType(entity)
        }
      );
    }

    for(const fact of facts){

      const subjectId=fact.subjectId;

      this.addNode(
        graph,
        subjectId,
        {
          label:fact.subjectLabel
        }
      );

      let object=fact.objectId||fact.objectLabel||null;

      if(fact.objectId){

        this.addNode(
          graph,
          fact.objectId,
          {
            label:fact.objectLabel
          }
        );
      }

      this.addEdge(
        graph,
        {
          subject:subjectId,
          relation:fact.propertyLabel,
          object,
          value:
            fact.numeric!==null&&fact.numeric!==undefined?
            fact.numeric:
            fact.objectLabel,
          source:"Wikidata",
          confidence:fact.confidence,
          evidence:
            fact.subjectLabel+
            " — "+
            fact.propertyLabel+
            " → "+
            (fact.objectLabel||""),
          propertyId:fact.propertyId
        }
      );
    }

    for(const relation of textRelations){

      const subjectKey=
        "text:"+this.norm(relation.subject);

      const objectKey=
        "text:"+this.norm(relation.object||"");

      this.addNode(
        graph,
        subjectKey,
        {
          label:relation.subject
        }
      );

      if(relation.object){

        this.addNode(
          graph,
          objectKey,
          {
            label:relation.object
          }
        );
      }

      this.addEdge(
        graph,
        {
          subject:subjectKey,
          relation:relation.relation,
          object:
            relation.object?
            objectKey:
            null,
          value:relation.value,
          source:relation.source,
          confidence:.65,
          evidence:relation.evidence
        }
      );
    }

    return graph;
  }

  /* =========================================================
     RECHERCHE D'ENTITÉS DANS LE GRAPHE
     ========================================================= */

  findCandidateNodes(graph,questionInfo){

    const candidates=[];

    for(const node of graph.nodes.values()){

      let score=0;

      score+=this.termScore(
        node.label,
        questionInfo.terms
      );

      score+=this.domainScore(
        node.label,
        questionInfo.domains
      );

      const type=node.type;

      if(
        questionInfo.superlative.property==="size" &&
        type==="country"
      ){
        score+=1;
      }

      if(
        questionInfo.superlative.property==="height" &&
        type==="mountain"
      ){
        score+=1;
      }

      if(score>0){

        candidates.push({
          node,
          score
        });
      }
    }

    candidates.sort((a,b)=>b.score-a.score);

    return candidates;
  }

  getNumericEdges(graph,nodeId,questionInfo){

    return graph.edges.filter(edge=>
      edge.subject===nodeId &&
      typeof edge.value==="number" &&
      this.propertyMatchesSuperlative(
        {
          propertyLabel:edge.relation
        },
        questionInfo
      )
    );
  }

  solveSuperlative(graph,questionInfo){

    if(!questionInfo.superlative.detected){
      return null;
    }

    const candidates=this.findCandidateNodes(
      graph,
      questionInfo
    );

    const values=[];

    for(const candidate of candidates){

      const edges=this.getNumericEdges(
        graph,
        candidate.node.id,
        questionInfo
      );

      for(const edge of edges){

        if(typeof edge.value!=="number")continue;

        values.push({
          node:candidate.node,
          edge,
          value:edge.value,
          score:candidate.score
        });
      }
    }

    if(!values.length){
      return null;
    }

    values.sort((a,b)=>{

      if(questionInfo.superlative.direction==="min"){
        return a.value-b.value;
      }

      return b.value-a.value;
    });

    return{
      winner:values[0],
      candidates:values
    };
  }

  findRelationFromNode(graph,nodeId,questionInfo){

    const matches=[];

    for(const edge of graph.edges){

      if(edge.subject!==nodeId)continue;

      if(this.relationMatches(edge,questionInfo)){

        matches.push(edge);
      }
    }

    matches.sort(
      (a,b)=>b.confidence-a.confidence
    );

    return matches;
  }

  /* =========================================================
     VALIDATION
     ========================================================= */

  validateCandidate(candidate,questionInfo){

    if(!candidate)return false;

    if(questionInfo.relations.length===0){
      return true;
    }

    return true;
  }

  findContradictions(edges){

    const groups=new Map();

    for(const edge of edges){

      const key=
        edge.subject+
        "|"+
        this.normalizeRelationLabel(edge.relation);

      if(!groups.has(key)){
        groups.set(key,[]);
      }

      groups.get(key).push(edge);
    }

    const contradictions=[];

    for(const [key,group] of groups){

      const values=this.unique(
        group
          .map(x=>String(x.object||x.value||""))
          .filter(Boolean)
      );

      if(values.length>1){

        contradictions.push({
          key,
          values,
          edges:group
        });
      }
    }

    return contradictions;
  }

  /* =========================================================
     EVIDENCE
     ========================================================= */

  aggregateEvidence(edges){

    const sourceSet=new Set();

    for(const edge of edges){

      if(edge.source){
        sourceSet.add(edge.source);
      }
    }

    const direct=edges.filter(
      edge=>edge.confidence>=.8
    ).length;

    const diversity=sourceSet.size;

    let confidence=.35;

    confidence+=Math.min(.3,direct*.08);
    confidence+=Math.min(.2,diversity*.05);

    if(confidence>0.97)confidence=.97;

    return{
      confidence,
      sourceCount:diversity,
      directCount:direct
    };
  }

  /* =========================================================
     RÉPONSE PAR GRAPHE
     ========================================================= */

  graphAnswer(graph,questionInfo){

    /*
      Cas 1 :
      question superlative
      -> choisir le candidat selon une valeur numérique
      -> suivre la relation demandée
    */

    if(questionInfo.superlative.detected){

      const solved=this.solveSuperlative(
        graph,
        questionInfo
      );

      if(solved){

        const winner=solved.winner;

        const relations=this.findRelationFromNode(
          graph,
          winner.node.id,
          questionInfo
        );

        if(relations.length){

          const best=relations[0];

          let targetLabel=best.object;

          if(best.object){

            const node=graph.nodes.get(best.object);

            if(node){
              targetLabel=node.label;
            }
          }

          if(targetLabel){

            const evidence=[
              solved.winner.edge,
              best
            ];

            const confidence=
              this.aggregateEvidence(evidence);

            return{
              answer:
                winner.node.label+
                " est l'élément retenu après comparaison des valeurs disponibles. "+
                "La relation demandée donne : "+
                targetLabel+".",
              answerText:
                winner.node.label+
                " est l'élément retenu après comparaison des valeurs disponibles. "+
                "La relation demandée donne : "+
                targetLabel+".",
              confidence,
              evidence,
              reasoning:{
                winner:winner.node.label,
                value:winner.value,
                relation:best.relation,
                target:targetLabel
              }
            };
          }
        }
      }
    }

    /*
      Cas 2 :
      relation directe
    */

    const candidates=this.findCandidateNodes(
      graph,
      questionInfo
    );

    for(const candidate of candidates.slice(0,12)){

      const relations=this.findRelationFromNode(
        graph,
        candidate.node.id,
        questionInfo
      );

      if(!relations.length)continue;

      const best=relations[0];

      let targetLabel=best.object;

      if(best.object){

        const node=graph.nodes.get(best.object);

        if(node){
          targetLabel=node.label;
        }
      }

      if(!targetLabel&&best.value!==null){
        targetLabel=String(best.value);
      }

      if(targetLabel){

        const confidence=
          this.aggregateEvidence([best]);

        return{
          answer:
            candidate.node.label+
            " : "+
            targetLabel+".",
          answerText:
            candidate.node.label+
            " : "+
            targetLabel+".",
          confidence,
          evidence:[best],
          reasoning:{
            subject:candidate.node.label,
            relation:best.relation,
            target:targetLabel
          }
        };
      }
    }

    return null;
  }

  /* =========================================================
     SYNTHÈSE EXTRACTIVE
     ========================================================= */

  synthesize(passages,questionInfo){

    if(!passages.length){

      return{
        answerText:
          "Je n'ai pas trouvé suffisamment d'informations fiables pour répondre à cette question.",
        answer:
          "Je n'ai pas trouvé suffisamment d'informations fiables pour répondre à cette question.",
        evidence:[],
        confidence:.1
      };
    }

    const ranked=passages.map(item=>{

      const score=
        this.termScore(
          item.text,
          questionInfo.terms
        )+
        this.phraseScore(
          item.text,
          questionInfo.phrases
        )+
        this.domainScore(
          item.text,
          questionInfo.domains
        )+
        this.relationScore(
          item.text,
          questionInfo.relations
        );

      return{
        ...item,
        rank:score
      };
    });

    ranked.sort((a,b)=>b.rank-a.rank);

    const selected=ranked.slice(0,6);

    const sentences=[];

    for(const item of selected){

      const text=this.cleanFinalText(
        item.text
      );

      if(!text)continue;

      const duplicate=sentences.some(
        x=>this.similarity(x.text,text)>.78
      );

      if(!duplicate){

        sentences.push({
          text,
          source:item.source,
          url:item.url
        });
      }
    }

    const answerText=sentences
      .slice(0,5)
      .map(x=>x.text)
      .join(" ");

    const sourceSet=new Set(
      sentences.map(x=>x.source)
    );

    let confidence=.25+
      Math.min(.45,sourceSet.size*.08);

    if(questionInfo.relations.length){
      confidence+=.08;
    }

    if(confidence>.9)confidence=.9;

    return{
      answerText:
        answerText||
        "Les sources trouvées ne permettent pas de produire une réponse suffisamment claire.",
      answer:
        answerText||
        "Les sources trouvées ne permettent pas de produire une réponse suffisamment claire.",
      evidence:sentences,
      confidence
    };
  }

  /* =========================================================
     FORMATAGE DES SOURCES
     ========================================================= */

  formatSources(result){

    const names=[];

    if(result?.evidence){

      for(const item of result.evidence){

        const name=
          item.source||
          "Source";

        if(!names.includes(name)){
          names.push(name);
        }
      }
    }

    return names.slice(0,7).join(" · ");
  }

  /* =========================================================
     MÉMOIRE DE SESSION
     ========================================================= */

  remember(question,result){

    this.sessionMemory.push({
      question,
      answer:result?.answerText||"",
      time:Date.now(),
      confidence:result?.confidence||0
    });

    if(this.sessionMemory.length>30){
      this.sessionMemory.shift();
    }
  }

  /* =========================================================
     EXÉCUTION PRINCIPALE
     ========================================================= */

  async run(question){

    if(this.busy){
      throw new Error("Le moteur travaille déjà.");
    }

    this.busy=true;

    this.abortController=new AbortController();

    try{

      const info=this.analyzeQuestion(question);

      this.step(
        "Analyse de la question",
        1
      );

      await this.sleep(80);

      this.step(
        "Construction des recherches",
        2
      );

      const queries=this.buildQueries(info);

      await this.sleep(60);

      this.step(
        "Recherche dans les sources publiques",
        3
      );

      let results=await this.searchAll(
        queries
      );

      results=this.uniqueResults(results);

      if(!results.length){

        this.step(
          "Recherche élargie",
          4
        );

        const fallbackQueries=
          this.unique([
            ...info.terms,
            ...info.domains,
            ...info.phrases.slice(0,5)
          ])
          .filter(x=>x.length>2)
          .slice(0,10);

        const second=await this.searchAll(
          fallbackQueries
        );

        results=this.uniqueResults([
          ...results,
          ...second
        ]);
      }

      this.step(
        "Extraction des informations utiles",
        4
      );

      const enriched=[];

      for(const result of results
        .sort((a,b)=>
          this.score(b,info)-
          this.score(a,info)
        )
        .slice(0,28)
      ){

        const item=await this.fetchExtract(
          result
        );

        enriched.push(item);
      }

      this.step(
        "Découverte des entités",
        5
      );

      const entities=await this.discoverConcepts(
        info,
        enriched
      );

      this.step(
        "Lecture des relations structurées",
        6
      );

      const entityIds=entities
        .map(x=>x.id)
        .filter(Boolean)
        .slice(0,25);

      const fullEntities=
        await this.wikidataEntities(
          entityIds
        );

      const facts=
        await this.buildWikidataFacts(
          fullEntities
        );

      this.step(
        "Deuxième passe de recherche",
        7
      );

      const secondResults=
        await this.secondPass(
          info,
          enriched
        );

      const allResults=this.uniqueResults([
        ...enriched,
        ...secondResults
      ]);

      const passages=
        this.buildPassages(
          allResults
        );

      this.step(
        "Construction du graphe de connaissances",
        8
      );

      const textRelations=
        this.extractTextRelations(
          passages
        );

      const graph=
        this.buildKnowledgeGraph(
          facts,
          textRelations,
          fullEntities
        );

      this.step(
        "Raisonnement et comparaison",
        9
      );

      const graphResult=
        this.graphAnswer(
          graph,
          info
        );

      let finalResult=graphResult;

      if(!finalResult){

        this.step(
          "Sélection des passages les plus pertinents",
          10
        );

        const selected=
          this.selectPassages(
            passages,
            info,
            14
          );

        this.step(
          "Synthèse et vérification",
          11
        );

        finalResult=
          this.synthesize(
            selected,
            info
          );
      }

      /*
        Vérification complémentaire :
        on ne modifie pas automatiquement une réponse
        structurée forte avec un résultat textuel faible.
      */

      this.step(
        "Vérification finale",
        12
      );

      finalResult=
        this.finalizeResult(
          finalResult,
          info,
          allResults,
          graph
        );

      this.remember(
        question,
        finalResult
      );

      return{
        ...finalResult,
        queryInfo:info,
        stats:{
          queries:queries.length,
          results:allResults.length,
          entities:fullEntities.length,
          facts:facts.length,
          graphNodes:graph.nodes.size,
          graphEdges:graph.edges.length
        }
      };

    }finally{

      this.busy=false;
      this.abortController=null;
    }
  }

  uniqueResults(results){

    const map=new Map();

    for(const result of results){

      const key=
        result.sourceId+
        "|" +
        (result.pageid||result.title||"");

      if(!map.has(key)){
        map.set(key,result);
      }
    }

    return[...map.values()];
  }

  finalizeResult(
    result,
    questionInfo,
    allResults,
    graph
  ){

    if(!result){

      return{
        answerText:
          "Je n'ai pas pu construire une réponse suffisamment fiable.",
        answer:
          "Je n'ai pas pu construire une réponse suffisamment fiable.",
        evidence:[],
        confidence:.1
      };
    }

    let answer=this.cleanFinalText(
      result.answerText||
      result.answer||
      ""
    );

    if(!answer){

      answer=
        "Je n'ai pas trouvé de réponse exploitable.";
    }

    /*
      Pour les réponses issues du graphe, on conserve
      la formulation directe.
    */

    if(
      questionInfo.superlative.detected &&
      result.reasoning
    ){

      const r=result.reasoning;

      if(
        r.winner&&
        r.relation&&
        r.target
      ){

        answer=
          r.winner+
          " est l'élément retenu selon le critère demandé. "+
          "Sa relation « "+
          r.relation+
          " » mène à "+
          r.target+".";
      }
    }

    const contradictions=
      this.findContradictions(
        graph.edges
      );

    let confidence=
      Number(result.confidence||.2);

    if(contradictions.length){
      confidence-=.08;
    }

    confidence=Math.max(
      .05,
      Math.min(.97,confidence)
    );

    const evidence=
      result.evidence||
      [];

    return{
      ...result,
      answerText:answer,
      answer:answer,
      evidence,
      confidence,
      contradictions
    };
  }
}


/* =========================================================
   INTERFACE
   ========================================================= */

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const clearBtn=document.getElementById("clearBtn");
const status=document.getElementById("status");

let activeStep=null;
let currentStepNumber=0;

function scrollBottom(){

  chat.scrollTop=chat.scrollHeight;
}

function removeWelcome(){

  const welcome=document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }
}

function addUserMessage(text){

  removeWelcome();

  const message=document.createElement("div");

  message.className="message user";

  const bubble=document.createElement("div");

  bubble.className="bubble";

  bubble.textContent=text;

  message.appendChild(bubble);

  chat.appendChild(message);

  scrollBottom();
}

function showStep(text,number){

  if(activeStep){
    activeStep.remove();
    activeStep=null;
  }

  currentStepNumber=number;

  const line=document.createElement("div");

  line.className="step-line";

  line.innerHTML=
    '<span class="step-number">'+
    number+
    '</span>'+
    '<span class="step-spinner"></span>'+
    '<span>'+
    escapeForHTML(text)+
    '</span>';

  chat.appendChild(line);

  activeStep=line;

  scrollBottom();

  status.textContent="Étape "+number;
}

function removeStep(){

  if(activeStep){
    activeStep.remove();
    activeStep=null;
  }

  status.textContent="Réponse terminée";

  scrollBottom();
}

function escapeForHTML(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function addAssistantMessage(result){

  const message=document.createElement("div");

  message.className="message assistant";

  const answer=document.createElement("div");

  answer.className="answer";

  answer.textContent=result.answerText||"";

  message.appendChild(answer);

  const actions=document.createElement("div");

  actions.className="answer-actions";

  const copy=document.createElement("button");

  copy.className="copy";

  copy.textContent="Copier";

  copy.addEventListener("click",async()=>{

    try{

      await navigator.clipboard.writeText(
        result.answerText||""
      );

      copy.textContent="Copié";

      setTimeout(()=>{
        copy.textContent="Copier";
      },1200);

    }catch(error){

      const area=document.createElement("textarea");

      area.value=result.answerText||"";

      document.body.appendChild(area);

      area.select();

      document.execCommand("copy");

      area.remove();

      copy.textContent="Copié";

      setTimeout(()=>{
        copy.textContent="Copier";
      },1200);
    }
  });

  actions.appendChild(copy);

  message.appendChild(actions);

  const sourceText=
    formatSourceText(result);

  if(sourceText){

    const sources=document.createElement("div");

    sources.className="sources";

    sources.textContent=
      sourceText;

    message.appendChild(sources);
  }

  chat.appendChild(message);

  scrollBottom();
}

function formatSourceText(result){

  const names=[];

  for(const item of result.evidence||[]){

    const source=item.source;

    if(
      source&&
      !names.includes(source)
    ){
      names.push(source);
    }
  }

  if(
    result.stats&&
    result.stats.facts>0&&
    !names.includes("Wikidata")
  ){
    names.unshift("Wikidata");
  }

  return names
    .slice(0,7)
    .join(" · ");
}

async function submit(){

  const text=input.value.trim();

  if(!text)return;

  if(engine.busy)return;

  addUserMessage(text);

  input.value="";
  resizeInput();

  send.disabled=true;

  status.textContent="Recherche...";

  try{

    const result=
      await engine.run(text);

    removeStep();

    addAssistantMessage(result);

    status.textContent=
      "Terminé · "+
      Math.round(
        (result.confidence||0)*100
      )+
      "% de confiance";

  }catch(error){

    removeStep();

    const message=document.createElement("div");

    message.className="message assistant";

    const answer=document.createElement("div");

    answer.className="answer";

    answer.textContent=
      "Une erreur est survenue pendant la recherche. "+
      "Vérifie ta connexion Internet puis réessaie.";

    message.appendChild(answer);

    chat.appendChild(message);

    status.textContent="Erreur";

    console.error(error);

  }finally{

    send.disabled=false;

    input.focus();

    scrollBottom();
  }
}

function resizeInput(){

  input.style.height="auto";

  input.style.height=
    Math.min(
      input.scrollHeight,
      150
    )+"px";
}

input.addEventListener(
  "input",
  resizeInput
);

input.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      submit();
    }
  }
);

send.addEventListener(
  "click",
  submit
);

clearBtn.addEventListener(
  "click",
  ()=>{

    if(engine.busy)return;

    chat.innerHTML=
      '<div class="welcome" id="welcome">'+
      '<strong>Moteur prêt.</strong><br>'+
      'Pose une question. Le moteur recherche les sources publiques, extrait les éléments pertinents, construit des relations et tente de vérifier la réponse.'+
      '</div>';

    status.textContent="Prêt";

    engine.sessionMemory=[];

    input.focus();
  }
);


/* =========================================================
   INITIALISATION
   ========================================================= */

const engine=
  new PyramidV6(showStep);

input.focus();

</script>
