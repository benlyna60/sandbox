<!DOCTYPE html>
<html lang="fr" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>IA Mobile : Module Arabe Complet</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: monospace; padding: 15px; max-width: 600px; margin: auto; text-align: right; }
        .panel { background-color: #1a1a1a; padding: 15px; border-radius: 6px; border: 1px solid #333; margin-bottom: 15px; text-align: left; }
        button { background-color: #333; color: #fff; border: 1px solid #555; padding: 12px; cursor: pointer; width: 100%; margin-bottom: 8px; border-radius: 4px; font-weight: bold; }
        .output-box { background-color: #000; color: #00ff00; padding: 15px; border-radius: 4px; font-size: 1.4em; min-height: 50px; border: 1px solid #444; text-align: right; direction: rtl; }
        .status-line { background-color: #222; padding: 10px; border-right: 4px solid #4caf50; margin-bottom: 15px; font-size: 0.9em; }
    </style>
</head>
<body onload="initApp()">

    <h1 style="text-align: left;">IA Mobile : Arabe V2</h1>
    
    <div class="panel">
        <button onclick="selectionnerFichier()" id="btn-fichier">1. Lier fichier JSON</button>
        <button onclick="lancerEntrainement()" style="background-color: #0d47a1;">2. Lancer Apprentissage</button>
        <button onclick="arreterEntrainement()" style="background-color: #b71c1c;">3. Pause & Sauvegarder</button>
    </div>

    <div class="panel">
        <button onclick="genererTexte()" style="background-color: #1b5e20;">Générer du texte</button>
        <div id="resultat" class="output-box">En attente...</div>
    </div>
    
    <div id="status" class="status-line">Prêt à initialiser.</div>

    <script>
        let fichierHandle = null;
        let memoirePaires = {}; 
        let enCours = false;

        async function initApp() {
            const db = await ouvrirBDD();
            fichierHandle = await recupererHandleDB(db);
            if (fichierHandle) {
                await chargerDonnees();
                document.getElementById("status").innerText = "✔ Fichier chargé depuis la mémoire.";
            }
        }

        async function selectionnerFichier() {
            [fichierHandle] = await window.showOpenFilePicker();
            const db = await ouvrirBDD();
            const tx = db.transaction("handles", "readwrite");
            tx.objectStore("handles").put(fichierHandle, "arabeKey");
            await chargerDonnees();
            document.getElementById("status").innerText = "✔ Fichier lié avec succès.";
        }

        async function chargerDonnees() {
            try {
                const file = await fichierHandle.getFile();
                const text = await file.text();
                const json = JSON.parse(text);
                memoirePaires = json.memoire_paires || {};
                document.getElementById("btn-fichier").innerText = "✔ Fichier chargé (" + Object.keys(memoirePaires).length + " racines)";
            } catch (e) {
                document.getElementById("status").innerText = "Erreur de chargement du JSON.";
            }
        }

        async function lancerEntrainement() {
            if (!fichierHandle) return alert("Lie le fichier d'abord !");
            enCours = true;
            document.getElementById("status").innerText = "Apprentissage en cours...";
            
            while (enCours) {
                const url = `https://ar.wikipedia.org/w/api.php?action=query&list=random&rnnamespace=0&rnlimit=1&format=json&origin=*`;
                const res = await fetch(url).then(r => r.json());
                const title = res.query.random[0].title;
                const content = await fetch(`https://ar.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&titles=${encodeURIComponent(title)}&format=json&origin=*`).then(r => r.json());
                const texte = Object.values(content.query.pages)[0].extract || "";

                for (let i = 0; i < texte.length - 1; i++) {
                    if (!enCours) break;
                    let a = texte[i], b = texte[i+1];
                    if (!memoirePaires[a]) memoirePaires[a] = {};
                    memoirePaires[a][b] = (memoirePaires[a][b] || 0) + 1;
                }
                
                const writable = await fichierHandle.createWritable();
                await writable.write(JSON.stringify({memoire_paires: memoirePaires}));
                await writable.close();
            }
        }

        function arreterEntrainement() { enCours = false; document.getElementById("status").innerText = "En pause."; }

        function genererTexte() {
            const keys = Object.keys(memoirePaires);
            if (keys.length === 0) return document.getElementById("resultat").innerText = "Mémoire vide !";
            
            let courant = keys[Math.floor(Math.random() * keys.length)];
            let resultat = courant;
            for (let i = 0; i < 200; i++) {
                let options = memoirePaires[courant];
                if (!options) break;
                let choix = Object.keys(options)[Math.floor(Math.random() * Object.keys(options).length)];
                resultat += choix;
                courant = choix;
            }
            document.getElementById("resultat").innerText = resultat;
        }

        function ouvrirBDD() {
            return new Promise(res => {
                const req = indexedDB.open("MonAppDB", 1);
                req.onupgradeneeded = () => req.result.createObjectStore("handles");
                req.onsuccess = () => res(req.result);
            });
        }
        
        async function recupererHandleDB(db) {
            return new Promise(res => {
                const req = db.transaction("handles").objectStore("handles").get("arabeKey");
                req.onsuccess = () => res(req.result);
            });
        }
    </script>
</body>
</html>
