<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hub Central Unifié — Usine IA &amp; Modules</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

    <style>
        :root {
            --void: #08080a;
            --panel: #111114;
            --panel-alt: #17171b;
            --hair: #2a2a30;
            --hair-soft: #1e1e23;
            --text: #e8e6e1;
            --text-dim: #8a8a92;
            --text-faint: #4c4c54;
            --amber: #ffb000;
            --cyan: #00d9ff;
            --violet: #b47cff;
            --red: #ff4d6a;
            --green: #35d67c;
            --font: 'JetBrains Mono', ui-monospace, monospace;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--void);
            color: var(--text);
            font-family: var(--font);
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .mode-switcher {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--hair);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .mode-switcher h1 {
            margin: 0;
            font-size: 1.2em;
            background: linear-gradient(90deg, #fff, var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .mode-btn-group { display: flex; gap: 10px; }
        .mode-btn {
            background: var(--panel-alt);
            color: var(--text-dim);
            border: 1px solid var(--hair);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 11px;
            font-weight: bold;
        }
        .mode-btn.active {
            background: var(--cyan);
            color: #000;
            border-color: var(--cyan);
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .chat-layout {
            display: flex;
            height: calc(100vh - 110px);
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 10px;
            overflow: hidden;
        }
        #sidebar {
            width: 280px;
            background: var(--panel-alt);
            border-right: 1px solid var(--hair);
            display: flex;
            flex-direction: column;
        }
        #main-chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--void);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-input-area {
            padding: 15px;
            background: var(--panel);
            border-top: 1px solid var(--hair);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background: var(--void);
            border: 1px solid var(--hair);
            padding: 10px 14px;
            border-radius: 6px;
            color: #fff;
            font-family: var(--font);
        }
        .chat-input-area button {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn {
            background: var(--panel);
            color: var(--text-dim);
            border: 1px solid var(--hair);
            padding: 8px 14px;
            cursor: pointer;
            font-size: 11px;
            font-family: var(--font);
            border-radius: 20px;
        }
        .filter-btn.active { background: var(--panel-alt); color: #fff; border-color: var(--cyan); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--hair);
            padding: 16px;
            border-radius: 10px;
            position: relative;
        }
        .card.is-active { border-color: var(--green); box-shadow: 0 0 15px rgba(53,214,124,0.2); }
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .card-title { display: flex; align-items: center; gap: 8px; }
        .card-title h3 { margin: 0; color: #fff; font-size: 1em; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
        .status-dot.ready { background: var(--cyan); }
        .status-dot.active { background: var(--green); animation: pulse 1.2s infinite; }
        .status-dot.paused { background: var(--amber); }
        @keyframes pulse { 50% { opacity: 0.3; } }

        .badge { font-size: 9px; background: var(--panel-alt); padding: 3px 8px; border-radius: 10px; color: var(--text-dim); border: 1px solid var(--hair-soft); }
        .card-body { display: grid; grid-template-columns: 82px 1fr; gap: 14px; margin-top: 12px; align-items: center; }
        .ring {
            width: 74px; height: 74px; border-radius: 50%;
            background: conic-gradient(var(--cyan) calc(var(--pct, 0) * 1%), var(--hair-soft) 0);
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .ring::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--panel); }
        .ring-value { position: relative; font-size: 0.85em; font-weight: 700; color: #fff; z-index: 1; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .mini-stat { text-align: center; background: var(--panel-alt); border: 1px solid var(--hair-soft); border-radius: 6px; padding: 6px 2px; }
        .mini-stat .v { font-size: 0.9em; font-weight: 700; color: #fff; }
        .mini-stat .k { font-size: 8px; color: var(--text-faint); text-transform: uppercase; margin-top: 2px; }

        .chart-box { height: 85px; margin-top: 10px; background: var(--panel-alt); border: 1px solid var(--hair-soft); border-radius: 6px; padding: 6px; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        button.action-btn {
            background: var(--panel-alt); color: var(--text); border: 1px solid var(--hair);
            padding: 6px 10px; cursor: pointer; font-size: 10px; font-family: var(--font); border-radius: 6px;
        }
        button.action-btn:hover { background: #232328; border-color: var(--cyan); color: #fff; }
        button.start { color: var(--green); border-color: rgba(53,214,124,0.3); }
        button.stop { color: var(--red); border-color: rgba(255,77,106,0.3); }

        .output {
            background: #000; border: 1px solid var(--hair-soft); border-radius: 6px;
            padding: 8px; height: 50px; overflow-y: auto; font-size: 10px; margin-top: 8px; color: var(--cyan);
        }
        .output.rtl { direction: rtl; text-align: right; }

        #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(4,4,6,0.85); backdrop-filter: blur(2px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel); border: 1px solid var(--hair); width: 85%; max-width: 600px; padding: 20px; border-radius: 10px; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="mode-switcher">
        <h1>Hub Central Unifié</h1>
        <div class="mode-btn-group">
            <button class="mode-btn active" id="btn-view-modules" onclick="basculerVue('modules')">⚙️ Vue Modules (Experts)</button>
            <button class="mode-btn" id="btn-view-chat" onclick="basculerVue('chat')">💬 Interface Système & Chat</button>
        </div>
    </div>

    <div class="view-section active" id="section-modules">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filtrerModules('tous', this)">📁 Tous</button>
            <button class="filter-btn" onclick="filtrerModules('code', this)">💻 Code</button>
            <button class="filter-btn" onclick="filtrerModules('langue', this)">🌍 Langues & Poésie</button>
            <button class="filter-btn" onclick="filtrerModules('archives', this)">📚 Archives & Sciences</button>
        </div>
        <div class="grid" id="hub-container"></div>
    </div>

    <div class="view-section" id="section-chat">
        <div class="chat-layout">
            <div id="sidebar">
                <div style="padding: 15px; font-weight: bold; border-bottom: 1px solid var(--hair); font-size: 12px; color: var(--text-dim);">
                    SÉLECTIONNER UN EXPERT
                </div>
                <div id="sidebar-modules-list" style="overflow-y: auto; padding: 10px; flex: 1;"></div>
            </div>
            <div id="main-chat-content">
                <div class="chat-messages" id="chat-output">
                    <div style="color: var(--text-dim); text-align: center; margin-top: 30px; font-size: 12px;">
                        Système prêt. Posez votre question ou interrogez les bases de données connectées.
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="user-input" placeholder="Envoyer une instruction au système...">
                    <button onclick="envoyerMessageSysteme()">Envoyer</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" onclick="fermerZoom(event)">
        <div class="modal-content" id="modal-inner-content" onclick="event.stopPropagation()"></div>
    </div>

    <!-- Import de ton registre séparé -->
    <script type="module">
        import { MODULES_REGISTRY, CATEGORIES_CONFIG } from './modules.registry.js';

        window.modulesConfig = MODULES_REGISTRY;
        window.catColors = { code: '#00d9ff', langue: '#ffb000', archives: '#b47cff' };

        window.appState = {};
        window.categorieActuelle = 'tous';

        // Initialisation globale
        window.initHub = function() {
            window.modulesConfig.forEach(mod => {
                window.appState[mod.id] = { handle: null, memoire: {}, iterations: 0, enCours: false, dernierTexte: "Aucun test." };
                window.restaurerHandle(mod);
            });
            window.renderGrilleModules();
            window.renderSidebarModules();
        };

        window.basculerVue = function(vue) {
            document.getElementById('section-modules').classList.toggle('active', vue === 'modules');
            document.getElementById('section-chat').classList.toggle('active', vue === 'chat');
            document.getElementById('btn-view-modules').classList.toggle('active', vue === 'modules');
            document.getElementById('btn-view-chat').classList.toggle('active', vue === 'chat');
        };

        window.renderSidebarModules = function() {
            const list = document.getElementById('sidebar-modules-list');
            list.innerHTML = "";
            window.modulesConfig.forEach(mod => {
                const item = document.createElement('div');
                item.style.padding = '8px 10px';
                item.style.margin = '3px 0';
                item.style.borderRadius = '6px';
                item.style.cursor = 'pointer';
                item.style.fontSize = '11px';
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';
                item.style.background = 'var(--panel)';
                item.style.border = '1px solid var(--hair-soft)';
                
                const color = CATEGORIES_CONFIG[mod.cat]?.color || '#fff';
                item.innerHTML = `<span>${mod.nom}</span> <span style="font-size:8px; background:${color}; color:#000; padding:2px 5px; border-radius:4px; font-weight:bold;">${mod.cat}</span>`;
                
                item.onclick = () => {
                    document.getElementById('user-input').value = `Interroger le module ${mod.nom} : `;
                    document.getElementById('user-input').focus();
                };
                list.appendChild(item);
            });
        };

        window.renderGrilleModules = function() {
            const container = document.getElementById('hub-container');
            container.innerHTML = "";
            let filtres = window.categorieActuelle === 'tous' ? window.modulesConfig : window.modulesConfig.filter(m => m.cat === window.categorieActuelle);

            filtres.forEach(mod => {
                let rtl = mod.isRtl ? "rtl" : "";
                container.innerHTML += `
                    <div class="card" id="card-${mod.id}">
                        <div class="card-top">
                            <div class="card-title">
                                <span class="status-dot" id="dot-${mod.id}"></span>
                                <h3>${mod.nom}</h3>
                            </div>
                            <div style="display:flex; gap:6px; align-items:center;">
                                <span class="badge" id="badge-${mod.id}">0 racines</span>
                                <button class="action-btn" onclick="ouvrirZoom('${mod.id}')">🔍 Zoom</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="ring" id="ring-${mod.id}"><span class="ring-value" id="ring-value-${mod.id}">0%</span></div>
                            <div class="stats-row">
                                <div class="mini-stat"><div class="v" id="metric-txt-${mod.id}">0</div><div class="k">Connexions</div></div>
                                <div class="mini-stat"><div class="v" id="densite-${mod.id}">0</div><div class="k">Densité</div></div>
                                <div class="mini-stat"><div class="v" id="entropie-${mod.id}">0</div><div class="k">Diversité</div></div>
                            </div>
                        </div>
                        <div class="chart-box"><canvas id="chart-${mod.id}"></canvas></div>
                        <div class="btn-row">
                            <button class="action-btn" onclick="lierFichier('${mod.id}')" id="btn-file-${mod.id}">Lier</button>
                            <button class="action-btn start" onclick="lancerApprentissage('${mod.id}')">Lancer</button>
                            <button class="action-btn stop" onclick="arreterApprentissage('${mod.id}')">Pause</button>
                            <button class="action-btn" onclick="genererTexte('${mod.id}')" style="color:var(--cyan)">Générer</button>
                        </div>
                        <div class="output ${rtl}" id="out-${mod.id}">En attente...</div>
                    </div>
                `;
            });
            window.mettreAJourMetriques();
        };

        window.filtrerModules = function(cat, btn) {
            window.categorieActuelle = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            window.renderGrilleModules();
        };

        window.ouvrirBDD = function(dbName) {
            return new Promise(res => {
                const req = indexedDB.open(dbName, 1);
                req.onupgradeneeded = () => req.result.createObjectStore("handles");
                req.onsuccess = () => res(req.result);
            });
        };

        window.restaurerHandle = async function(mod) {
            const db = await window.ouvrirBDD(mod.dbName);
            const req = db.transaction("handles").objectStore("handles").get(mod.keyName);
            req.onsuccess = async () => {
                if (req.result) {
                    window.appState[mod.id].handle = req.result;
                    try {
                        const file = await req.result.getFile();
                        const text = await file.text();
                        const json = text ? JSON.parse(text) : {};
                        window.appState[mod.id].memoire = json.memoire_paires || {};
                        window.mettreAJourMetriques();
                        const btn = document.getElementById(`btn-file-${mod.id}`);
                        if(btn) btn.innerText = "✔ Lié";
                        const dot = document.getElementById(`dot-${mod.id}`);
                        if(dot) dot.className = "status-dot ready";
                    } catch(e) {}
                }
            };
        };

        window.lierFichier = async function(id) {
            const mod = window.modulesConfig.find(m => m.id === id);
            try {
                [window.appState[id].handle] = await window.showOpenFilePicker();
                const db = await window.ouvrirBDD(mod.dbName);
                db.transaction("handles", "readwrite").objectStore("handles").put(window.appState[id].handle, mod.keyName);
                const file = await window.appState[id].handle.getFile();
                const json = JSON.parse(await file.text() || "{}");
                window.appState[id].memoire = json.memoire_paires || {};
                window.mettreAJourMetriques();
                document.getElementById(`btn-file-${id}`).innerText = "✔ Lié";
                document.getElementById(`dot-${id}`).className = "status-dot ready";
            } catch(e) {}
        };

        window.mettreAJourMetriques = function() {
            window.modulesConfig.forEach(mod => {
                let state = window.appState[mod.id];
                let total = 0;
                for (let k in state.memoire) for (let sk in state.memoire[k]) total += state.memoire[k][sk];
                let racines = Object.keys(state.memoire).length;

                let badge = document.getElementById(`badge-${mod.id}`);
                if (badge) badge.innerText = `${racines} racines`;
                let ring = document.getElementById(`ring-${mod.id}`);
                if (ring) ring.style.setProperty('--pct', Math.min(100, (total/5000)*100));
                let ringVal = document.getElementById(`ring-value-${mod.id}`);
                if (ringVal) ringVal.innerText = Math.min(100, Math.round((total/5000)*100)) + '%';
                
                let mTxt = document.getElementById(`metric-txt-${mod.id}`);
                if (mTxt) mTxt.innerText = total;
                let dens = document.getElementById(`densite-${mod.id}`);
                if (dens) dens.innerText = racines > 0 ? (total/racines).toFixed(1) : 0;
            });
        };

        window.genererTexte = function(id) {
            let state = window.appState[id];
            let keys = Object.keys(state.memoire);
            if (keys.length === 0) { document.getElementById(`out-${id}`).innerText = "Mémoire vide !"; return; }
            let cur = keys[Math.floor(Math.random() * keys.length)];
            let res = cur;
            for(let i=0; i<100; i++) {
                let suiv = state.memoire[cur];
                if(!suiv) break;
                let opts = Object.entries(suiv);
                if(opts.length === 0) break;
                opts.sort((a,b)=>b[1]-a[1]);
                cur = opts[0][0];
                res += cur;
            }
            state.dernierTexte = res;
            document.getElementById(`out-${id}`).innerText = res;
        };

        window.lancerApprentissage = async function(id) {
            const mod = window.modulesConfig.find(m => m.id === id);
            let state = window.appState[id];
            if(!state.handle) { alert("Liez d'abord un fichier !"); return; }
            
            if ((await state.handle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
                if ((await state.handle.requestPermission({ mode: 'readwrite' })) !== 'granted') {
                    alert("Permission refusée pour accéder au fichier.");
                    return;
                }
            }

            state.enCours = true;
            document.getElementById(`dot-${id}`).className = "status-dot active";

            while(state.enCours) {
                try {
                    let url = `https://${mod.wikiLang}.wikipedia.org/w/api.php?action=query&list=random&rnnamespace=0&rnlimit=1&format=json&origin=*`;
                    let res = await fetch(url).then(r=>r.json());
                    let title = res.query.random[0].title;
                    let cUrl = `https://${mod.wikiLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&titles=${encodeURIComponent(title)}&format=json&origin=*`;
                    let cRes = await fetch(cUrl).then(r=>r.json());
                    let pages = cRes.query.pages;
                    let txt = pages[Object.keys(pages)[0]].extract || "";

                    for(let i=0; i<txt.length-1; i++) {
                        if(!state.enCours) break;
                        let a=txt[i], b=txt[i+1];
                        if(!state.memoire[a]) state.memoire[a]={};
                        state.memoire[a][b] = (state.memoire[a][b]||0)+1;
                    }
                    const w = await state.handle.createWritable();
                    await w.write(JSON.stringify({memoire_paires: state.memoire}, null, 2));
                    await w.close();
                    window.mettreAJourMetriques();
                } catch(e) {}
                await new Promise(r=>setTimeout(r, 4000));
            }
        };

        window.arreterApprentissage = function(id) {
            window.appState[id].enCours = false;
            document.getElementById(`dot-${id}`).className = "status-dot paused";
        };

        window.ouvrirZoom = function(id) {
            const mod = window.modulesConfig.find(m => m.id === id);
            const state = window.appState[id];
            document.getElementById('modal-inner-content').innerHTML = `
                <h2 style="color:#fff; margin-top:0;">🔍 Détails : ${mod.nom}</h2>
                <p style="font-size:11px; color:var(--text-dim);">Dernier texte généré :</p>
                <div style="background:#000; padding:10px; color:var(--cyan); font-size:11px; border-radius:6px; max-height:150px; overflow-y:auto;">${state.dernierTexte}</div>
                <button onclick="fermerZoom()" style="margin-top:15px; background:var(--panel-alt); color:#fff; border:1px solid var(--hair); padding:6px 12px; cursor:pointer;">Fermer</button>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
        };

        window.fermerZoom = function() {
            document.getElementById('modal-overlay').style.display = 'none';
        };

        window.envoyerMessageSysteme = function() {
            const input = document.getElementById('user-input');
            const output = document.getElementById('chat-output');
            if(!input.value.trim()) return;

            const uMsg = document.createElement('div');
            uMsg.style.cssText = "align-self:flex-end; background:var(--hair); padding:8px 12px; border-radius:6px; font-size:11px; max-width:70%;";
            uMsg.textContent = input.value;
            output.appendChild(uMsg);

            const q = input.value;
            input.value = "";

            setTimeout(() => {
                const sMsg = document.createElement('div');
                sMsg.style.cssText = "align-self:flex-start; background:var(--panel-alt); border:1px solid var(--hair); padding:8px 12px; border-radius:6px; font-size:11px; max-width:70%; color:var(--cyan);";
                sMsg.textContent = `Analyse système de la requête : "${q}". (Modules en arrière-plan opérationnels)`;
                output.appendChild(sMsg);
                output.scrollTop = output.scrollHeight;
            }, 400);
        };

        // Lancement au chargement
        window.initHub();
    </script>

</body>
</html>
