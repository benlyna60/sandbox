<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Usine IA - Hub Central</title>
    <style>
        /* Thème minimaliste : Noir dominant, gris foncé structurant */
        body { background-color: #050505; color: #d1d1d1; font-family: 'Segoe UI', monospace; padding: 20px; margin: 0; }
        h1 { color: #ffffff; border-bottom: 1px solid #333; padding-bottom: 10px; font-weight: 300; }
        
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }
        
        .module-card { 
            background: #121212; 
            border: 1px solid #2a2a2a; 
            padding: 20px; 
            border-radius: 4px; 
            transition: border 0.3s;
        }
        .module-card:hover { border-color: #555; }
        
        h3 { margin-top: 0; color: #888; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9em; }
        
        button { 
            background: #1a1a1a; 
            color: #ccc; 
            border: 1px solid #333; 
            padding: 10px 15px; 
            cursor: pointer; 
            width: 100%; 
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        button:hover { background: #333; color: #fff; }
        
        .status-bar { 
            height: 4px; 
            background: #222; 
            margin-top: 15px; 
            overflow: hidden; 
        }
        .progress { height: 100%; background: #444; width: 0%; transition: width 0.5s; }
    </style>
</head>
<body>

    <h1>HUB CENTRAL — USINE IA</h1>
    <div class="dashboard-grid" id="main-grid"></div>

    <script>
        const modules = [
            { id: "python", nom: "Python" },
            { id: "javascript", nom: "JavaScript" },
            { id: "cpp", nom: "C++" },
            { id: "htmlcss", nom: "HTML / CSS" },
            { id: "sql", nom: "SQL" },
            { id: "java", nom: "Java" },
            { id: "php", nom: "PHP" }
        ];

        function renderHub() {
            const grid = document.getElementById('main-grid');
            modules.forEach(mod => {
                grid.innerHTML += `
                    <div class="module-card">
                        <h3>${mod.nom}</h3>
                        <button onclick="window.open('${mod.id}_module.html', '_blank')">Accéder au Module</button>
                        <div class="status-bar">
                            <div class="progress" id="prog-${mod.id}"></div>
                        </div>
                    </div>
                `;
            });
        }

        renderHub();
    </script>
</body>
</html>
