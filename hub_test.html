<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hub Central Unifié — Usine IA &amp; Modules</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

    <style>
        :root {
            --void: #08080a;
            --panel: #111114;
            --panel-alt: #17171b;
            --hair: #2a2a30;
            --hair-soft: #1e1e23;
            --text: #e8e6e1;
            --text-dim: #8a8a92;
            --text-faint: #4c4c54;
            --amber: #ffb000;
            --cyan: #00d9ff;
            --violet: #b47cff;
            --red: #ff4d6a;
            --green: #35d67c;
            --font: 'JetBrains Mono', ui-monospace, monospace;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--void);
            color: var(--text);
            font-family: var(--font);
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .mode-switcher {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--hair);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .mode-switcher h1 {
            margin: 0;
            font-size: 1.2em;
            background: linear-gradient(90deg, #fff, var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .mode-btn-group { display: flex; gap: 10px; align-items: center; }
        .mode-btn {
            background: var(--panel-alt);
            color: var(--text-dim);
            border: 1px solid var(--hair);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 11px;
            font-weight: bold;
        }
        .mode-btn.active {
            background: var(--cyan);
            color: #000;
            border-color: var(--cyan);
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .chat-layout {
            display: flex;
            height: calc(100vh - 110px);
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 10px;
            overflow: hidden;
        }
        #sidebar {
            width: 280px;
            background: var(--panel-alt);
            border-right: 1px solid var(--hair);
            display: flex;
            flex-direction: column;
        }
        #main-chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--void);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-input-area {
            padding: 15px;
            background: var(--panel);
            border-top: 1px solid var(--hair);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background: var(--void);
            border: 1px solid var(--hair);
            padding: 10px 14px;
            border-radius: 6px;
            color: #fff;
            font-family: var(--font);
        }
        .chat-input-area button {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn {
            background: var(--panel);
            color: var(--text-dim);
            border: 1px solid var(--hair);
            padding: 8px 14px;
            cursor: pointer;
            font-size: 11px;
            font-family: var(--font);
            border-radius: 20px;
        }
        .filter-btn.active { background: var(--panel-alt); color: #fff; border-color: var(--cyan); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--hair);
            padding: 16px;
            border-radius: 10px;
            position: relative;
        }
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .card-title { display: flex; align-items: center; gap: 8px; }
        .card-title h3 { margin: 0; color: #fff; font-size: 1em; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
        .status-dot.ready { background: var(--cyan); }

        .badge { font-size: 9px; background: var(--panel-alt); padding: 3px 8px; border-radius: 10px; color: var(--text-dim); border: 1px solid var(--hair-soft); }
        .card-body { display: grid; grid-template-columns: 82px 1fr; gap: 14px; margin-top: 12px; align-items: center; }
        
        .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        button.action-btn {
            background: var(--panel-alt); color: var(--text); border: 1px solid var(--hair);
            padding: 6px 10px; cursor: pointer; font-size: 10px; font-family: var(--font); border-radius: 6px;
        }
        
        .output {
            background: #000; border: 1px solid var(--hair-soft); border-radius: 6px;
            padding: 8px; height: 50px; overflow-y: auto; font-size: 10px; margin-top: 8px; color: var(--cyan);
        }
    </style>
</head>
<body>

    <div class="mode-switcher">
        <h1>Hub Central Unifié</h1>
        <div class="mode-btn-group">
            <button class="mode-btn" id="btn-dossier">📂 Dossier JSON</button>
            <button class="mode-btn active" id="btn-view-modules">⚙️ Vue Modules</button>
            <button class="mode-btn" id="btn-view-chat">💬 Chat Système</button>
        </div>
    </div>

    <div class="view-section active" id="section-modules">
        <div class="filter-bar">
            <button class="filter-btn active" data-cat="tous">📁 Tous</button>
            <button class="filter-btn" data-cat="code">💻 Code</button>
            <button class="filter-btn" data-cat="langue">🌍 Langues</button>
            <button class="filter-btn" data-cat="archives">📚 Archives</button>
        </div>
        <div class="grid" id="hub-container"></div>
    </div>

    <div class="view-section" id="section-chat">
        <div class="chat-layout">
            <div id="sidebar">
                <div style="padding: 15px; font-weight: bold; font-size: 12px; color: var(--text-dim);">SÉLECTIONNER UN EXPERT</div>
                <div id="sidebar-modules-list" style="overflow-y: auto; padding: 10px; flex: 1;"></div>
            </div>
            <div id="main-chat-content">
                <div class="chat-messages" id="chat-output"></div>
                <div class="chat-input-area">
                    <input type="text" id="user-input" placeholder="Envoyer une instruction...">
                    <button id="btn-envoyer">Envoyer</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { HubCentral } from './Js/hub.js';
        import { Expert } from './Js/expert.js';
        import { MODULES_REGISTRY, CATEGORIES_CONFIG } from './Js/modules.registry.js';

        const hub = new HubCentral();
        window.appState = {};
        window.categorieActuelle = 'tous';

        function initHub() {
            MODULES_REGISTRY.forEach(modData => {
                const expert = new Expert(
                    modData.id, 
                    modData.nom, 
                    `Expert ${modData.nom}`, 
                    modData.cat, 
                    modData.wikiLang, 
                    modData.isRtl
                );
                hub.ajouterExpert(expert);
                window.appState[modData.id] = expert;
            });
            renderGrilleModules();
            renderSidebarModules();
        }

        function renderSidebarModules() {
            const list = document.getElementById('sidebar-modules-list');
            list.innerHTML = "";
            hub.experts.forEach(exp => {
                const item = document.createElement('div');
                item.style.cssText = "padding:8px; margin:4px 0; border-radius:6px; cursor:pointer; font-size:11px; background:var(--panel); border:1px solid var(--hair);";
                item.textContent = exp.nom;
                item.onclick = () => {
                    document.getElementById('user-input').value = `Interroger ${exp.nom} : `;
                };
                list.appendChild(item);
            });
        }

        function renderGrilleModules() {
            const container = document.getElementById('hub-container');
            container.innerHTML = "";
            
            // Logique de filtrage robuste
            const expertsAffiche = window.categorieActuelle === 'tous' 
                ? hub.experts 
                : hub.experts.filter(m => m.cat === window.categorieActuelle);

            expertsAffiche.forEach(exp => {
                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-title">
                            <span class="status-dot ready"></span>
                            <h3>${exp.nom}</h3>
                        </div>
                    </div>
                    <div class="btn-row">
                        <button class="action-btn">Lier</button>
                        <button class="action-btn">Lancer</button>
                    </div>
                    <div class="output">Système prêt...</div>
                `;
                container.appendChild(card);
            });
        }

        // Gestion des clics filtres
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                window.categorieActuelle = btn.dataset.cat;
                renderGrilleModules();
            };
        });

        document.getElementById('btn-view-modules').onclick = () => {
            document.getElementById('section-modules').classList.add('active');
            document.getElementById('section-chat').classList.remove('active');
        };
        
        document.getElementById('btn-view-chat').onclick = () => {
            document.getElementById('section-modules').classList.remove('active');
            document.getElementById('section-chat').classList.add('active');
        };

        initHub();
    </script>
</body>
</html>
