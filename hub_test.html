<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hub Central Unifié — Usine IA &amp; Modules</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

    <style>
        :root {
            --void: #08080a;
            --panel: #111114;
            --panel-alt: #17171b;
            --hair: #2a2a30;
            --hair-soft: #1e1e23;
            --text: #e8e6e1;
            --text-dim: #8a8a92;
            --text-faint: #4c4c54;
            --amber: #ffb000;
            --cyan: #00d9ff;
            --violet: #b47cff;
            --red: #ff4d6a;
            --green: #35d67c;
            --font: 'JetBrains Mono', ui-monospace, monospace;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--void);
            color: var(--text);
            font-family: var(--font);
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .mode-switcher {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--hair);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .mode-switcher h1 {
            margin: 0;
            font-size: 1.2em;
            background: linear-gradient(90deg, #fff, var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .mode-btn-group { display: flex; gap: 10px; align-items: center; }
        .mode-btn {
            background: var(--panel-alt);
            color: var(--text-dim);
            border: 1px solid var(--hair);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 11px;
            font-weight: bold;
        }
        .mode-btn.active {
            background: var(--cyan);
            color: #000;
            border-color: var(--cyan);
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .chat-layout {
            display: flex;
            height: calc(100vh - 110px);
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 10px;
            overflow: hidden;
        }
        #sidebar {
            width: 280px;
            background: var(--panel-alt);
            border-right: 1px solid var(--hair);
            display: flex;
            flex-direction: column;
        }
        #main-chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--void);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-input-area {
            padding: 15px;
            background: var(--panel);
            border-top: 1px solid var(--hair);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background: var(--void);
            border: 1px solid var(--hair);
            padding: 10px 14px;
            border-radius: 6px;
            color: #fff;
            font-family: var(--font);
        }
        .chat-input-area button {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn {
            background: var(--panel);
            color: var(--text-dim);
            border: 1px solid var(--hair);
            padding: 8px 14px;
            cursor: pointer;
            font-size: 11px;
            font-family: var(--font);
            border-radius: 20px;
        }
        .filter-btn.active { background: var(--panel-alt); color: #fff; border-color: var(--cyan); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--hair);
            padding: 16px;
            border-radius: 10px;
            position: relative;
        }
        .card.is-active { border-color: var(--green); box-shadow: 0 0 15px rgba(53,214,124,0.2); }
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .card-title { display: flex; align-items: center; gap: 8px; }
        .card-title h3 { margin: 0; color: #fff; font-size: 1em; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
        .status-dot.ready { background: var(--cyan); }
        .status-dot.active { background: var(--green); animation: pulse 1.2s infinite; }
        .status-dot.paused { background: var(--amber); }
        @keyframes pulse { 50% { opacity: 0.3; } }

        .badge { font-size: 9px; background: var(--panel-alt); padding: 3px 8px; border-radius: 10px; color: var(--text-dim); border: 1px solid var(--hair-soft); }
        .card-body { display: grid; grid-template-columns: 82px 1fr; gap: 14px; margin-top: 12px; align-items: center; }
        .ring {
            width: 74px; height: 74px; border-radius: 50%;
            background: conic-gradient(var(--cyan) calc(var(--pct, 0) * 1%), var(--hair-soft) 0);
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .ring::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--panel); }
        .ring-value { position: relative; font-size: 0.85em; font-weight: 700; color: #fff; z-index: 1; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .mini-stat { text-align: center; background: var(--panel-alt); border: 1px solid var(--hair-soft); border-radius: 6px; padding: 6px 2px; }
        .mini-stat .v { font-size: 0.9em; font-weight: 700; color: #fff; }
        .mini-stat .k { font-size: 8px; color: var(--text-faint); text-transform: uppercase; margin-top: 2px; }

        .chart-box { height: 85px; margin-top: 10px; background: var(--panel-alt); border: 1px solid var(--hair-soft); border-radius: 6px; padding: 6px; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        button.action-btn {
            background: var(--panel-alt); color: var(--text); border: 1px solid var(--hair);
            padding: 6px 10px; cursor: pointer; font-size: 10px; font-family: var(--font); border-radius: 6px;
        }
        button.action-btn:hover { background: #232328; border-color: var(--cyan); color: #fff; }
        button.start { color: var(--green); border-color: rgba(53,214,124,0.3); }
        button.stop { color: var(--red); border-color: rgba(255,77,106,0.3); }

        .output {
            background: #000; border: 1px solid var(--hair-soft); border-radius: 6px;
            padding: 8px; height: 50px; overflow-y: auto; font-size: 10px; margin-top: 8px; color: var(--cyan);
        }
        .output.rtl { direction: rtl; text-align: right; }

        #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(4,4,6,0.85); backdrop-filter: blur(2px); z-index: 1000; justify-content: center; align-items: center; pointer-events: none; }
        #modal-overlay.active { display: flex; pointer-events: auto; }
        .modal-content { background: var(--panel); border: 1px solid var(--hair); width: 85%; max-width: 600px; padding: 20px; border-radius: 10px; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="mode-switcher">
        <h1>Hub Central Unifié</h1>
        <div class="mode-btn-group">
            <button class="mode-btn" onclick="selectionnerDossierRacine()" style="border-color: var(--cyan); color: var(--cyan);">📂 Dossier JSON</button>
            <button class="mode-btn active" id="btn-view-modules" onclick="basculerVue('modules')">⚙️ Vue Modules</button>
            <button class="mode-btn" id="btn-view-chat" onclick="basculerVue('chat')">💬 Chat Système</button>
        </div>
    </div>

    <div class="view-section active" id="section-modules">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filtrerModules('tous', this)">📁 Tous</button>
            <button class="filter-btn" onclick="filtrerModules('code', this)">💻 Code</button>
            <button class="filter-btn" onclick="filtrerModules('langue', this)">🌍 Langues</button>
            <button class="filter-btn" onclick="filtrerModules('archives', this)">📚 Archives</button>
        </div>
        <div class="grid" id="hub-container"></div>
    </div>

    <div class="view-section" id="section-chat">
        <div class="chat-layout">
            <div id="sidebar">
                <div style="padding: 15px; font-weight: bold; border-bottom: 1px solid var(--hair); font-size: 12px; color: var(--text-dim);">
                    SÉLECTIONNER UN EXPERT
                </div>
                <div id="sidebar-modules-list" style="overflow-y: auto; padding: 10px; flex: 1;"></div>
            </div>
            <div id="main-chat-content">
                <div class="chat-messages" id="chat-output">
                    <div style="color: var(--text-dim); text-align: center; margin-top: 30px; font-size: 12px;">
                        Système prêt. Posez votre question ou interrogez les modules connectés.
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="user-input" placeholder="Envoyer une instruction au système...">
                    <button onclick="envoyerMessageSysteme()">Envoyer</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" onclick="fermerZoom(event)">
        <div class="modal-content" id="modal-inner-content" onclick="event.stopPropagation()"></div>
    </div>

    <script type="module">
        import { HubCentral } from './hub.js';
        import { Expert } from './expert.js';
        import { MODULES_REGISTRY, CATEGORIES_CONFIG } from './modules.registry.js';

        const hub = new HubCentral();
        window.appState = {};
        window.categorieActuelle = 'tous';
        let dossierRacineHandle = null;

        window.initHub = function() {
            MODULES_REGISTRY.forEach(modData => {
                const expert = new Expert(modData.id, modData.nom, modData.domaine, modData.cat, modData.wikiLang, modData.isRtl);
                hub.ajouterExpert(expert);
                window.appState[modData.id] = expert;
            });
            window.renderGrilleModules();
            window.renderSidebarModules();
        };

        window.selectionnerDossierRacine = async function() {
            try {
                dossierRacineHandle = await window.showDirectoryPicker();
                alert("Dossier des experts sélectionné avec succès !");

                for (const [id, exp] of Object.entries(window.appState)) {
                    const nomFichier = `${id}-memoire.json`;
                    const fichierHandle = await dossierRacineHandle.getFileHandle(nomFichier, { create: true });
                    exp.handle = fichierHandle;
                    
                    const file = await fichierHandle.getFile();
                    const text = await file.text();
                    if (text) {
                        const json = JSON.parse(text);
                        exp.poids = json.memoire_paires || {};
                        exp.mettreAJourUI();
                    }
                    const btn = document.getElementById(`btn-file-${id}`);
                    if(btn) btn.innerText = "✔ Lié";
                    const dot = document.getElementById(`dot-${id}`);
                    if(dot) dot.className = "status-dot ready";
                }
            } catch (err) {
                console.log("Sélection de dossier annulée :", err);
            }
        };

        window.basculerVue = function(vue) {
            document.getElementById('section-modules').classList.toggle('active', vue === 'modules');
            document.getElementById('section-chat').classList.toggle('active', vue === 'chat');
            document.getElementById('btn-view-modules').classList.toggle('active', vue === 'modules');
            document.getElementById('btn-view-chat').classList.toggle('active', vue === 'chat');
        };

        window.renderSidebarModules = function() {
            const list = document.getElementById('sidebar-modules-list');
            list.innerHTML = "";
            hub.experts.forEach(exp => {
                const item = document.createElement('div');
                item.style.cssText = "padding:8px 10px; margin:3px 0; border-radius:6px; cursor:pointer; font-size:11px; display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:1px solid var(--hair-soft);";
                const color = CATEGORIES_CONFIG[exp.cat]?.color || '#fff';
                item.innerHTML = `<span>${exp.nom}</span> <span style="font-size:8px; background:${color}; color:#000; padding:2px 5px; border-radius:4px; font-weight:bold;">${exp.cat}</span>`;
                
                item.onclick = () => {
                    document.getElementById('user-input').value = `Interroger le module ${exp.nom} : `;
                    document.getElementById('user-input').focus();
                };
                list.appendChild(item);
            });
        };

        window.renderGrilleModules = function() {
            const container = document.getElementById('hub-container');
            container.innerHTML = "";
            let filtres = window.categorieActuelle === 'tous' ? hub.experts : hub.experts.filter(m => m.cat === window.categorieActuelle);

            filtres.forEach(exp => {
                let rtl = exp.isRtl ? "rtl" : "";
                container.innerHTML += `
                    <div class="card" id="card-${exp.id}">
                        <div class="card-top">
                            <div class="card-title">
                                <span class="status-dot" id="dot-${exp.id}"></span>
                                <h3>${exp.nom}</h3>
                            </div>
                            <div style="display:flex; gap:6px; align-items:center;">
                                <span class="badge" id="badge-${exp.id}">0 racines</span>
                                <button class="action-btn" onclick="ouvrirZoom('${exp.id}')">🔍 Zoom</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="ring" id="ring-${exp.id}"><span class="ring-value" id="ring-value-${exp.id}">0%</span></div>
                            <div class="stats-row">
                                <div class="mini-stat"><div class="v" id="metric-txt-${exp.id}">0</div><div class="k">Connexions</div></div>
                                <div class="mini-stat"><div class="v" id="densite-${exp.id}">0</div><div class="k">Densité</div></div>
                                <div class="mini-stat"><div class="v" id="entropie-${exp.id}">0</div><div class="k">Diversité</div></div>
                            </div>
                        </div>
                        <div class="chart-box"><canvas id="chart-${exp.id}"></canvas></div>
                        <div class="btn-row">
                            <button class="action-btn" onclick="appState['${exp.id}'].lierFichier ? appState['${exp.id}'].lierFichier() : appState['${exp.id}'].lierFichierUnique()" id="btn-file-${exp.id}">Lier</button>
                            <button class="action-btn start" onclick="appState['${exp.id}'].lancerApprentissage()">Lancer</button>
                            <button class="action-btn stop" onclick="appState['${exp.id}'].arreterApprentissage()">Pause</button>
                            <button class="action-btn" onclick="appState['${exp.id}'].genererTexte()" style="color:var(--cyan)">Générer</button>
                        </div>
                        <div class="output ${rtl}" id="out-${exp.id}">En attente...</div>
                    </div>
                `;
                exp.mettreAJourUI();
            });
        };

        window.filtrerModules = function(cat, btn) {
            window.categorieActuelle = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            window.renderGrilleModules();
        };

        window.ouvrirZoom = function(id) {
            const exp = window.appState[id];
            document.getElementById('modal-inner-content').innerHTML = `
                <h2 style="color:#fff; margin-top:0;">🔍 Détails : ${exp.nom}</h2>
                <p style="font-size:11px; color:var(--text-dim);">Dernier texte généré :</p>
                <div style="background:#000; padding:10px; color:var(--cyan); font-size:11px; border-radius:6px; max-height:150px; overflow-y:auto;">${exp.dernierTexte}</div>
                <button onclick="fermerZoom()" style="margin-top:15px; background:var(--panel-alt); color:#fff; border:1px solid var(--hair); padding:6px 12px; cursor:pointer;">Fermer</button>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        };

        window.fermerZoom = function() {
            document.getElementById('modal-overlay').classList.remove('active');
        };

        const userInput = document.getElementById('user-input');
        userInput.addEventListener('input', () => {
            if (userInput.value.length > 0) {
                hub.interrompreVeille();
            } else {
                hub.reprendreVeille();
            }
        });

        window.envoyerMessageSysteme = function() {
            const input = document.getElementById('user-input');
            const output = document.getElementById('chat-output');
            if(!input.value.trim()) return;

            const uMsg = document.createElement('div');
            uMsg.style.cssText = "align-self:flex-end; background:var(--hair); padding:8px 12px; border-radius:6px; font-size:11px; max-width:70%;";
            uMsg.textContent = input.value;
            output.appendChild(uMsg);

            const q = input.value;
            input.value = "";
            hub.reprendreVeille();

            setTimeout(() => {
                const reponseHub = hub.processerRequete(q);
                const sMsg = document.createElement('div');
                sMsg.style.cssText = "align-self:flex-start; background:var(--panel-alt); border:1px solid var(--hair); padding:8px 12px; border-radius:6px; font-size:11px; max-width:70%; color:var(--cyan); white-space: pre-line;";
                sMsg.textContent = reponseHub;
                output.appendChild(sMsg);
                output.scrollTop = output.scrollHeight;
            }, 400);
        };

        window.initHub();
    </script>
</body>
</html>
