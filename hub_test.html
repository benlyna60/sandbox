<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hub Usine IA - Grand Maître</title>
    <style>
        body { font-family: monospace; background-color: #0d0d0d; color: #00ff66; padding: 20px; max-width: 1400px; margin: 0 auto; }
        h1 { color: #fff; border-bottom: 2px solid #00ff66; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .card { border: 1px solid #333; background: #181818; padding: 12px; border-radius: 6px; }
        button { background: #333; color: #fff; border: none; padding: 5px 8px; cursor: pointer; font-size: 10px; margin: 2px; }
        .output { background: #000; padding: 5px; height: 60px; overflow-y: auto; font-size: 9px; color: #888; border: 1px solid #222; }
    </style>
</head>
<body>
    <h1>🌐 Hub Central : Usine IA Complète</h1>
    <div class="grid" id="modules-container"></div>

<script>
    const modulesConfig = [
        { id: "francais", nom: "Français", apiLang: "fr" },
        { id: "arabe", nom: "Arabe", apiLang: "ar" },
        { id: "python", nom: "Python", apiLang: "en" },
        { id: "javascript", nom: "JavaScript", apiLang: "en" },
        { id: "cpp", nom: "C++", apiLang: "en" },
        { id: "htmlcss", nom: "HTML/CSS", apiLang: "en" },
        { id: "sql", nom: "SQL", apiLang: "en" },
        { id: "java", nom: "Java", apiLang: "en" },
        { id: "php", nom: "PHP", apiLang: "en" }
    ];

    const container = document.getElementById('modules-container');
    modulesConfig.forEach(mod => {
        container.innerHTML += `
            <div class="card">
                <h3>${mod.nom}</h3>
                <button onclick="alert('Lier JSON pour ${mod.id}')">Lier</button>
                <button onclick="alert('Lancer ${mod.id}')">Lancer</button>
                <div class="output" id="output-${mod.id}">Prêt...</div>
            </div>
        `;
    });
</script>
</body>
</html>
