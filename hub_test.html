<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub IA - Interface</title>
    <style>
        /* --- Styles de base (Design minimaliste sombre) --- */
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --panel-alt: #2b3847;
            --text: #c5c6c7;
            --text-dim: #8892b0;
            --cyan: #00d9ff;
            --orange: #ffb000;
            --purple: #b47cff;
            --hair: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--hair);
            padding-bottom: 15px;
        }

        /* Boutons de navigation et filtres */
        .btn-group, .filters-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--hair);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        button:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        button.active {
            background: var(--cyan);
            color: #000;
            font-weight: bold;
        }

        /* Layout Principal */
        .main-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        /* Sidebar */
        aside {
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 8px;
            padding: 15px;
            height: fit-content;
        }

        /* Grille des modules */
        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        /* Carte d'un module */
        .card {
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title h3 {
            margin: 0;
            font-size: 14px;
            color: #fff;
        }

        /* Indicateur d'état (Point lumineux) */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            display: inline-block;
        }
        .status-dot.ready { background: #00ff66; }
        .status-dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
        .status-dot.paused { background: var(--orange); }

        .badge {
            font-size: 10px;
            background: var(--hair);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-dim);
        }

        /* Statistiques de la carte */
        .stats-row {
            display: flex;
            justify-content: space-between;
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }

        .mini-stat .v { font-weight: bold; color: #fff; font-size: 12px; }
        .mini-stat .k { font-size: 9px; color: var(--text-dim); }

        /* Ligne de boutons d'action */
        .btn-row {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            text-align: center;
        }

        .output {
            background: #000;
            padding: 8px;
            font-size: 10px;
            color: var(--cyan);
            border-radius: 4px;
            min-height: 25px;
        }
        .output.rtl { direction: rtl; text-align: right; }

        /* Vues (Modules vs Chat) */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Fenêtre Modale (Zoom) */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #modal-content {
            background: var(--panel);
            border: 1px solid var(--hair);
            padding: 20px;
            border-radius: 8px;
            width: 400px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Hub IA Central</h2>
        <div class="btn-group">
            <button id="btn-view-modules" class="active">Modules</button>
            <button id="btn-view-chat">Chat Global</button>
        </div>
    </header>

    <!-- SECTION MODULES -->
    <div id="section-modules" class="view-section active">
        <!-- Filtres par catégorie -->
        <div class="filters-group" style="margin-bottom: 15px;">
            <button class="filter-btn active" data-cat="tous">Tous</button>
            <button class="filter-btn" data-cat="code">Code</button>
            <button class="filter-btn" data-cat="langue">Langue & Poésie</button>
            <button class="filter-btn" data-cat="archives">Archives & Sciences</button>
        </div>

        <div class="main-layout">
            <!-- Sidebar listant les modules rapidement -->
            <aside>
                <h4 style="margin-top:0; font-size:12px; color:var(--text-dim);">Accès Rapide</h4>
                <div id="sidebar-modules-list"></div>
            </aside>

            <!-- Grille dynamique générée par JavaScript -->
            <div class="hub-grid" id="hub-container"></div>
        </div>
    </div>

    <!-- SECTION CHAT -->
    <div id="section-chat" class="view-section">
        <div style="background:var(--panel); border:1px solid var(--hair); border-radius:8px; padding:20px; max-width:800px; margin:0 auto; display:flex; flex-direction:column; height:400px;">
            <div id="chat-output" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:15px; padding-right:5px;"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="user-input" placeholder="Posez une question au Hub..." style="flex:1; background:var(--bg); border:1px solid var(--hair); color:#fff; padding:10px; border-radius:6px; outline:none;">
                <button id="btn-envoyer">Envoyer</button>
            </div>
        </div>
    </div>

    <!-- MODALE ZOOM -->
    <div id="modal-overlay">
        <div id="modal-content">
            <div id="modal-inner-content"></div>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL (LOGIQUE JS) -->
    <script type="module">
        import { HubCentral } from './Js/hub.js';
        import { Expert } from './Js/expert.js';
        import { MODULES_REGISTRY, CATEGORIES_CONFIG } from './Js/modules.registry.js';

        const hub = new HubCentral();
        window.appState = {};
        window.categorieActuelle = 'tous';

        // 1. Initialisation du Hub : On crée les experts à partir du registre
        function initHub() {
            MODULES_REGISTRY.forEach(modData => {
                const expert = new Expert(
                    modData.id, 
                    modData.nom, 
                    `Domaine : ${modData.nom} (${modData.cat})`, 
                    modData.cat, 
                    modData.wikiLang, 
                    modData.isRtl || false
                );
                hub.ajouterExpert(expert);
                window.appState[modData.id] = expert;
            });

            renderGrilleModules();
            renderSidebarModules();
        }

        // 2. Basculer entre la vue Modules et la vue Chat
        function basculerVue(vue) {
            document.getElementById('section-modules').classList.toggle('active', vue === 'modules');
            document.getElementById('section-chat').classList.toggle('active', vue === 'chat');
            document.getElementById('btn-view-modules').classList.toggle('active', vue === 'modules');
            document.getElementById('btn-view-chat').classList.toggle('active', vue === 'chat');
        }

        // 3. Remplir la barre latérale
        function renderSidebarModules() {
            const list = document.getElementById('sidebar-modules-list');
            list.innerHTML = "";
            hub.experts.forEach(exp => {
                const item = document.createElement('div');
                item.style.cssText = "padding:8px 10px; margin:3px 0; border-radius:6px; cursor:pointer; font-size:11px; display:flex; justify-content:space-between; align-items:center; background:var(--bg); border:1px solid var(--hair);";
                const color = CATEGORIES_CONFIG[exp.cat]?.color || '#00d9ff';
                item.innerHTML = `<span>${exp.nom}</span> <span style="font-size:8px; background:${color}; color:#000; padding:2px 5px; border-radius:4px; font-weight:bold;">${exp.cat}</span>`;
                
                item.onclick = () => {
                    document.getElementById('user-input').value = `Interroger le module ${exp.nom} : `;
                    document.getElementById('user-input').focus();
                    basculerVue('chat');
                };
                list.appendChild(item);
            });
        }

        // 4. Générer dynamiquement la grille des cartes sur l'écran
        function renderGrilleModules() {
            const container = document.getElementById('hub-container');
            container.innerHTML = "";
            
            let filtres = (window.categorieActuelle === 'tous' || !window.categorieActuelle) 
                ? hub.experts 
                : hub.experts.filter(m => m.cat === window.categorieActuelle);

            filtres.forEach(exp => {
                let rtl = exp.isRtl ? "rtl" : "";
                const card = document.createElement('div');
                card.className = "card";
                card.id = `card-${exp.id}`;
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-title">
                            <span class="status-dot" id="dot-${exp.id}"></span>
                            <h3>${exp.nom}</h3>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <span class="badge" id="badge-${exp.id}">0 racines</span>
                            <button class="action-btn btn-zoom" data-id="${exp.id}">🔍 Zoom</button>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="mini-stat"><div class="v" id="metric-txt-${exp.id}">0</div><div class="k">Connexions</div></div>
                        <div class="mini-stat"><div class="v" id="densite-${exp.id}">0</div><div class="k">Densité</div></div>
                        <div class="mini-stat"><div class="v" id="entropie-${exp.id}">0</div><div class="k">Diversité</div></div>
                    </div>
                    <div class="btn-row">
                        <button class="action-btn btn-lier" id="btn-file-${exp.id}">Lier Fichier</button>
                        <button class="action-btn btn-lancer">Lancer</button>
                        <button class="action-btn btn-pause">Pause</button>
                        <button class="action-btn btn-generer" style="color:var(--cyan)">Générer</button>
                    </div>
                    <div class="output ${rtl}" id="out-${exp.id}">En attente...</div>
                `;
                container.appendChild(card);

                // --- Attachement des actions sur les boutons de cette carte ---
                card.querySelector('.btn-zoom').onclick = () => ouvrirZoom(exp.id);
                
                // Liaison individuelle d'un fichier JSON précis peu importe son nom
                card.querySelector('.btn-lier').onclick = async () => {
                    try {
                        const [fileHandle] = await window.showOpenFilePicker({
                            types: [{
                                description: 'Fichiers JSON de mémoire',
                                accept: { 'application/json': ['.json'] }
                            }],
                            multiple: false
                        });

                        if (fileHandle) {
                            exp.handle = fileHandle;
                            const file = await fileHandle.getFile();
                            const text = await file.text();
                            
                            if (text) {
                                const json = JSON.parse(text);
                                exp.poids = json.memoire_paires || json; // S'adapte si la structure change
                            }

                            card.querySelector('.btn-lier').innerText = "✔ Lié";
                            document.getElementById(`dot-${exp.id}`).className = "status-dot ready";
                            
                            if (typeof exp.mettreAJourUI === 'function') {
                                exp.mettreAJourUI();
                            }
                            alert(`Module ${exp.nom} lié avec succès au fichier : ${file.name}`);
                        }
                    } catch (err) {
                        console.log("Sélection de fichier annulée :", err);
                    }
                };

                card.querySelector('.btn-lancer').onclick = () => {
                    if (typeof exp.lancerApprentissage === 'function') exp.lancerApprentissage();
                    document.getElementById(`dot-${exp.id}`).className = "status-dot active";
                };

                card.querySelector('.btn-pause').onclick = () => {
                    if (typeof exp.arreterApprentissage === 'function') exp.arreterApprentissage();
                    document.getElementById(`dot-${exp.id}`).className = "status-dot paused";
                };

                card.querySelector('.btn-generer').onclick = () => {
                    if (typeof exp.genererTexte === 'function') exp.genererTexte();
                };
            });
        }

        // 5. Gestion des filtres par catégorie
        function filtrerModules(cat, btn) {
            window.categorieActuelle = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrilleModules();
        }

        // 6. Fenêtre de Zoom (Détails)
        function ouvrirZoom(id) {
            const exp = window.appState[id];
            const texteActuel = exp.dernierTexte || "Aucun texte généré pour le moment.";
            document.getElementById('modal-inner-content').innerHTML = `
                <h3 style="color:#fff; margin-top:0;">🔍 Détails : ${exp.nom}</h3>
                <p style="font-size:11px; color:var(--text-dim);">Dernier texte généré :</p>
                <div style="background:#000; padding:10px; color:var(--cyan); font-size:11px; border-radius:6px; max-height:150px; overflow-y:auto; white-space:pre-wrap;">${texteActuel}</div>
                <button id="btn-fermer-modal" style="margin-top:15px; width:100%;">Fermer</button>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('btn-fermer-modal').onclick = () => {
                document.getElementById('modal-overlay').style.display = 'none';
            };
        }

        // Événements globaux
        document.getElementById('btn-view-modules').onclick = () => basculerVue('modules');
        document.getElementById('btn-view-chat').onclick = () => basculerVue('chat');

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => filtrerModules(btn.dataset.cat, btn);
        });

        // Lancement initial au chargement de la page
        initHub();
    </script>
</body>
</html>
