<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hub Central Ultime — Usine IA</title>
    <style>
        body { background-color: #050505; color: #d1d1d1; font-family: monospace; padding: 20px; margin: 0; }
        h1 { color: #ffffff; border-bottom: 1px solid #333; padding-bottom: 10px; font-weight: 300; font-size: 1.4em; }

        /* Panneau de progression globale en haut */
        .global-dashboard { background: #0c0c0c; border: 1px solid #222; padding: 15px; border-radius: 4px; margin-bottom: 25px; }
        .global-stats { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: #aaa; }
        .global-track { background: #1a1a1a; border: 1px solid #333; height: 12px; border-radius: 6px; overflow: hidden; }
        .global-fill { background: linear-gradient(90deg, #00aa55, #00ff66); height: 100%; width: 0%; transition: width 0.5s ease; }

        /* Grille des modules */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .card { background: #121212; border: 1px solid #2a2a2a; padding: 15px; border-radius: 4px; position: relative; }
        .card h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #222; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; }
        
        .badge { font-size: 10px; background: #222; padding: 2px 6px; border-radius: 3px; color: #aaa; }

        button { background: #1a1a1a; color: #ccc; border: 1px solid #444; padding: 6px 8px; cursor: pointer; font-size: 10px; margin-right: 3px; margin-top: 6px; font-family: monospace; }
        button:hover { background: #333; color: #fff; }
        button.start { background: #1b5e20; color: #fff; border-color: #2e7d32; }
        button.stop { background: #b71c1c; color: #fff; border-color: #c62828; }
        button.zoom { background: #0d47a1; color: #fff; border-color: #1565c0; float: right; }

        .metrics { margin-top: 8px; font-size: 11px; color: #888; display: flex; justify-content: space-between; }
        .progress-track { background: #1a1a1a; border: 1px solid #333; height: 6px; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #1b5e20, #00ff66); height: 100%; width: 0%; transition: width 0.4s ease; }

        .output { background: #000; border: 1px solid #222; padding: 8px; height: 50px; overflow-y: auto; font-size: 10px; margin-top: 8px; color: #00ff66; word-break: break-all; white-space: pre-wrap; }
        .status { font-size: 11px; color: #ffcc00; margin-top: 4px; }

        /* Fenêtre Modale (Zoom Module Agrandit) */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #121212; border: 1px solid #444; width: 80%; max-width: 600px; padding: 25px; border-radius: 6px; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: #b71c1c; color: #fff; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body onload="initAllModules()">

    <h1>🌐 Hub Central Ultime — Usine IA</h1>

    <!-- Tableau de bord global en haut -->
    <div class="global-dashboard">
        <div class="global-stats">
            <span><strong>PROGRESSION GLOBALE DE L'USINE</strong></span>
            <span id="global-metric-txt">0 / 35,000 connexions totales</span>
        </div>
        <div class="global-track">
            <div class="global-fill" id="global-prog-fill"></div>
        </div>
    </div>

    <div class="grid" id="hub-container"></div>

    <!-- Modale pour l'affichage agrandi d'un module -->
    <div id="modal-overlay">
        <div class="modal-content" id="modal-body">
            <button class="modal-close" onclick="fermerZoom()">Fermer [X]</button>
            <div id="modal-inner-content"></div>
        </div>
    </div>

<script>
    const modulesConfig = [
        { id: "python", nom: "Python", dbName: "HubDB_Python", keyName: "pyKey", sujets: ["Python (programming language)", "Guido van Rossum", "Django (web framework)", "NumPy"] },
        { id: "javascript", nom: "JavaScript", dbName: "HubDB_JS", keyName: "jsKey", sujets: ["JavaScript", "ECMAScript", "Node.js", "DOM"] },
        { id: "cpp", nom: "C++", dbName: "HubDB_CPP", keyName: "cppKey", sujets: ["C++ (programming language)", "Standard Template Library", "Pointer (computer programming)", "Memory management"] },
        { id: "htmlcss", nom: "HTML / CSS", dbName: "HubDB_HTMLCSS", keyName: "htmlKey", sujets: ["HTML", "Cascading Style Sheets", "Web design", "Document Object Model"] },
        { id: "sql", nom: "SQL", dbName: "HubDB_SQL", keyName: "sqlKey", sujets: ["SQL", "Relational database", "Database management system", "Query language"] },
        { id: "java", nom: "Java", dbName: "HubDB_Java", keyName: "javaKey", sujets: ["Java (programming language)", "Java Virtual Machine", "Object-oriented programming"] },
        { id: "php", nom: "PHP", dbName: "HubDB_PHP", keyName: "phpKey", sujets: ["PHP", "Server-side scripting", "Web development", "Hypertext Preprocessor"] }
    ];

    const appState = {};

    function initAllModules() {
        const container = document.getElementById('hub-container');
        container.innerHTML = "";

        modulesConfig.forEach(mod => {
            appState[mod.id] = { handle: null, memoire: {}, enCours: false, totalPaires: 0, dernierTexte: "Aucun test effectué." };

            container.innerHTML += `
                <div class="card" id="card-${mod.id}">
                    <h3>
                        <span>${mod.nom}</span>
                        <div>
                            <span class="badge" id="badge-${mod.id}">0 racines</span>
                            <button class="zoom" onclick="ouvrirZoom('${mod.id}')">🔍 Agrandir</button>
                        </div>
                    </h3>
                    <div class="status" id="status-${mod.id}">Statut : Non lié</div>
                    
                    <div class="metrics">
                        <span>Volume</span>
                        <span id="metric-txt-${mod.id}">0 connexions</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="prog-${mod.id}"></div>
                    </div>

                    <div>
                        <button onclick="lierFichier('${mod.id}')" id="btn-file-${mod.id}">1. Lier</button>
                        <button class="start" onclick="lancerApprentissage('${mod.id}')">2. Lancer</button>
                        <button class="stop" onclick="arreterApprentissage('${mod.id}')">Pause</button>
                        <button onclick="genererTexteManuel('${mod.id}')" style="background:#004d40; color:#fff;">✨ Générer Texte</button>
                    </div>
                    <div class="output" id="out-${mod.id}">Clique sur "Générer Texte" pour tester...</div>
                </div>
            `;
            restaurerHandle(mod);
        });
    }

    function ouvrirBDD(dbName) {
        return new Promise(res => {
            const req = indexedDB.open(dbName, 1);
            req.onupgradeneeded = () => req.result.createObjectStore("handles");
            req.onsuccess = () => res(req.result);
        });
    }

    function calculerPaires(memoire) {
        let total = 0;
        for (let k in memoire) {
            for (let subK in memoire[k]) {
                total += memoire[k][subK];
            }
        }
        return total;
    }

    function mettreAJourToutesMetriques() {
        let globalTotal = 0;
        let globalRacines = 0;
        let maxCibleGlobal = 35000; // 5000 connexions par module en moyenne max

        modulesConfig.forEach(mod => {
            let memoire = appState[mod.id].memoire;
            let total = calculerPaires(memoire);
            let racines = Object.keys(memoire).length;
            appState[mod.id].totalPaires = total;
            globalTotal += total;
            globalRacines += racines;

            // Mise à jour carte individuelle
            let badgeEl = document.getElementById(`badge-${mod.id}`);
            let metricTxtEl = document.getElementById(`metric-txt-${mod.id}`);
            let progEl = document.getElementById(`prog-${mod.id}`);

            if (badgeEl) badgeEl.innerText = `${racines} racines`;
            if (metricTxtEl) metricTxtEl.innerText = `${total} connexions`;
            if (progEl) {
                let pourcentMod = Math.min(100, (total / 5000) * 100);
                progEl.style.width = pourcentMod + "%";
            }
        });

        // Mise à jour de la barre globale en haut
        let globalPourcent = Math.min(100, (globalTotal / maxCibleGlobal) * 100);
        document.getElementById('global-prog-fill').style.width = globalPourcent + "%";
        document.getElementById('global-metric-txt').innerText = `${globalTotal} connexions globales (${globalRacines} racines au total)`;
    }

    async function restaurerHandle(mod) {
        const db = await ouvrirBDD(mod.dbName);
        const req = db.transaction("handles").objectStore("handles").get(mod.keyName);
        req.onsuccess = async () => {
            if (req.result) {
                appState[mod.id].handle = req.result;
                try {
                    const file = await req.result.getFile();
                    const text = await file.text();
                    const json = text ? JSON.parse(text) : {};
                    appState[mod.id].memoire = json.memoire_paires || json || {};
                    
                    mettreAJourToutesMetriques();
                    document.getElementById(`status-${mod.id}`).innerText = "Prêt";
                    document.getElementById(`btn-file-${mod.id}`).innerText = "✔ Lié";
                } catch(e) {
                    document.getElementById(`status-${mod.id}`).innerText = "Erreur";
                }
            }
        };
    }

    async function lierFichier(id) {
        const mod = modulesConfig.find(m => m.id === id);
        try {
            [appState[id].handle] = await window.showOpenFilePicker();
            const db = await ouvrirBDD(mod.dbName);
            db.transaction("handles", "readwrite").objectStore("handles").put(appState[id].handle, mod.keyName);
            
            const file = await appState[id].handle.getFile();
            const text = await file.text();
            const json = text ? JSON.parse(text) : {};
            appState[id].memoire = json.memoire_paires || json || {};
            
            mettreAJourToutesMetriques();
            document.getElementById(`status-${id}`).innerText = "Prêt";
            document.getElementById(`btn-file-${mod.id}`).innerText = "✔ Lié";
        } catch (err) {
            console.error(err);
        }
    }

    function genererTexteManuel(id) {
        let memoire = appState[id].memoire;
        let keys = Object.keys(memoire);
        if (keys.length === 0) {
            document.getElementById(`out-${id}`).innerText = "Mémoire vide, lance l'apprentissage d'abord !";
            return;
        }
        let courant = keys[Math.floor(Math.random() * keys.length)];
        let aperçu = courant;
        for (let k = 0; k < 80; k++) {
            let opts = memoire[courant];
            if (!opts) break;
            let choix = Object.keys(opts)[Math.floor(Math.random() * Object.keys(opts).length)];
            aperçu += choix;
            courant = choix;
        }
        appState[id].dernierTexte = aperçu;
        document.getElementById(`out-${id}`).innerText = aperçu;
    }

    async function lancerApprentissage(id) {
        const mod = modulesConfig.find(m => m.id === id);
        if (!appState[id].handle) {
            alert("Veuillez d'abord lier un fichier JSON !");
            return;
        }
        
        appState[id].enCours = true;
        document.getElementById(`status-${id}`).innerText = "Apprentissage...";

        while (appState[id].enCours) {
            try {
                let sujet = mod.sujets[Math.floor(Math.random() * mod.sujets.length)];
                const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(sujet)}&format=json&origin=*`).then(r => r.json());
                const pages = res.query.pages;
                const texte = pages[Object.keys(pages)[0]].extract || "";

                if (texte.length > 0) {
                    let memoire = appState[id].memoire;
                    for (let i = 0; i < texte.length - 1; i++) {
                        if (!appState[id].enCours) break;
                        let a = texte[i], b = texte[i+1];
                        if (!memoire[a]) memoire[a] = {};
                        memoire[a][b] = (memoire[a][b] || 0) + 1;
                    }

                    const writable = await appState[id].handle.createWritable();
                    await writable.write(JSON.stringify({ memoire_paires: memoire }, null, 2));
                    await writable.close();

                    mettreAJourToutesMetriques();
                }
            } catch (e) {
                console.error(e);
            }
            await new Promise(r => setTimeout(r, 6000)); // Pause de 6s pour ménager le vieux processeur
        }
    }

    function arreterApprentissage(id) {
        appState[id].enCours = false;
        document.getElementById(`status-${id}`).innerText = "Pause";
    }

    // Gestion de la vue Agrandie (Zoom)
    function ouvrirZoom(id) {
        const mod = modulesConfig.find(m => m.id === id);
        const state = appState[id];
        const modal = document.getElementById('modal-overlay');
        const content = document.getElementById('modal-inner-content');

        content.innerHTML = `
            <h2 style="color:#fff; margin-top:0; border-bottom:1px solid #333; padding-bottom:10px;">🔍 Vue détaillée : ${mod.nom}</h2>
            <p style="font-size:12px; color:#aaa;">Statistiques approfondies du module d'apprentissage :</p>
            <ul style="font-size:12px; line-height: 1.6; color:#ccc;">
                <li><strong>Nombre de racines uniques (caractères de départ) :</strong> ${Object.keys(state.memoire).length}</li>
                <li><strong>Volume total de connexions synaptiques :</strong> ${state.totalPaires}</li>
                <li><strong>Sujets Wikipédia associés :</strong> ${mod.sujets.join(", ")}</li>
            </ul>
            <p style="font-size:12px; color:#aaa; margin-top:15px;"><strong>Dernier texte généré :</strong></p>
            <div style="background:#000; border:1px solid #333; padding:10px; height:100px; overflow-y:auto; color:#00ff66; font-size:11px; white-space:pre-wrap;">${state.dernierTexte}</div>
            <button onclick="genererTexteManuel('${id}'); ouvrirZoom('${id}');" style="margin-top:15px; background:#004d40; color:#fff; padding:8px 12px; cursor:pointer;">✨ Relancer une génération test ici</button>
        `;
        modal.style.display = 'flex';
    }

    function fermerZoom() {
        document.getElementById('modal-overlay').style.display = 'none';
    }
</script>

</body>
</html>
