<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hub Central - IA & Modules</title>
    <style>
        :root {
            --bg-main: #0b0b0e;
            --bg-panel: #141419;
            --border-color: #262630;
            --text-primary: #f0f0f5;
            --text-secondary: #9999aa;
            --accent-code: #00d9ff;
        }

        body {
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Menu Hamburger / Sidebar */
        #sidebar {
            width: 300px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        /* Zone Centrale / Chat & Système */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
        }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #hamburger-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-panel);
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }

        button.send-btn {
            background: var(--accent-code);
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sidebar / Menu Hamburger -->
    <div id="sidebar">
        <div style="padding: 20px; font-weight: bold; border-bottom: 1px solid var(--border-color);">
            Modules & Experts
        </div>
        <div id="modules-list" style="overflow-y: auto; padding: 10px;">
            <!-- Généré dynamiquement via le registre -->
        </div>
    </div>

    <!-- Contenu Principal -->
    <div id="main-content">
        <header>
            <button id="hamburger-btn">☰</button>
            <h2>Hub Central d'Interrogation</h2>
        </header>

        <div class="chat-container" id="chat-output">
            <div style="color: var(--text-secondary); text-align: center; margin-top: 40px;">
                Interrogez le système ou sélectionnez un module dans le menu latéral.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Posez votre question au système...">
            <button class="send-btn" id="send-trigger">Envoyer</button>
        </div>
    </div>

    <script type="module">
        import { MODULES_REGISTRY, CATEGORIES_CONFIG } from './modules.registry.js';

        // Injection dynamique des modules dans le menu hamburger
        const listContainer = document.getElementById('modules-list');
        
        MODULES_REGISTRY.forEach(mod => {
            const item = document.createElement('div');
            item.style.padding = '10px 12px';
            item.style.margin = '4px 0';
            item.style.borderRadius = '6px';
            item.style.cursor = 'pointer';
            item.style.fontSize = '14px';
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.style.alignItems = 'center';
            
            const catColor = CATEGORIES_CONFIG[mod.cat]?.color || '#fff';
            
            item.innerHTML = `<span>${mod.nom}</span> <span style="font-size: 10px; background: ${catColor}; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold;">${mod.cat}</span>`;
            
            item.addEventListener('click', () => {
                window.location.href = mod.file;
            });
            
            listContainer.appendChild(item);
        });

        // Gestion de l'interrogation système (UI de base)
        document.getElementById('send-trigger').addEventListener('click', () => {
            const input = document.getElementById('user-input');
            const output = document.getElementById('chat-output');
            
            if (!input.value.trim()) return;

            // Affichage de la question utilisateur
            const userMsg = document.createElement('div');
            userMsg.style.alignSelf = 'flex-end';
            userMsg.style.background = '#262630';
            userMsg.style.padding = '10px 15px';
            userMsg.style.borderRadius = '8px';
            userMsg.style.maxWidth = '70%';
            userMsg.textContent = input.value;
            output.appendChild(userMsg);

            const query = input.value;
            input.value = '';

            // Simulation de réponse du système
            setTimeout(() => {
                const sysMsg = document.createElement('div');
                sysMsg.style.alignSelf = 'flex-start';
                sysMsg.style.background = '#141419';
                sysMsg.style.border = '1px solid #262630';
                sysMsg.style.padding = '10px 15px';
                sysMsg.style.borderRadius = '8px';
                sysMsg.style.maxWidth = '70%';
                sysMsg.textContent = `Analyse de la requête : "${query}". (Module prêt à être branché à votre logique d'IA locale).`;
                output.appendChild(sysMsg);
                output.scrollTop = output.scrollHeight;
            }, 500);
        });
    </script>
</body>
</html>
