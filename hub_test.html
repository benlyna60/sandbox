<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub IA - Moteur & Modules (Mode P2P Direct & JSON)</title>
    <!-- Intégration de LZ-String pour raccourcir les clés de liaison P2P -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --panel-alt: #2b3847;
            --text: #c5c6c7;
            --text-dim: #8892b0;
            --cyan: #00d9ff;
            --orange: #ffb000;
            --purple: #b47cff;
            --hair: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--hair);
            padding-bottom: 15px;
        }

        .btn-group, .filters-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--hair);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        button:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        button.active {
            background: var(--cyan);
            color: #000;
            font-weight: bold;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        aside {
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 8px;
            padding: 15px;
            height: fit-content;
        }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title h3 {
            margin: 0;
            font-size: 14px;
            color: #fff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            display: inline-block;
        }
        .status-dot.ready { background: #00ff66; }
        .status-dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
        .status-dot.paused { background: var(--orange); }

        .badge {
            font-size: 10px;
            background: var(--hair);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-dim);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }

        .mini-stat .v { font-weight: bold; color: #fff; font-size: 12px; }
        .mini-stat .k { font-size: 9px; color: var(--text-dim); }

        .btn-row {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            text-align: center;
        }

        .output {
            background: #000;
            padding: 8px;
            font-size: 10px;
            color: var(--cyan);
            border-radius: 4px;
            min-height: 25px;
            white-space: pre-wrap;
            overflow-x: auto;
        }
        .output.rtl { direction: rtl; text-align: right; }

        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #modal-content {
            background: var(--panel);
            border: 1px solid var(--hair);
            padding: 20px;
            border-radius: 8px;
            width: 420px;
            box-sizing: border-box;
        }

        /* Panneau de configuration P2P intégré */
        #p2p-panel {
            background: var(--panel);
            border: 1px solid var(--cyan);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Hub IA Central - Moteur & Modules (Temps Réel P2P)</h2>
        <div class="btn-group" style="align-items: center;">
            <button id="btn-lier-fichier-local" style="background: rgba(180, 124, 255, 0.1); border-color: var(--purple); color: var(--purple);">💾 Lier & Activer Flux Continu</button>
            <button id="btn-verifier-table" style="background: rgba(0, 217, 255, 0.1); border-color: var(--cyan); color: var(--cyan);">📥 Vérifier la Table (Mobile)</button>
            <button id="btn-tout-lancer" style="background: rgba(0, 255, 102, 0.1); border-color: #00ff66; color: #00ff66;">🚀 Tout synchroniser (Mode Boost)</button>
        </div>
    </header>

    <!-- Panneau de liaison P2P direct et simplifié par Fichier JSON -->
    <div id="p2p-panel">
        <h4 style="margin:0; color:var(--cyan); font-size:13px;">🔗 Pont P2P par Fichier de Liaison (Sans long copier-coller)</h4>
        <div style="display:flex; gap:10px; align-items:center;">
            <button id="btn-generer-offre-json" style="background:var(--cyan); color:#000; font-weight:bold;">1. Générer le fichier de liaison (PC)</button>
            <span id="p2p-status-text" style="font-size:11px; color:var(--text-dim);">Statut : En attente de création...</span>
        </div>
        <div style="display:flex; gap:10px; align-items:center; margin-top:5px;">
            <input type="file" id="input-file-answer" accept=".json" style="font-size:11px; color:var(--text);">
            <span style="font-size:11px; color:var(--text-dim);">2. Glisser/Sélectionner le fichier de réponse du mobile (.json)</span>
        </div>
    </div>

    <div class="filters-group" style="margin-bottom: 15px;">
        <button class="filter-btn active" data-cat="tous">Tous</button>
        <button class="filter-btn" data-cat="non-relies" style="border-color: var(--orange); color: var(--orange);">⚠️ Non reliés</button>
        <button class="filter-btn" data-cat="communication">Communication</button>
        <button class="filter-btn" data-cat="qualite">Contrôle & Qualité</button>
        <button class="filter-btn" data-cat="code">Code</button>
        <button class="filter-btn" data-cat="langue">Langue & Poésie</button>
        <button class="filter-btn" data-cat="archives">Archives & Sciences</button>
    </div>

    <div class="main-layout">
        <aside>
            <h4 style="margin-top:0; font-size:12px; color:var(--text-dim);">Modules Actifs</h4>
            <div id="sidebar-modules-list"></div>
        </aside>

        <div class="hub-grid" id="hub-container"></div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <div id="modal-inner-content"></div>
        </div>
    </div>

    <script type="module">
        import { HubCentral } from './Js/hub.js';
        import { Expert } from './Js/expert.js';
        import { MODULES_REGISTRY, CATEGORIES_CONFIG } from './Js/modules.registry.js';

        const hub = new HubCentral();
        window.appState = {};
        window.categorieActuelle = 'tous';

        let jsonBridgeUrl = localStorage.getItem('hub_json_bridge_url') || 'https://benlyna60.github.io/sandbox/hub-state.json';
        
        let localFileHandle = null;
        let dernierMessageTraite = ""; 

        // --- GESTION WEBRTC P2P (Liaison directe via Fichiers JSON de liaison) ---
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        let dataChannel = null;

        // 1. Générer l'offre et la télécharger sous forme de fichier JSON
        document.getElementById('btn-generer-offre-json').onclick = async () => {
            try {
                dataChannel = pc.createDataChannel("hub-chat-channel");
                setupDataChannel();

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                setTimeout(() => {
                    const rawOffer = JSON.stringify(pc.localDescription);
                    const offerB64 = btoa(rawOffer);
                    const compressedOffer = LZString.compressToEncodedURIComponent(offerB64);

                    // Création d'un fichier JSON virtuel à télécharger pour le mobile
                    const blob = new Blob([JSON.stringify({ type: "p2p-offer", payload: compressedOffer }, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "liaison-pc-vers-mobile.json";
                    a.click();

                    document.getElementById('p2p-status-text').innerText = "Statut : Fichier de liaison téléchargé ! Envoyez-le sur le mobile.";
                    document.getElementById('p2p-status-text').style.color = "var(--cyan)";
                }, 1000);
            } catch (err) {
                alert("Erreur création P2P : " + err.message);
            }
        };

        // 2. Charger automatiquement le fichier de réponse JSON envoyé par le mobile
        document.getElementById('input-file-answer').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                const data = JSON.parse(text);
                
                let decompressedAnswer = data.payload;
                try {
                    const maybeJson = LZString.decompressFromEncodedURIComponent(data.payload);
                    if (maybeJson) {
                        decompressedAnswer = maybeJson;
                    }
                } catch (err) {}

                const answerDesc = JSON.parse(atob(decompressedAnswer));
                await pc.setRemoteDescription(new RTCSessionDescription(answerDesc));
                document.getElementById('p2p-status-text').innerText = "Statut : Connexion P2P établie via le fichier ! ✅";
                document.getElementById('p2p-status-text').style.color = "#00ff66";
            } catch (err) {
                alert("Erreur de lecture du fichier de réponse : " + err.message);
            }
        };

        pc.ondatachannel = (e) => {
            dataChannel = e.channel;
            setupDataChannel();
        };

        function setupDataChannel() {
            dataChannel.onopen = () => {
                document.getElementById('p2p-status-text').innerText = "Statut : Connecté en direct avec mobile.html ! ✅";
                document.getElementById('p2p-status-text').style.color = "#00ff66";
            };

            dataChannel.onmessage = async (e) => {
                const messageMobile = e.data;
                console.log("📩 Message reçu du mobile via P2P :", messageMobile);
                window.derniereQuestionRecue = messageMobile;

                // --- ANALYSE D'INTENTION & ROUTAGE VERS LE VRAI HUB ---
                const texteMin = messageMobile.toLowerCase();
                const motsTechniques = ["code", "script", "fonction", "python", "javascript", "sql", "bug", "erreur", "html", "css", "php", "java"];
                const motsConversationnels = ["bonjour", "salut", "ça va", "coucou", "hello", "comment", "pourquoi", "merci", "aide", "dis-moi"];

                const contientTechnique = motsTechniques.some(mot => texteMin.includes(mot));
                const contientConversation = motsConversationnels.some(mot => texteMin.includes(mot));

                if (contientConversation && !contientTechnique) {
                    let redacteur = hub.experts.find(exp => exp.id === 'redacteur');
                    if (redacteur) {
                        redacteur.dernierTexte = "Bonjour ! Comment puis-je vous aider aujourd'hui ?";
                    }
                }

                // Appel du véritable orchestrateur Hub Central
                let texteReponse = await hub.traiterRequete(messageMobile);

                // Envoi de la réponse dynamique vers le mobile
                if (dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(texteReponse);
                    console.log("📤 Réponse renvoyée au mobile via P2P :", texteReponse);
                }
            };
        }

        function initHub() {
            MODULES_REGISTRY.forEach(modData => {
                const expert = new Expert(
                    modData.id, 
                    modData.nom, 
                    `Domaine : ${modData.nom} (${modData.cat})`, 
                    modData.cat, 
                    modData.wikiLang, 
                    modData.isRtl || false
                );
                hub.ajouterExpert(expert);
                window.appState[modData.id] = expert;
            });

            renderGrilleModules();
            renderSidebarModules();
        }

        async function lireFichierLocalDirect() {
            if (!localFileHandle) return null;
            try {
                const file = await localFileHandle.getFile();
                const text = await file.text();
                return JSON.parse(text);
            } catch (e) {
                return null;
            }
        }

        async function ecrireFichierLocalDirect(data) {
            if (!localFileHandle) return false;
            try {
                const writable = await localFileHandle.createWritable();
                await writable.write(JSON.stringify(data, null, 2));
                await writable.close();
                return true;
            } catch (e) {
                return false;
            }
        }

        function demarrerFluxContinu() {
            if (!localFileHandle) return;

            setInterval(async () => {
                const data = await lireFichierLocalDirect();
                if (!data) return;

                const messageActuel = data.dernierMessageUser || "";
                if (messageActuel && messageActuel !== dernierMessageTraite) {
                    dernierMessageTraite = messageActuel;
                    window.derniereQuestionRecue = messageActuel;

                    let texteReponse = await hub.traiterRequete(messageActuel);

                    const nouvelleDonnee = {
                        dernierMessageUser: messageActuel,
                        dernierMessageHub: texteReponse,
                        reflexion: `Traité en temps réel par le Hub Central`
                    };

                    await ecrireFichierLocalDirect(nouvelleDonnee);
                }
            }, 200);
        }

        function renderSidebarModules() {
            const list = document.getElementById('sidebar-modules-list');
            list.innerHTML = "";
            hub.experts.forEach(exp => {
                const item = document.createElement('div');
                item.style.cssText = "padding:8px 10px; margin:3px 0; border-radius:6px; cursor:default; font-size:11px; display:flex; justify-content:space-between; align-items:center; background:var(--bg); border:1px solid var(--hair);";
                const color = CATEGORIES_CONFIG[exp.cat]?.color || '#00d9ff';
                item.innerHTML = `<span>${exp.nom}</span> <span style="font-size:8px; background:${color}; color:#000; padding:2px 5px; border-radius:4px; font-weight:bold;">${exp.cat}</span>`;
                list.appendChild(item);
            });
        }

        function renderGrilleModules() {
            const container = document.getElementById('hub-container');
            container.innerHTML = "";
            
            let filtres = [];
            if (window.categorieActuelle === 'tous' || !window.categorieActuelle) {
                filtres = hub.experts;
            } else if (window.categorieActuelle === 'non-relies') {
                filtres = hub.experts.filter(exp => Object.keys(exp.poids || {}).length === 0);
            } else {
                filtres = hub.experts.filter(m => m.cat === window.categorieActuelle);
            }

            if (filtres.length === 0 && window.categorieActuelle === 'non-relies') {
                container.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding: 30px; color: var(--text-dim); background: var(--panel); border-radius: 8px; border: 1px solid var(--hair);">✔ Excellent ! Tous les modules ont leur mémoire JSON active.</div>`;
                return;
            }

            filtres.forEach(exp => {
                let rtl = exp.isRtl ? "rtl" : "";
                const card = document.createElement('div');
                card.className = "card";
                card.id = `card-${exp.id}`;
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-title">
                            <span class="status-dot" id="dot-${exp.id}"></span>
                            <h3>${exp.nom}</h3>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <span class="badge" id="badge-${exp.id}">Prêt</span>
                            <button class="action-btn btn-zoom" data-id="${exp.id}">🔍 Zoom</button>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="mini-stat"><div class="v" id="metric-txt-${exp.id}">0</div><div class="k">Connexions</div></div>
                        <div class="mini-stat"><div class="v" id="densite-${exp.id}">0</div><div class="k">Densité</div></div>
                        <div class="mini-stat"><div class="v" id="entropie-${exp.id}">0</div><div class="k">Diversité</div></div>
                    </div>
                    <div class="btn-row">
                        <button class="action-btn btn-lier" id="btn-file-${exp.id}">📂 Charger JSON</button>
                        <button class="action-btn btn-injecter" style="color:var(--orange)">💉 Injecter</button>
                        <button class="action-btn btn-lancer">Lancer</button>
                        <button class="action-btn btn-generer" style="color:var(--cyan)">Générer</button>
                    </div>
                    <div class="output ${rtl}" id="out-${exp.id}">En attente de synchronisation JSON...</div>
                `;
                container.appendChild(card);

                setTimeout(() => {
                    const nbPoids = Object.keys(exp.poids || {}).length;
                    if (nbPoids > 0) {
                        document.getElementById(`dot-${exp.id}`).className = "status-dot ready";
                        document.getElementById(`out-${exp.id}`).innerText = `✔ Mémoire JSON active (${nbPoids} concepts).`;
                        if (typeof exp.mettreAJourUI === 'function') exp.mettreAJourUI();
                    }
                }, 50);

                card.querySelector('.btn-zoom').onclick = () => ouvrirZoom(exp.id);
                card.querySelector('.btn-injecter').onclick = () => ouvrirModalInjection(exp.id);
                
                card.querySelector('.btn-lier').onclick = async () => {
                    const urlSaisie = prompt("Entrez l'URL du fichier JSON pour le module " + exp.nom + " :", jsonBridgeUrl);
                    if (!urlSaisie) return;
                    jsonBridgeUrl = urlSaisie;
                    localStorage.setItem('hub_json_bridge_url', jsonBridgeUrl);

                    try {
                        const reponse = await fetch(jsonBridgeUrl + '?t=' + Date.now());
                        if (!reponse.ok) throw new Error("Erreur de chargement du JSON");
                        const data = await reponse.json();

                        if (data.poids) {
                            exp.poids = data.poids;
                        } else {
                            Object.keys(data).forEach(k => exp.mettreAJourPoids(k, 1));
                        }

                        const nbPoids = Object.keys(exp.poids || {}).length;
                        document.getElementById(`out-${exp.id}`).innerText = `✔ JSON chargé avec succès (${nbPoids} concepts).`;
                        document.getElementById(`dot-${exp.id}`).className = "status-dot ready";
                        card.querySelector('.btn-lier').innerText = "✔ Lié JSON";
                    } catch (err) {
                        alert("Impossible de récupérer le fichier JSON distant. Vérifiez l'URL.");
                    }
                };

                card.querySelector('.btn-lancer').onclick = async () => {
                    if (typeof exp.lancerApprentissage === 'function') exp.lancerApprentissage();
                };

                card.querySelector('.btn-generer').onclick = async () => {
                    let texteReponse = "Aucun texte généré récent.";
                    if (typeof exp.dernierTexte === 'string' && exp.dernierTexte.length > 0) {
                        texteReponse = exp.dernierTexte;
                    } else {
                        const cles = Object.keys(exp.poids || {});
                        if (cles.length > 0) {
                            texteReponse = `Analyse du module ${exp.nom} : Concepts clés [${cles.slice(0, 5).join(', ')}].`;
                        } else {
                            texteReponse = `Module ${exp.nom} opérationnel.`;
                        }
                    }

                    const jsonPayloadObj = {
                        dernierMessageUser: window.derniereQuestionRecue || "Requête mobile",
                        dernierMessageHub: texteReponse,
                        reflexion: `Module actif : ${exp.nom} (${exp.cat})`
                    };

                    if (localFileHandle) {
                        await ecrireFichierLocalDirect(jsonPayloadObj);
                        document.getElementById(`out-${exp.id}`).innerText = "✔ Réponse écrite dans hub-state.json !";
                    }
                };
            });
        }

        document.getElementById('btn-lier-fichier-local').onclick = async () => {
            try {
                [localFileHandle] = await window.showOpenFilePicker({
                    types: [{
                        description: 'Fichier JSON local',
                        accept: { 'application/json': ['.json'] }
                    }]
                });

                const data = await lireFichierLocalDirect();
                if (data) {
                    window.derniereQuestionRecue = data.dernierMessageUser || "";
                    dernierMessageTraite = window.derniereQuestionRecue || "";
                    
                    alert("✔ Flux Continu Activé !");
                    document.getElementById('btn-lier-fichier-local').innerText = "⚡ Flux Continu Actif";
                    document.getElementById('btn-lier-fichier-local').style.borderColor = "#00ff66";
                    document.getElementById('btn-lier-fichier-local').style.color = "#00ff66";

                    demarrerFluxContinu();
                }
            } catch (err) {
                console.log("Sélection annulée.");
            }
        };

        document.getElementById('btn-verifier-table').onclick = async () => {
            if (localFileHandle) {
                const data = await lireFichierLocalDirect();
                if (data) {
                    window.derniereQuestionRecue = data.dernierMessageUser || "Aucune question";
                    alert("Dernier message reçu : " + window.derniereQuestionRecue);
                }
            }
        };

        function filtrerModules(cat, btn) {
            window.categorieActuelle = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrilleModules();
        }

        function ouvrirZoom(id) {
            const exp = window.appState[id];
            const texteActuel = JSON.stringify(exp.poids, null, 2) || "Aucune mémoire chargée.";
            document.getElementById('modal-inner-content').innerHTML = `
                <h3 style="color:#fff; margin-top:0;">🔍 Mémoire active : ${exp.nom}</h3>
                <div style="background:#000; padding:10px; color:var(--cyan); font-size:11px; border-radius:6px; max-height:250px; overflow-y:auto; white-space:pre-wrap;">${texteActuel}</div>
                <button id="btn-fermer-modal" style="margin-top:15px; width:100%;">Fermer</button>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('btn-fermer-modal').onclick = () => {
                document.getElementById('modal-overlay').style.display = 'none';
            };
        }

        function ouvrirModalInjection(id) {
            const exp = window.appState[id];
            document.getElementById('modal-inner-content').innerHTML = `
                <h3 style="color:#fff; margin-top:0;">💉 Ajouter du Savoir : ${exp.nom}</h3>
                <textarea id="input-nouveau-savoir" placeholder="Entrez le texte..." style="width:100%; height:120px; background:#000; color:var(--cyan); border:1px solid var(--hair); padding:8px; border-radius:6px; font-size:11px; outline:none; box-sizing:border-box;"></textarea>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button id="btn-valider-injection" style="flex:1; background:var(--cyan); color:#000; font-weight:bold;">Injecter</button>
                    <button id="btn-annuler-injection" style="flex:1;">Annuler</button>
                </div>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('btn-annuler-injection').onclick = () => document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('btn-valider-injection').onclick = () => {
                const texteAjoute = document.getElementById('input-nouveau-savoir').value.trim();
                if (!texteAjoute) return;
                const mots = texteAjoute.toLowerCase().split(/[\s,.;!?]+/).filter(m => m.length > 2);
                mots.forEach(mot => { if (typeof exp.mettreAJourPoids === 'function') exp.mettreAJourPoids(mot, 3); });
                document.getElementById('modal-overlay').style.display = 'none';
            };
        }

        document.getElementById('btn-tout-lancer').onclick = () => {
            hub.experts.forEach(exp => {
                if (typeof exp.lancerApprentissage === 'function') exp.lancerApprentissage();
            });
        };

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => filtrerModules(btn.dataset.cat, btn);
        });

        initHub();
    </script>
</body>
</html>
