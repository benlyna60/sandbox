<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub IA - Interface</title>
    <style>
        /* --- Styles de base (Design minimaliste sombre) --- */
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --panel-alt: #2b3847;
            --text: #c5c6c7;
            --text-dim: #8892b0;
            --cyan: #00d9ff;
            --orange: #ffb000;
            --purple: #b47cff;
            --hair: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--hair);
            padding-bottom: 15px;
        }

        /* Boutons de navigation et filtres */
        .btn-group, .filters-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--hair);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        button:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        button.active {
            background: var(--cyan);
            color: #000;
            font-weight: bold;
        }

        /* Layout Principal */
        .main-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        /* Sidebar */
        aside {
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 8px;
            padding: 15px;
            height: fit-content;
        }

        /* Grille des modules */
        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        /* Carte d'un module */
        .card {
            background: var(--panel);
            border: 1px solid var(--hair);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title h3 {
            margin: 0;
            font-size: 14px;
            color: #fff;
        }

        /* Indicateur d'état (Point lumineux) */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            display: inline-block;
        }
        .status-dot.ready { background: #00ff66; }
        .status-dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
        .status-dot.paused { background: var(--orange); }

        .badge {
            font-size: 10px;
            background: var(--hair);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-dim);
        }

        /* Statistiques de la carte */
        .stats-row {
            display: flex;
            justify-content: space-between;
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }

        .mini-stat .v { font-weight: bold; color: #fff; font-size: 12px; }
        .mini-stat .k { font-size: 9px; color: var(--text-dim); }

        /* Ligne de boutons d'action */
        .btn-row {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            text-align: center;
        }

        .output {
            background: #000;
            padding: 8px;
            font-size: 10px;
            color: var(--cyan);
            border-radius: 4px;
            min-height: 25px;
        }
        .output.rtl { direction: rtl; text-align: right; }

        /* Vues (Modules vs Chat) */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Fenêtre Modale (Zoom / Injection) */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #modal-content {
            background: var(--panel);
            border: 1px solid var(--hair);
            padding: 20px;
            border-radius: 8px;
            width: 420px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Hub IA Central</h2>
        <div class="btn-group">
            <button id="btn-view-modules" class="active">Modules</button>
            <button id="btn-view-chat">Chat Global</button>
        </div>
    </header>

    <!-- SECTION MODULES -->
    <div id="section-modules" class="view-section active">
        <!-- Filtres par catégorie -->
        <div class="filters-group" style="margin-bottom: 15px;">
            <button class="filter-btn active" data-cat="tous">Tous</button>
            <button class="filter-btn" data-cat="code">Code</button>
            <button class="filter-btn" data-cat="langue">Langue & Poésie</button>
            <button class="filter-btn" data-cat="archives">Archives & Sciences</button>
        </div>

        <div class="main-layout">
            <!-- Sidebar listant les modules rapidement -->
            <aside>
                <h4 style="margin-top:0; font-size:12px; color:var(--text-dim);">Accès Rapide</h4>
                <div id="sidebar-modules-list"></div>
            </aside>

            <!-- Grille dynamique générée par JavaScript -->
            <div class="hub-grid" id="hub-container"></div>
        </div>
    </div>

    <!-- SECTION CHAT -->
    <div id="section-chat" class="view-section">
        <div style="background:var(--panel); border:1px solid var(--hair); border-radius:8px; padding:20px; max-width:800px; margin:0 auto; display:flex; flex-direction:column; height:400px;">
            <div id="chat-output" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:15px; padding-right:5px;"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="user-input" placeholder="Posez une question au Hub..." style="flex:1; background:var(--bg); border:1px solid var(--hair); color:#fff; padding:10px; border-radius:6px; outline:none;">
                <button id="btn-envoyer">Envoyer</button>
            </div>
        </div>
    </div>

    <!-- MODALE UNIVERSELLE -->
    <div id="modal-overlay">
        <div id="modal-content">
            <div id="modal-inner-content"></div>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL (LOGIQUE JS) -->
    <script type="module">
        import { HubCentral } from './Js/hub.js';
        import { Expert } from './Js/expert.js';
        import { MODULES_REGISTRY, CATEGORIES_CONFIG } from './Js/modules.registry.js';

        const hub = new HubCentral();
        window.appState = {};
        window.categorieActuelle = 'tous';

        function initHub() {
            MODULES_REGISTRY.forEach(modData => {
                const expert = new Expert(
                    modData.id, 
                    modData.nom, 
                    `Domaine : ${modData.nom} (${modData.cat})`, 
                    modData.cat, 
                    modData.wikiLang, 
                    modData.isRtl || false
                );
                hub.ajouterExpert(expert);
                window.appState[modData.id] = expert;
            });

            renderGrilleModules();
            renderSidebarModules();
        }

        function basculerVue(vue) {
            document.getElementById('section-modules').classList.toggle('active', vue === 'modules');
            document.getElementById('section-chat').classList.toggle('active', vue === 'chat');
            document.getElementById('btn-view-modules').classList.toggle('active', vue === 'modules');
            document.getElementById('btn-view-chat').classList.toggle('active', vue === 'chat');
        }

        function renderSidebarModules() {
            const list = document.getElementById('sidebar-modules-list');
            list.innerHTML = "";
            hub.experts.forEach(exp => {
                const item = document.createElement('div');
                item.style.cssText = "padding:8px 10px; margin:3px 0; border-radius:6px; cursor:pointer; font-size:11px; display:flex; justify-content:space-between; align-items:center; background:var(--bg); border:1px solid var(--hair);";
                const color = CATEGORIES_CONFIG[exp.cat]?.color || '#00d9ff';
                item.innerHTML = `<span>${exp.nom}</span> <span style="font-size:8px; background:${color}; color:#000; padding:2px 5px; border-radius:4px; font-weight:bold;">${exp.cat}</span>`;
                
                item.onclick = () => {
                    document.getElementById('user-input').value = `Interroger le module ${exp.nom} : `;
                    document.getElementById('user-input').focus();
                    basculerVue('chat');
                };
                list.appendChild(item);
            });
        }

        function renderGrilleModules() {
            const container = document.getElementById('hub-container');
            container.innerHTML = "";
            
            let filtres = (window.categorieActuelle === 'tous' || !window.categorieActuelle) 
                ? hub.experts 
                : hub.experts.filter(m => m.cat === window.categorieActuelle);

            filtres.forEach(exp => {
                let rtl = exp.isRtl ? "rtl" : "";
                const card = document.createElement('div');
                card.className = "card";
                card.id = `card-${exp.id}`;
                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-title">
                            <span class="status-dot" id="dot-${exp.id}"></span>
                            <h3>${exp.nom}</h3>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <span class="badge" id="badge-${exp.id}">Prêt</span>
                            <button class="action-btn btn-zoom" data-id="${exp.id}">🔍 Zoom</button>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="mini-stat"><div class="v" id="metric-txt-${exp.id}">0</div><div class="k">Connexions</div></div>
                        <div class="mini-stat"><div class="v" id="densite-${exp.id}">0</div><div class="k">Densité</div></div>
                        <div class="mini-stat"><div class="v" id="entropie-${exp.id}">0</div><div class="k">Diversité</div></div>
                    </div>
                    <div class="btn-row">
                        <button class="action-btn btn-lier" id="btn-file-${exp.id}">📂 Charger</button>
                        <button class="action-btn btn-injecter" style="color:var(--orange)">💉 Injecter</button>
                        <button class="action-btn btn-lancer">Lancer</button>
                        <button class="action-btn btn-generer" style="color:var(--cyan)">Générer</button>
                    </div>
                    <div class="output ${rtl}" id="out-${exp.id}">En attente de la mémoire...</div>
                `;
                container.appendChild(card);

                // Zoom sur la mémoire
                card.querySelector('.btn-zoom').onclick = () => ouvrirZoom(exp.id);

                // Option : Ajouter du savoir / Injecter de la mémoire
                card.querySelector('.btn-injecter').onclick = () => ouvrirModalInjection(exp.id);
                
                // CHARGEMENT DE LA MÉMOIRE DEPUIS LE FICHIER TEXTE
                card.querySelector('.btn-lier').onclick = async () => {
                    try {
                        const [fileHandle] = await window.showOpenFilePicker({
                            types: [{
                                description: 'Fichiers de mémoire texte',
                                accept: { 'text/plain': ['.txt', '.text'] }
                            }],
                            multiple: false
                        });

                        if (fileHandle) {
                            exp.fileHandle = fileHandle;
                            const file = await fileHandle.getFile();
                            const memoireTexte = await file.text();
                            
                            exp.texteIngere = memoireTexte;
                            if (typeof exp.chargerMemoire === 'function') {
                                exp.chargerMemoire(memoireTexte);
                            } else if (typeof exp.ingererTexte === 'function') {
                                exp.ingererTexte(memoireTexte);
                            }

                            card.querySelector('.btn-lier').innerText = "✔ Chargé";
                            document.getElementById(`dot-${exp.id}`).className = "status-dot ready";
                            document.getElementById(`out-${exp.id}`).innerText = `Mémoire restaurée (${memoireTexte.length} carac).`;
                            
                            const mots = memoireTexte.trim().split(/\s+/);
                            document.getElementById(`metric-txt-${exp.id}`).innerText = mots.length;
                            document.getElementById(`densite-${exp.id}`).innerText = (Math.min(mots.length / 100, 1)).toFixed(2);
                            document.getElementById(`entropie-${exp.id}`).innerText = "100%";
                        }
                    } catch (err) {
                        console.log("Chargement annulé :", err);
                    }
                };

                card.querySelector('.btn-lancer').onclick = async () => {
                    if (typeof exp.lancerApprentissage === 'function') exp.lancerApprentissage();
                    document.getElementById(`dot-${exp.id}`).className = "status-dot active";
                };

                card.querySelector('.btn-generer').onclick = () => {
                    if (typeof exp.genererTexte === 'function') exp.genererTexte();
                };
            });
        }

        function filtrerModules(cat, btn) {
            window.categorieActuelle = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrilleModules();
        }

        function ouvrirZoom(id) {
            const exp = window.appState[id];
            const texteActuel = exp.texteIngere || "Aucune mémoire chargée pour le moment.";
            document.getElementById('modal-inner-content').innerHTML = `
                <h3 style="color:#fff; margin-top:0;">🔍 Mémoire active : ${exp.nom}</h3>
                <p style="font-size:11px; color:var(--text-dim);">Aperçu du contenu chargé :</p>
                <div style="background:#000; padding:10px; color:var(--cyan); font-size:11px; border-radius:6px; max-height:250px; overflow-y:auto; white-space:pre-wrap;">${texteActuel}</div>
                <button id="btn-fermer-modal" style="margin-top:15px; width:100%;">Fermer</button>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('btn-fermer-modal').onclick = () => {
                document.getElementById('modal-overlay').style.display = 'none';
            };
        }

        function ouvrirModalInjection(id) {
            const exp = window.appState[id];
            document.getElementById('modal-inner-content').innerHTML = `
                <h3 style="color:#fff; margin-top:0;">💉 Ajouter du Savoir : ${exp.nom}</h3>
                <p style="font-size:11px; color:var(--text-dim);">Écrivez ou collez de nouvelles connaissances à injecter dans la mémoire de ce module :</p>
                <textarea id="input-nouveau-savoir" placeholder="Entrez le savoir à ajouter..." style="width:100%; height:120px; background:#000; color:var(--cyan); border:1px solid var(--hair); padding:8px; border-radius:6px; font-size:11px; resize:none; outline:none; box-sizing:border-box;"></textarea>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button id="btn-valider-injection" style="flex:1; background:var(--cyan); color:#000; font-weight:bold;">Injecter</button>
                    <button id="btn-annuler-injection" style="flex:1;">Annuler</button>
                </div>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';

            document.getElementById('btn-annuler-injection').onclick = () => {
                document.getElementById('modal-overlay').style.display = 'none';
            };

            document.getElementById('btn-valider-injection').onclick = async () => {
                const texteAjoute = document.getElementById('input-nouveau-savoir').value.trim();
                if (!texteAjoute) return;

                // Concaténer le savoir
                exp.texteIngere = (exp.texteIngere || "") + "\n\n[SAVOIR INJECTÉ] : " + texteAjoute;

                if (typeof exp.ingererTexte === 'function') {
                    exp.ingererTexte(exp.texteIngere);
                }

                // Sauvegarder automatiquement dans le fichier .txt lié s'il existe
                if (exp.fileHandle) {
                    try {
                        const writable = await exp.fileHandle.createWritable();
                        await writable.write(exp.texteIngere);
                        await writable.close();
                    } catch (e) {
                        console.log("Erreur d'écriture dans le fichier :", e);
                    }
                }

                // Mettre à jour l'affichage des stats
                const mots = exp.texteIngere.trim().split(/\s+/);
                document.getElementById(`metric-txt-${exp.id}`).innerText = mots.length;
                document.getElementById(`densite-${exp.id}`).innerText = (Math.min(mots.length / 100, 1)).toFixed(2);
                document.getElementById(`out-${exp.id}`).innerText = `Savoir injecté avec succès (${mots.length} mots totaux).`;

                document.getElementById('modal-overlay').style.display = 'none';
                alert(`Savoir ajouté et sauvegardé pour ${exp.nom} !`);
            };
        }

        document.getElementById('btn-view-modules').onclick = () => basculerVue('modules');
        document.getElementById('btn-view-chat').onclick = () => basculerVue('chat');

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => filtrerModules(btn.dataset.cat, btn);
        });

        initHub();

        // --- GESTION DU CHAT GLOBAL ---
        const inputChat = document.getElementById('user-input');
        const btnEnvoyer = document.getElementById('btn-envoyer');
        const chatOutput = document.getElementById('chat-output');

        function envoyerMessage() {
            const texte = inputChat.value.trim();
            if (!texte) return;

            const msgUser = document.createElement('div');
            msgUser.style.cssText = "background: var(--panel-alt); padding: 10px; border-radius: 6px; align-self: flex-end; max-width: 80%; font-size: 11px; border: 1px solid var(--hair); color: #fff;";
            msgUser.innerText = texte;
            chatOutput.appendChild(msgUser);

            inputChat.value = "";
            chatOutput.scrollTop = chatOutput.scrollHeight;

            setTimeout(() => {
                const msgHub = document.createElement('div');
                msgHub.style.cssText = "background: #000; padding: 10px; border-radius: 6px; align-self: flex-start; max-width: 80%; font-size: 11px; border: 1px solid var(--cyan); color: var(--cyan);";
                
                let reponseTexte = `Hub IA : Requête "${texte}" analysée par le système central.`;
                if (typeof hub.traiterRequete === 'function') {
                    reponseTexte = hub.traiterRequete(texte);
                }

                msgHub.innerText = reponseTexte;
                chatOutput.appendChild(msgHub);
                chatOutput.scrollTop = chatOutput.scrollHeight;
            }, 500);
        }

        btnEnvoyer.onclick = envoyerMessage;
        inputChat.onkeydown = (e) => {
            if (e.key === 'Enter') {
                envoyerMessage();
            }
        };
    </script>
</body>
</html>
