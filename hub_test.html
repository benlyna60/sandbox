<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hub Central Ultime — Usine IA & Langues</title>
    <style>
        body { background-color: #050505; color: #d1d1d1; font-family: monospace; padding: 20px; margin: 0; }
        h1 { color: #ffffff; border-bottom: 1px solid #333; padding-bottom: 10px; font-weight: 300; font-size: 1.4em; }

        /* Tableau de bord global */
        .global-dashboard { background: #0c0c0c; border: 1px solid #222; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .global-stats { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: #aaa; }
        .global-track { background: #1a1a1a; border: 1px solid #333; height: 12px; border-radius: 6px; overflow: hidden; }
        .global-fill { background: linear-gradient(90deg, #00aa55, #00ff66); height: 100%; width: 0%; transition: width 0.5s ease; }

        /* Barre de filtrage */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { background: #121212; color: #aaa; border: 1px solid #333; padding: 8px 14px; cursor: pointer; font-size: 11px; font-family: monospace; border-radius: 4px; }
        .filter-btn:hover { background: #222; color: #fff; }
        .filter-btn.active { background: #333; color: #fff; border-color: #555; font-weight: bold; }

        /* Grille des modules */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .card { background: #121212; border: 1px solid #2a2a2a; padding: 15px; border-radius: 4px; position: relative; }
        .card h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #222; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 1.1em; }
        
        .badge { font-size: 10px; background: #222; padding: 2px 6px; border-radius: 3px; color: #aaa; }

        button { background: #1a1a1a; color: #ccc; border: 1px solid #444; padding: 6px 8px; cursor: pointer; font-size: 10px; margin-right: 3px; margin-top: 6px; font-family: monospace; }
        button:hover { background: #333; color: #fff; }
        button.start { background: #1b5e20; color: #fff; border-color: #2e7d32; }
        button.stop { background: #b71c1c; color: #fff; border-color: #c62828; }
        button.zoom { background: #0d47a1; color: #fff; border-color: #1565c0; float: right; }

        .metrics { margin-top: 8px; font-size: 11px; color: #888; display: flex; justify-content: space-between; }
        .progress-track { background: #1a1a1a; border: 1px solid #333; height: 6px; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #1b5e20, #00ff66); height: 100%; width: 0%; transition: width 0.4s ease; }

        .output { background: #000; border: 1px solid #222; padding: 8px; height: 50px; overflow-y: auto; font-size: 10px; margin-top: 8px; color: #00ff66; word-break: break-all; white-space: pre-wrap; }
        .output.rtl { direction: rtl; text-align: right; font-size: 12px; }
        .status { font-size: 11px; color: #ffcc00; margin-top: 4px; }

        /* Fenêtre Modale (Zoom) */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #121212; border: 1px solid #444; width: 80%; max-width: 600px; padding: 25px; border-radius: 6px; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: #b71c1c; color: #fff; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body onload="initAllModules()">

    <h1>🌐 Hub Central Ultime — Usine IA & Langues</h1>

    <!-- Tableau de bord global -->
    <div class="global-dashboard">
        <div class="global-stats">
            <span><strong>PROGRESSION GLOBALE DE L'USINE</strong></span>
            <span id="global-metric-txt">0 connexions totales</span>
        </div>
        <div class="global-track">
            <div class="global-fill" id="global-prog-fill"></div>
        </div>
    </div>

    <!-- Barre de filtrage -->
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filtrerModules('tous', this)">📁 Tous les modules</button>
        <button class="filter-btn" onclick="filtrerModules('code', this)">💻 Langages de Code</button>
        <button class="filter-btn" onclick="filtrerModules('langue', this)">🌍 Arabe, Français & Livres</button>
        <button class="filter-btn" onclick="filtrerModules('archives', this)">📚 Archives Publiques</button>
    </div>

    <div class="grid" id="hub-container"></div>

    <!-- Modale de Zoom -->
    <div id="modal-overlay">
        <div class="modal-content" id="modal-body">
            <button class="modal-close" onclick="fermerZoom()">Fermer [X]</button>
            <div id="modal-inner-content"></div>
        </div>
    </div>

<script>
    // Configuration complète intégrant les codes, les langues et les nouvelles archives publiques
    const modulesConfig = [
        // Langages de Code
        { id: "python", nom: "Python", cat: "code", dbName: "HubDB_Python", keyName: "pyKey", type: "wiki", wikiLang: "en" },
        { id: "javascript", nom: "JavaScript", cat: "code", dbName: "HubDB_JS", keyName: "jsKey", type: "wiki", wikiLang: "en" },
        { id: "cpp", nom: "C++", cat: "code", dbName: "HubDB_CPP", keyName: "cppKey", type: "wiki", wikiLang: "en" },
        { id: "htmlcss", nom: "HTML / CSS", cat: "code", dbName: "HubDB_HTMLCSS", keyName: "htmlKey", type: "wiki", wikiLang: "en" },
        { id: "sql", nom: "SQL", cat: "code", dbName: "HubDB_SQL", keyName: "sqlKey", type: "wiki", wikiLang: "en" },
        { id: "java", nom: "Java", cat: "code", dbName: "HubDB_Java", keyName: "javaKey", type: "wiki", wikiLang: "en" },
        { id: "php", nom: "PHP", cat: "code", dbName: "HubDB_PHP", keyName: "phpKey", type: "wiki", wikiLang: "en" },
        
        // Modules Langues & Livres
        { 
            id: "arabe", 
            nom: "Arabe (V2)", 
            cat: "langue", 
            dbName: "HubDB_Arabe", 
            keyName: "arKey", 
            type: "wiki", 
            wikiLang: "ar", 
            isRtl: true 
        },
        { 
            id: "fr_en_livres", 
            nom: "Français / Anglais & Livres", 
            cat: "langue", 
            dbName: "HubDB_FrEnLivres", 
            keyName: "frEnLivresKey", 
            type: "mixte", 
            books: [
                "https://www.gutenberg.org/files/11/11-0.txt",
                "https://www.gutenberg.org/files/84/84-0.txt"
            ]
        },

        // Nouveaux Modules : Archives Publiques & Littérature Intégrée
        { 
            id: "gutenberg", 
            nom: "Project Gutenberg (Classiques)", 
            cat: "archives", 
            dbName: "HubDB_Gutenberg", 
            keyName: "gutKey", 
            type: "mixte", 
            books: [
                "https://www.gutenberg.org/files/1342/1342-0.txt", // Orgueil et Préjugés
                "https://www.gutenberg.org/files/2600/2600-0.txt", // Guerre et Paix
                "https://www.gutenberg.org/files/1661/1661-0.txt"  // Sherlock Holmes
            ]
        },
        { 
            id: "wikisource", 
            nom: "Wikisource (Patrimoine)", 
            cat: "archives", 
            dbName: "HubDB_Wikisource", 
            keyName: "wsKey", 
            type: "wikisource", 
            wikiLang: "fr", 
            wikiDomain: "wikisource.org" 
        },
        { 
            id: "philo", 
            nom: "Philosophie & Essais", 
            cat: "archives", 
            dbName: "HubDB_Philo", 
            keyName: "philoKey", 
            type: "wikisource", 
            wikiLang: "fr", 
            wikiDomain: "wikiquote.org" 
        }
    ];

    const appState = {};
    let categorieActuelle = 'tous';

    function initAllModules() {
        modulesConfig.forEach(mod => {
            appState[mod.id] = { handle: null, memoire: {}, iterations: 0, enCours: false, totalPaires: 0, dernierTexte: "Aucun test effectué." };
            restaurerHandle(mod);
        });
        renderGrille();
    }

    function renderGrille() {
        const container = document.getElementById('hub-container');
        container.innerHTML = "";

        let modulesFiltres = modulesConfig;
        if (categorieActuelle !== 'tous') {
            modulesFiltres = modulesConfig.filter(m => m.cat === categorieActuelle);
        }

        modulesFiltres.forEach(mod => {
            let rtlClass = mod.isRtl ? "rtl" : "";
            container.innerHTML += `
                <div class="card" id="card-${mod.id}">
                    <h3>
                        <span>${mod.nom}</span>
                        <div>
                            <span class="badge" id="badge-${mod.id}">0 racines</span>
                            <button class="zoom" onclick="ouvrirZoom('${mod.id}')">🔍 Agrandir</button>
                        </div>
                    </h3>
                    <div class="status" id="status-${mod.id}">Statut : Non lié</div>
                    
                    <div class="metrics">
                        <span>Volume</span>
                        <span id="metric-txt-${mod.id}">0 connexions</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="prog-${mod.id}"></div>
                    </div>

                    <div>
                        <button onclick="lierFichier('${mod.id}')" id="btn-file-${mod.id}">1. Lier Fichier</button>
                        <button class="start" onclick="lancerApprentissage('${mod.id}')">2. Lancer</button>
                        <button class="stop" onclick="arreterApprentissage('${mod.id}')">Pause</button>
                        <button onclick="genererTexteManuel('${mod.id}')" style="background:#004d40; color:#fff;">✨ Générer Texte</button>
                    </div>
                    <div class="output ${rtlClass}" id="out-${mod.id}">Clique sur "Générer Texte" pour tester...</div>
                </div>
            `;
        });
        mettreAJourToutesMetriques();
    }

    function filtrerModules(cat, btnElement) {
        categorieActuelle = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderGrille();
    }

    function ouvrirBDD(dbName) {
        return new Promise(res => {
            const req = indexedDB.open(dbName, 1);
            req.onupgradeneeded = () => req.result.createObjectStore("handles");
            req.onsuccess = () => res(req.result);
        });
    }

    function calculerPaires(memoire) {
        let total = 0;
        for (let k in memoire) {
            for (let subK in memoire[k]) {
                total += memoire[k][subK];
            }
        }
        return total;
    }

    function mettreAJourToutesMetriques() {
        let globalTotal = 0;
        let globalRacines = 0;
        let maxCibleGlobal = 100000;

        modulesConfig.forEach(mod => {
            let state = appState[mod.id];
            if (!state) return;
            let memoire = state.memoire;
            let total = calculerPaires(memoire);
            let racines = Object.keys(memoire).length;
            state.totalPaires = total;
            globalTotal += total;
            globalRacines += racines;

            let badgeEl = document.getElementById(`badge-${mod.id}`);
            let metricTxtEl = document.getElementById(`metric-txt-${mod.id}`);
            let progEl = document.getElementById(`prog-${mod.id}`);

            if (badgeEl) badgeEl.innerText = `${racines} racines`;
            if (metricTxtEl) metricTxtEl.innerText = `${total} connexions`;
            if (progEl) {
                let pourcentMod = Math.min(100, (total / 10000) * 100);
                progEl.style.width = pourcentMod + "%";
            }
        });

        let globalPourcent = Math.min(100, (globalTotal / maxCibleGlobal) * 100);
        const fillEl = document.getElementById('global-prog-fill');
        const txtEl = document.getElementById('global-metric-txt');
        if (fillEl) fillEl.style.width = globalPourcent + "%";
        if (txtEl) txtEl.innerText = `${globalTotal} connexions globales (${globalRacines} racines au total)`;
    }

    async function restaurerHandle(mod) {
        const db = await ouvrirBDD(mod.dbName);
        const req = db.transaction("handles").objectStore("handles").get(mod.keyName);
        req.onsuccess = async () => {
            if (req.result) {
                appState[mod.id].handle = req.result;
                try {
                    const file = await req.result.getFile();
                    const text = await file.text();
                    const json = text ? JSON.parse(text) : {};
                    appState[mod.id].memoire = json.memoire_paires || {};
                    appState[mod.id].iterations = json.iteration || 0;
                    
                    mettreAJourToutesMetriques();
                    let statusEl = document.getElementById(`status-${mod.id}`);
                    let btnEl = document.getElementById(`btn-file-${mod.id}`);
                    if (statusEl) statusEl.innerText = "Prêt";
                    if (btnEl) btnEl.innerText = "✔ Fichier lié";
                } catch(e) {
                    let statusEl = document.getElementById(`status-${mod.id}`);
                    if (statusEl) statusEl.innerText = "Erreur fichier";
                }
            }
        };
    }

    async function lierFichier(id) {
        const mod = modulesConfig.find(m => m.id === id);
        try {
            [appState[id].handle] = await window.showOpenFilePicker();
            const db = await ouvrirBDD(mod.dbName);
            db.transaction("handles", "readwrite").objectStore("handles").put(appState[id].handle, mod.keyName);
            
            const file = await appState[id].handle.getFile();
            const text = await file.text();
            const json = text ? JSON.parse(text) : {};
            appState[id].memoire = json.memoire_paires || {};
            appState[id].iterations = json.iteration || 0;
            
            mettreAJourToutesMetriques();
            document.getElementById(`status-${id}`).innerText = "Prêt";
            document.getElementById(`btn-file-${id}`).innerText = "✔ Fichier lié";
        } catch (err) {
            console.error(err);
        }
    }

    function genererTexteManuel(id) {
        const state = appState[id];
        let memoire = state.memoire;
        let keys = Object.keys(memoire);
        if (keys.length === 0) {
            document.getElementById(`out-${id}`).innerText = "Mémoire vide, lance l'apprentissage d'abord !";
            return;
        }
        
        let lettreCourante = keys[Math.floor(Math.random() * keys.length)];
        let texteGenere = lettreCourante;
        let dernieresLettres = [lettreCourante];

        for (let i = 0; i < 150; i++) {
            let suivantes = memoire[lettreCourante];
            if (!suivantes || Object.keys(suivantes).length === 0) {
                lettreCourante = keys[Math.floor(Math.random() * keys.length)];
            } else {
                let options = Object.entries(suivantes);
                let optionsFiltrees = options.filter(([suiv]) => {
                    let occurrencesRecentes = dernieresLettres.slice(-3).filter(l => l === suiv).length;
                    return occurrencesRecentes < 2;
                });
                if (optionsFiltrees.length === 0) optionsFiltrees = options;
                optionsFiltrees.sort((a, b) => b[1] - a[1]);
                let choixPool = optionsFiltrees.slice(0, Math.min(3, optionsFiltrees.length));
                let choixAleatoire = choixPool[Math.floor(Math.random() * choixPool.length)];
                lettreCourante = choixAleatoire[0];
            }
            texteGenere += lettreCourante;
            dernieresLettres.push(lettreCourante);
            if (dernieresLettres.length > 5) dernieresLettres.shift();
        }

        state.dernierTexte = texteGenere;
        document.getElementById(`out-${id}`).innerText = texteGenere;
    }

    async function lancerApprentissage(id) {
        const mod = modulesConfig.find(m => m.id === id);
        const state = appState[id];
        if (!state.handle) {
            alert("Veuillez d'abord lier un fichier JSON !");
            return;
        }
        
        state.enCours = true;
        document.getElementById(`status-${id}`).innerText = "Apprentissage...";

        while (state.enCours) {
            try {
                let texte = "";
                if (mod.type === "mixte") {
                    let bookUrl = mod.books[Math.floor(Math.random() * mod.books.length)];
                    let bText = await fetch(bookUrl).then(res => res.text());
                    texte = bText.substring(0, 5000);
                } else if (mod.type === "wikisource") {
                    const randomUrl = `https://${mod.wikiLang}.${mod.wikiDomain}/w/api.php?action=query&list=random&rnnamespace=0&rnlimit=1&format=json&origin=*`;
                    const res = await fetch(randomUrl).then(r => r.json());
                    const title = res.query.random[0].title;
                    
                    const contentUrl = `https://${mod.wikiLang}.${mod.wikiDomain}/w/api.php?action=query&prop=extracts&explaintext&titles=${encodeURIComponent(title)}&format=json&origin=*`;
                    const content = await fetch(contentUrl).then(r => r.json());
                    const pages = content.query.pages;
                    texte = pages[Object.keys(pages)[0]].extract || "";
                } else {
                    const randomUrl = `https://${mod.wikiLang}.wikipedia.org/w/api.php?action=query&list=random&rnnamespace=0&rnlimit=1&format=json&origin=*`;
                    const res = await fetch(randomUrl).then(r => r.json());
                    const title = res.query.random[0].title;
                    
                    const contentUrl = `https://${mod.wikiLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&titles=${encodeURIComponent(title)}&format=json&origin=*`;
                    const content = await fetch(contentUrl).then(r => r.json());
                    const pages = content.query.pages;
                    texte = pages[Object.keys(pages)[0]].extract || "";
                }

                if (texte.length > 0) {
                    for (let i = 0; i < texte.length - 1; i++) {
                        if (!state.enCours) break;
                        state.iterations++;
                        let a = texte[i], b = texte[i+1];
                        if (!state.memoire[a]) state.memoire[a] = {};
                        state.memoire[a][b] = (state.memoire[a][b] || 0) + 1;
                    }

                    const writable = await state.handle.createWritable();
                    await writable.write(JSON.stringify({ iteration: state.iterations, memoire_paires: state.memoire }, null, 2));
                    await writable.close();

                    mettreAJourToutesMetriques();
                }
            } catch (e) {
                console.error(e);
            }
            // Petite pause entre chaque requête pour laisser souffler le vieux laptop et l'API
            await new Promise(r => setTimeout(r, 4000));
        }
    }

    function arreterApprentissage(id) {
        appState[id].enCours = false;
        document.getElementById(`status-${id}`).innerText = "Pause & Sauvegardé";
    }

    function ouvrirZoom(id) {
        const mod = modulesConfig.find(m => m.id === id);
        const state = appState[id];
        const modal = document.getElementById('modal-overlay');
        const content = document.getElementById('modal-inner-content');
        let rtlClass = mod.isRtl ? "rtl" : "";

        content.innerHTML = `
            <h2 style="color:#fff; margin-top:0; border-bottom:1px solid #333; padding-bottom:10px;">🔍 Vue détaillée : ${mod.nom}</h2>
            <p style="font-size:12px; color:#aaa;">Catégorie : <strong>${mod.cat.toUpperCase()}</strong> | Itérations : <strong>${state.iterations}</strong></p>
            <ul style="font-size:12px; line-height: 1.6; color:#ccc;">
                <li><strong>Nombre de racines uniques :</strong> ${Object.keys(state.memoire).length}</li>
                <li><strong>Volume total de connexions :</strong> ${state.totalPaires}</li>
            </ul>
            <p style="font-size:12px; color:#aaa; margin-top:15px;"><strong>Dernier texte généré :</strong></p>
            <div class="${rtlClass}" style="background:#000; border:1px solid #333; padding:10px; height:100px; overflow-y:auto; color:#00ff66; font-size:11px; white-space:pre-wrap;">${state.dernierTexte}</div>
            <button onclick="genererTexteManuel('${id}'); ouvrirZoom('${id}');" style="margin-top:15px; background:#004d40; color:#fff; padding:8px 12px; cursor:pointer;">✨ Relancer une génération test ici</button>
        `;
        modal.style.display = 'flex';
    }

    function fermerZoom() {
        document.getElementById('modal-overlay').style.display = 'none';
    }
</script>

</body>
</html>
