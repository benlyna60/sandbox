<div class="module-card">
    <h3>📂 Module Ingestion & Documents</h3>
    
    <!-- Zone de glisser-déposer / Import de fichiers -->
    <div id="drop-zone" style="border: 2px dashed #b47cff; padding: 20px; text-align: center; border-radius: 8px; cursor: pointer;">
        Glissez vos fichiers ici (.txt, .json, .pdf) ou <input type="file" id="file-input" multiple accept=".txt,.json,.pdf,.md" style="display: none;">
        <button onclick="document.getElementById('file-input').click()">Parcourir</button>
    </div>

    <!-- Liaison avec le fichier de sauvegarde physique sur le disque -->
    <div style="margin-top: 15px;">
        <button id="btn-lier-fichier">🔗 Lier le fichier .txt de sauvegarde</button>
    </div>

    <!-- Affichage des stats -->
    <p id="out-ingestor" style="margin-top: 10px; font-size: 0.9em; color: #aaa;">Aucun document chargé.</p>
</div>

<!-- Inclusion de PDF.js (nécessaire pour lire les PDF en local) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    // Configuration du worker PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<script type="module">
    import { IngestorModule } from './ingestor_module.js';
    const ingestor = new IngestorModule();

    // Gestion du glisser-déposer
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        for (const file of e.dataTransfer.files) {
            await ingestor.traiterFichier(file);
        }
    });

    // Gestion de l'input classique
    document.getElementById('file-input').addEventListener('change', async (e) => {
        for (const file of e.target.files) {
            await ingestor.traiterFichier(file);
        }
    });

    // Liaison du fichier de sauvegarde physique via l'API du navigateur (File System Access)
    document.getElementById('btn-lier-fichier').addEventListener('click', async () => {
        try {
            const handle = await window.showOpenFilePicker({
                types: [{ description: 'Fichiers Texte ou JSON', accept: { 'text/plain': ['.txt'], 'application/json': ['.json'] } }]
            });
            await ingestor.lierFichierSauvegarde(handle[0]);
            alert("Fichier de sauvegarde lié avec succès !");
        } catch (err) {
            console.log("Sélection annulée ou non supportée.", err);
        }
    });
</script>
