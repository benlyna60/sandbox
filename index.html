<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Moniteur d'Apprentissage IA - Mémoire JSON</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace;
            padding: 30px;
            max-width: 600px;
            margin: auto;
        }
        h1 { color: #ffffff; font-size: 1.3em; margin-bottom: 15px; }
        button {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        button:hover { background-color: #333; }
        
        .status-line {
            background-color: #1a1a1a;
            border-left: 3px solid #4caf50;
            padding: 10px 15px;
            font-size: 0.85em;
            color: #cfcfcf;
            border-radius: 0 4px 4px 0;
            margin-bottom: 20px;
        }

        .chart-container {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .bar-label {
            width: 70px;
            font-weight: bold;
            color: #fff;
            font-size: 0.9em;
        }
        .bar-track {
            flex-grow: 1;
            background-color: #2a2a2a;
            height: 12px;
            border-radius: 3px;
            overflow: hidden;
            margin: 0 10px;
        }
        .bar-fill {
            height: 100%;
            background-color: #4caf50;
        }
        .bar-value {
            width: 45px;
            text-align: right;
            font-size: 0.8em;
            color: #888;
        }

        .global-progress-wrapper {
            margin-top: 20px;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
        .global-info {
            font-size: 0.75em;
            color: #777;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .global-track {
            background-color: #181818;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            width: 100%;
        }
        .global-fill {
            height: 100%;
            background-color: #333;
            width: 0%;
        }
    </style>
</head>
<body>

    <h1>Moniteur d'Apprentissage IA (Mémoire JSON)</h1>
    <button onclick="lancerApprentissageMemoire()">Lancer le cycle étendu (1200 itérations)</button>
    
    <div id="status" class="status-line">Statut : En attente du lancement...</div>

    <div class="chart-container" id="chart">
        <div style="color: #666; text-align: center; font-size: 0.9em;">Le classement apparaîtra ici...</div>
    </div>

    <div class="global-progress-wrapper">
        <div class="global-info">
            <span id="global-text">Progression globale (Module FR : 2,77M articles)</span>
            <span id="global-percent">0.0000%</span>
        </div>
        <div class="global-track">
            <div id="global-fill" class="global-fill"></div>
        </div>
    </div>

    <script>
        // Fonction utilitaire pour déclencher le téléchargement automatique du fichier JSON
        function sauvegarderMemoireJSON(stats, iterationActuelle) {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                iteration: iterationActuelle,
                timestamp: new Date().toISOString(),
                memoire_caracteres: stats
            }, null, 2));
            
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `memoire_ia_iteration_${iterationActuelle}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        async function lancerApprentissageMemoire() {
            const statusDiv = document.getElementById("status");
            const chartDiv = document.getElementById("chart");
            const globalFill = document.getElementById("global-fill");
            const globalPercent = document.getElementById("global-percent");
            
            statusDiv.innerHTML = "Statut : Connexion à Wikipédia en cours...";

            try {
                const url = "https://fr.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles=Intelligence_artificielle&format=json&origin=*";
                const response = await fetch(url);
                const data = await response.json();
                
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                const texteBrut = pages[pageId].extract || "";

                const statsCaracteres = {
                    'e': { succés: 0, total: 0 },
                    'a': { succés: 0, total: 0 },
                    's': { succés: 0, total: 0 },
                    'i': { succés: 0, total: 0 },
                    't': { succés: 0, total: 0 },
                    ' ': { succés: 0, total: 0 },
                    '.': { succés: 0, total: 0 }
                };

                const alphabet = Object.keys(statsCaracteres);
                const totalArticlesWiki = 2770000;
                let articlesConsommesSimules = 50;

                // On pousse à 1200 itérations pour tester la sauvegarde à la 1000e
                const maxIterations = 1200;

                for (let i = 0; i < maxIterations; i++) {
                    let charActuel = texteBrut[i % texteBrut.length] || ' ';
                    let prediction = alphabet[Math.floor(Math.random() * alphabet.length)];

                    if (statsCaracteres[charActuel]) {
                        statsCaracteres[charActuel].total++;
                        if (prediction === charActuel) {
                            statsCaracteres[charActuel].succés++;
                        }
                    }

                    // Déclenchement automatique d'un fichier JSON toutes les 1000 itérations
                    if ((i + 1) % 1000 === 0) {
                        sauvegarderMemoireJSON(statsCaracteres, i + 1);
                    }

                    articlesConsommesSimules += 2;
                    let ratioGlobal = (articlesConsommesSimules / totalArticlesWiki) * 100;
                    if (ratioGlobal > 100) ratioGlobal = 100;

                    globalFill.style.width = ratioGlobal.toFixed(4) + "%";
                    globalPercent.innerHTML = ratioGlobal.toFixed(4) + "%";

                    let scores = Object.keys(statsCaracteres).map(char => {
                        let dataChar = statsCaracteres[char];
                        let taux = dataChar.total > 0 ? Math.round((dataChar.succés / dataChar.total) * 100) : 0;
                        return { char: char === ' ' ? '[espace]' : char, taux: taux };
                    });

                    scores.sort((a, b) => b.taux - a.taux);

                    statusDiv.innerHTML = `Statut : Itération ${i+1}/${maxIterations} | Sauvegarde auto tous les 1000 cycles`;

                    let htmlBarres = "";
                    scores.forEach(item => {
                        let labelAffichage = item.char === '.' ? '[point]' : item.char;
                        htmlBarres += `
                            <div class="bar-row">
                                <div class="bar-label">${labelAffichage}</div>
                                <div class="bar-track">
                                    <div class="bar-fill" style="width: ${item.taux}%;"></div>
                                </div>
                                <div class="bar-value">${item.taux}%</div>
                            </div>
                        `;
                    });
                    chartDiv.innerHTML = htmlBarres;

                    await new Promise(resolve => setTimeout(resolve, 3));
                }

                statusDiv.innerHTML = "Statut : Cycle étendu terminé avec succès. Mémoire finale enregistrée.";

            } catch (error) {
                statusDiv.innerHTML = `Statut : Erreur (${error.message})`;
            }
        }
    </script>

</body>
</html>
