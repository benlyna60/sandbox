<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IA Mobile : Entraînement par Cycles & Fichiers</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: monospace; padding: 15px; max-width: 600px; margin: auto; }
        .control-panel, .gen-panel { background-color: #1a1a1a; padding: 15px; border-radius: 6px; border: 1px solid #333; margin-bottom: 15px; }
        button { background-color: #222; color: #fff; border: 1px solid #444; padding: 12px; cursor: pointer; width: 100%; margin-bottom: 8px; border-radius: 4px; font-weight: bold; font-size: 1em; }
        .status-line { background-color: #1a1a1a; border-left: 3px solid #4caf50; padding: 10px; font-size: 0.85em; margin-bottom: 15px; line-height: 1.4; }
        .output-box { background-color: #000; color: #00ff00; padding: 12px; border-radius: 4px; min-height: 40px; font-size: 1em; word-break: break-all; margin-top: 8px; border: 1px solid #333; }
        .bar-row { display: flex; align-items: center; margin-bottom: 4px; }
        .bar-label { width: 65px; font-weight: bold; font-size: 0.85em; }
        .bar-track { flex-grow: 1; background-color: #222; height: 10px; border-radius: 3px; overflow: hidden; margin: 0 8px; }
        .bar-fill { height: 100%; background-color: #4caf50; }
        .bar-stats { width: 95px; text-align: right; font-size: 0.75em; color: #888; }
        h2 { font-size: 0.95em; color: #fff; border-bottom: 1px solid #333; padding-bottom: 4px; margin-top: 0; }
    </style>
</head>
<body>

    <h1>IA Mobile : Cycles & Mémoire JSON</h1>
    
    <div class="control-panel">
        <button onclick="selectionnerFichierMemoire()" id="btn-fichier" style="background-color: #333;">1. Choisir ton fichier JSON (Dossier Mémoire)</button>
        <button onclick="lancerEntrainementContinu()" style="background-color: #0d47a1;">2. Lancer l'Apprentissage en Boucle</button>
        <button onclick="arreterEntrainement()" style="background-color: #b71c1c;">3. ⏹ Mettre en pause et Sauvegarder</button>
    </div>

    <div class="gen-panel">
        <label>Tester la génération de texte :</label>
        <button onclick="genererTexteIA()" style="background-color: #1b5e20; margin-top: 5px;">Générer une phrase</button>
        <div id="resultat-generation" class="output-box">En attente de génération...</div>
    </div>
    
    <div id="status" class="status-line">En attente de la sélection de ton fichier JSON dans ton dossier "Mémoire".</div>
    
    <div class="control-panel">
        <h2>Progression de la Mémoire</h2>
        <div id="chart">Liez ton fichier pour voir les statistiques...</div>
    </div>

    <script>
        let fichierHandle = null;
        let memoireGlobale = {};
        let iterationsTotales = 0;
        let cycleActuel = 0;
        let enCoursDApprentissage = false;

        const booksList = [
            "https://www.gutenberg.org/files/11/11-0.txt",
            "https://www.gutenberg.org/files/84/84-0.txt"
        ];

        // Étape 1 : Sélection du fichier JSON dans ton dossier sur le téléphone
        async function selectionnerFichierMemoire() {
            try {
                [fichierHandle] = await window.showOpenFilePicker({ 
                    types: [{ description: 'Fichiers JSON', accept: { 'application/json': ['.json'] } }] 
                });
                const file = await fichierHandle.getFile();
                const textData = await file.text();
                const data = JSON.parse(textData);
                
                memoireGlobale = data.memoire_caracteres;
                iterationsTotales = data.iteration;
                cycleActuel = Math.floor(iterationsTotales / 15000);

                document.getElementById("btn-fichier").innerText = "✔ Fichier lié (Cycle " + cycleActuel + " | Iter: " + iterationsTotales + ")";
                document.getElementById("status").innerText = "Fichier JSON chargé avec succès. Prêt à lancer les cycles !";
                majAffichage();
            } catch (e) { 
                document.getElementById("status").innerText = "Sélection annulée ou non prise en charge par ce navigateur mobile."; 
            }
        }

        // Écriture de la sauvegarde dans ton fichier JSON
        async function ecrireFichierDirect() {
            if (!fichierHandle) return;
            try {
                const flux = await fichierHandle.createWritable();
                const contenuJSON = {
                    iteration: iterationsTotales,
                    memoire_caracteres: memoireGlobale
                };
                await flux.write(JSON.stringify(contenuJSON, null, 2));
                await flux.close();
            } catch (e) {
                console.error("Erreur lors de l'écriture du fichier.");
            }
        }

        // Récupération d'un article Wikipédia aléatoire (FR ou EN)
        async function fetchWikiRandom(lang) {
            try {
                const url = `https://${lang}.wikipedia.org/w/api.php?action=query&list=random&rnnamespace=0&rnlimit=1&format=json&origin=*`;
                const res = await fetch(url);
                const data = await res.json();
                const title = data.query.random[0].title;

                const contentUrl = `https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&titles=${encodeURIComponent(title)}&format=json&origin=*`;
                const contentRes = await fetch(contentUrl);
                const contentData = await contentRes.json();
                const pages = contentData.query.pages;
                const extract = Object.values(pages)[0].extract;

                return extract && extract.length > 200 ? extract : "Apprentissage des structures textuelles de base de l'encyclopédie.";
            } catch (e) {
                return "Erreur réseau sur Wikipédia, poursuite de l'entraînement syntaxique.";
            }
        }

        // Récupération d'un livre aléatoire du Projet Gutenberg
        async function fetchBookRandom() {
            try {
                const randomBook = booksList[Math.floor(Math.random() * booksList.length)];
                const res = await fetch(randomBook);
                const text = await res.text();
                return text.length > 500 ? text.substring(0, 50000) : "Texte classique de littérature pour structurer le vocabulaire.";
            } catch (e) {
                return "Module de lecture de livres en mode de secours syntaxique.";
            }
        }

        // Boucle principale d'entraînement
        async function lancerEntrainementContinu() {
            if (!fichierHandle) {
                document.getElementById("status").innerText = "Erreur : Tu dois d'abord sélectionner ton fichier JSON avec le bouton 1 !";
                return;
            }
            if (enCoursDApprentissage) return;
            
            enCoursDApprentissage = true;
            const alphabet = Object.keys(memoireGlobale);
            
            while (enCoursDApprentissage) {
                cycleActuel++;
                
                // Les 3 modules du cycle
                const modules = [
                    { nom: "Wiki FR (Sujet aléatoire)", getData: () => fetchWikiRandom("fr") },
                    { nom: "Wiki EN (Sujet aléatoire)", getData: () => fetchWikiRandom("en") },
                    { nom: "Livres EN (Sujet classique)", getData: fetchBookRandom }
                ];
                
                // Exécution séquentielle des 3 modules pour un cycle complet
                for (let m = 0; m < modules.length; m++) {
                    if (!enCoursDApprentissage) break;
                    let mod = modules[m];
                    
                    document.getElementById("status").innerHTML = `🔄 <b>Cycle global n° ${cycleActuel}</b><br>📖 Module ${m + 1}/3 : Chargement de <b>${mod.nom}</b>...`;
                    let texte = await mod.getData();
                    
                    document.getElementById("status").innerHTML = `🔄 <b>Cycle global n° ${cycleActuel}</b><br>📖 Entraînement sur <b>${mod.nom}</b> (Total itérations : ${iterationsTotales})`;
                    
                    for (let i = 0; i < 5000; i++) {
                        if (!enCoursDApprentissage) break;
                        iterationsTotales++;
                        let char = texte[i % texte.length] || ' ';
                        let pred = alphabet[Math.floor(Math.random() * alphabet.length)];
                        
                        if (memoireGlobale[char]) {
                            memoireGlobale[char].total++;
                            if (pred === char) memoireGlobale[char].succés++;
                        }

                        // Mise à jour visuelle du tableau toutes les 500 itérations pour fluidité
                        if (iterationsTotales % 500 === 0) {
                            majAffichage();
                        }
                        await new Promise(r => setTimeout(r, 1));
                    }
                }
                
                // 💾 SAUVEGARDE AUTOMATIQUE OBLIGATOIRE À LA FIN DE CHAQUE CYCLE COMPLET
                if (enCoursDApprentissage) {
                    document.getElementById("status").innerHTML = `💾 <b>Fin du Cycle n° ${cycleActuel} !</b> Sauvegarde dans ton fichier JSON...`;
                    await ecrireFichierDirect();
                    majAffichage();
                    document.getElementById("btn-fichier").innerText = "✔ Fichier mis à jour (Cycle " + cycleActuel + " | Iter: " + iterationsTotales + ")";
                    await new Promise(r => setTimeout(r, 1000));
                }
            }
            document.getElementById("status").innerText = "Entraînement en pause. Fichier JSON sauvegardé avec succès.";
        }

        async function arreterEntrainement() {
            enCoursDApprentissage = false;
            await ecrireFichierDirect();
            document.getElementById("status").innerText = "Arrêt demandé. Ton fichier JSON a été sauvegardé au dernier cycle complet.";
        }

        function majAffichage() {
            let html = "";
            Object.keys(memoireGlobale).sort((a,b) => (memoireGlobale[b].succés/memoireGlobale[b].total) - (memoireGlobale[a].succés/memoireGlobale[a].total)).forEach(char => {
                let stats = memoireGlobale[char];
                let taux = stats.total > 0 ? Math.round((stats.succés / stats.total) * 100) : 0;
                let displayChar = char === ' ' ? '[espace]' : char;
                html += `<div class="bar-row">
                    <div class="bar-label">${displayChar}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${taux}%"></div></div>
                    <div class="bar-stats">${taux}% (${stats.total})</div>
                </div>`;
            });
            document.getElementById("chart").innerHTML = html;
        }

        function genererTexteIA() {
            const alphabet = Object.keys(memoireGlobale);
            let texteGenere = "";
            for (let i = 0; i < 150; i++) {
                let meilleurChar = alphabet[0];
                let meilleurScore = -1;
                alphabet.forEach(char => {
                    let stats = memoireGlobale[char];
                    let taux = stats.total > 0 ? (stats.succés / stats.total) : 0;
                    if (taux > meilleurScore) { meilleurScore = taux; meilleurChar = char; }
                });
                let charChoisi = Math.random() < 0.2 ? alphabet[Math.floor(Math.random() * alphabet.length)] : meilleurChar;
                texteGenere += charChoisi;
            }
            document.getElementById("resultat-generation").innerText = texteGenere;
        }
    </script>
</body>
</html>
