<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Moniteur d'Apprentissage IA - Mémoire Persistante & Turbo</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace;
            padding: 30px;
            max-width: 600px;
            margin: auto;
        }
        h1 { color: #ffffff; font-size: 1.3em; margin-bottom: 15px; }
        .control-panel {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        label { font-size: 0.85em; display: block; margin-bottom: 5px; color: #aaa; }
        input, select {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            width: 100%;
            margin-bottom: 12px;
            border-radius: 4px;
            font-family: monospace;
        }
        button {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.95em;
            margin-bottom: 10px;
            border-radius: 4px;
            width: 100%;
        }
        button:hover { background-color: #333; }
        
        .status-line {
            background-color: #1a1a1a;
            border-left: 3px solid #4caf50;
            padding: 10px 15px;
            font-size: 0.85em;
            color: #cfcfcf;
            border-radius: 0 4px 4px 0;
            margin-bottom: 20px;
        }

        .chart-container {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .bar-label {
            width: 70px;
            font-weight: bold;
            color: #fff;
            font-size: 0.9em;
        }
        .bar-track {
            flex-grow: 1;
            background-color: #2a2a2a;
            height: 12px;
            border-radius: 3px;
            overflow: hidden;
            margin: 0 10px;
        }
        .bar-fill {
            height: 100%;
            background-color: #4caf50;
        }
        .bar-value {
            width: 45px;
            text-align: right;
            font-size: 0.8em;
            color: #888;
        }

        .global-progress-wrapper {
            margin-top: 20px;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
        .global-info {
            font-size: 0.75em;
            color: #777;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .global-track {
            background-color: #181818;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            width: 100%;
        }
        .global-fill {
            height: 100%;
            background-color: #333;
            width: 0%;
        }
    </style>
</head>
<body>

    <h1>Moniteur IA - Mémoire & Granularité</h1>
    
    <div class="control-panel">
        <button onclick="selectionnerDossier()" id="btn-dossier" style="background-color: #1b3b22; border-color: #2e7d32;">1. Choisir le dossier de sauvegarde</button>
        
        <label for="file-input">Importer une ancienne mémoire JSON (optionnel) :</label>
        <input type="file" id="file-input" accept=".json" onchange="chargerMemoireJSON(event)">

        <label for="input-iterations">Nombre d'itérations à lancer :</label>
        <input type="number" id="input-iterations" value="5000" step="1000" min="1000">

        <label for="input-frequence">Sauvegarder un JSON toutes les X itérations :</label>
        <input type="number" id="input-frequence" value="1000" step="500" min="500">

        <button onclick="lancerApprentissage()" style="background-color: #0d47a1; border-color: #1565c0; font-weight: bold;">2. Lancer la boucle d'apprentissage</button>
    </div>
    
    <div id="status" class="status-line">Statut : Prêt. Configurez vos paramètres et lancez.</div>

    <div class="chart-container" id="chart">
        <div style="color: #666; text-align: center; font-size: 0.9em;">Le classement apparaîtra ici...</div>
    </div>

    <div class="global-progress-wrapper">
        <div class="global-info">
            <span id="global-text">Progression globale (Module FR : 2,77M articles)</span>
            <span id="global-percent">0.0000%</span>
        </div>
        <div class="global-track">
            <div id="global-fill" class="global-fill"></div>
        </div>
    </div>

    <script>
        let dossierHandle = null;
        let memoireGlobale = {
            'e': { succés: 0, total: 0 },
            'a': { succés: 0, total: 0 },
            's': { succés: 0, total: 0 },
            'i': { succés: 0, total: 0 },
            't': { succés: 0, total: 0 },
            ' ': { succés: 0, total: 0 },
            '.': { succés: 0, total: 0 }
        };
        let iterationsTotalesEffectuees = 0;

        async function selectionnerDossier() {
            try {
                if (!window.showDirectoryPicker) {
                    alert("Votre navigateur ne supporte pas la sélection de dossier. Le téléchargement classique sera utilisé.");
                    return;
                }
                dossierHandle = await window.showDirectoryPicker();
                document.getElementById("btn-dossier").style.backgroundColor = "#2e7d32";
                document.getElementById("btn-dossier").innerText = "✔ Dossier de sauvegarde configuré";
            } catch (err) {
                console.error(err);
            }
        }

        // Charger un ancien fichier JSON pour reprendre l'entraînement
        function chargerMemoireJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.memoire_caracteres) {
                        memoireGlobale = data.memoire_caracteres;
                        iterationsTotalesEffectuees = data.iteration || 0;
                        document.getElementById("status").innerHTML = `Statut : Ancienne mémoire chargée (Itération de départ : ${iterationsTotalesEffectuees})`;
                    }
                } catch (err) {
                    alert("Erreur lors de la lecture du fichier JSON.");
                }
            };
            reader.readAsText(file);
        }

        async function sauvegarderMemoireJSONDirect(iterationActuelle) {
            const contenuJSON = JSON.stringify({
                iteration: iterationActuelle,
                timestamp: new Date().toISOString(),
                memoire_caracteres: memoireGlobale
            }, null, 2);

            if (dossierHandle) {
                try {
                    const nomFichier = `memoire_ia_iteration_${iterationActuelle}.json`;
                    const fichierHandle = await dossierHandle.getFileHandle(nomFichier, { create: true });
                    const fluxEcriture = await fichierHandle.createWritable();
                    await fluxEcriture.write(contenuJSON);
                    await fluxEcriture.close();
                    return;
                } catch (err) {
                    console.error("Erreur d'écriture directe, repli classique", err);
                }
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(contenuJSON);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `memoire_ia_iteration_${iterationActuelle}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        async function lancerApprentissage() {
            const statusDiv = document.getElementById("status");
            const chartDiv = document.getElementById("chart");
            const globalFill = document.getElementById("global-fill");
            const globalPercent = document.getElementById("global-percent");
            
            const maxIterations = parseInt(document.getElementById("input-iterations").value) || 5000;
            const frequenceSauvegarde = parseInt(document.getElementById("input-frequence").value) || 1000;

            statusDiv.innerHTML = "Connexion à Wikipédia...";

            try {
                const url = "https://fr.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&titles=Intelligence_artificielle&format=json&origin=*";
                const response = await fetch(url);
                const data = await response.json();
                
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                const texteBrut = pages[pageId].extract || "";

                const alphabet = Object.keys(memoireGlobale);
                const totalArticlesWiki = 2770000;

                for (let i = 0; i < maxIterations; i++) {
                    iterationsTotalesEffectuees++;
                    let charActuel = texteBrut[i % texteBrut.length] || ' ';
                    let prediction = alphabet[Math.floor(Math.random() * alphabet.length)];

                    if (memoireGlobale[charActuel]) {
                        memoireGlobale[charActuel].total++;
                        if (prediction === charActuel) {
                            memoireGlobale[charActuel].succés++;
                        }
                    }

                    // Déclenchement de la sauvegarde selon la fréquence choisie
                    if (iterationsTotalesEffectuees % frequenceSauvegarde === 0) {
                        await sauvegarderMemoireJSONDirect(iterationsTotalesEffectuees);
                    }

                    let articlesConsommesSimules = iterationsTotalesEffectuees * 2;
                    let ratioGlobal = (articlesConsommesSimules / totalArticlesWiki) * 100;
                    if (ratioGlobal > 100) ratioGlobal = 100;

                    globalFill.style.width = ratioGlobal.toFixed(4) + "%";
                    globalPercent.innerHTML = ratioGlobal.toFixed(4) + "%";

                    let scores = Object.keys(memoireGlobale).map(char => {
                        let dataChar = memoireGlobale[char];
                        let taux = dataChar.total > 0 ? Math.round((dataChar.succés / dataChar.total) * 100) : 0;
                        return { char: char === ' ' ? '[espace]' : char, taux: taux };
                    });

                    scores.sort((a, b) => b.taux - a.taux);

                    statusDiv.innerHTML = `Entraînement en cours | Total cumulé : ${iterationsTotalesEffectuees} cycles`;

                    let htmlBarres = "";
                    scores.forEach(item => {
                        let labelAffichage = item.char === '.' ? '[point]' : item.char;
                        htmlBarres += `
                            <div class="bar-row">
                                <div class="bar-label">${labelAffichage}</div>
                                <div class="bar-track">
                                    <div class="bar-fill" style="width: ${item.taux}%;"></div>
                                </div>
                                <div class="bar-value">${item.taux}%</div>
                            </div>
                        `;
                    });
                    chartDiv.innerHTML = htmlBarres;

                    // Pause ultra-courte (1ms) pour cracher un maximum de calculs si vous avez du temps
                    await new Promise(resolve => setTimeout(resolve, 1));
                }

                statusDiv.innerHTML = `Séquence terminée. Total cumulé atteint : ${iterationsTotalesEffectuees} cycles.`;

            } catch (error) {
                statusDiv.innerHTML = `Erreur : ${error.message}`;
            }
        }
    </script>

</body>
</html>
