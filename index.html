<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IA Mobile : N-Grammes & Fichiers JSON</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: monospace; padding: 15px; max-width: 600px; margin: auto; }
        .control-panel, .gen-panel { background-color: #1a1a1a; padding: 15px; border-radius: 6px; border: 1px solid #333; margin-bottom: 15px; }
        button { background-color: #222; color: #fff; border: 1px solid #444; padding: 12px; cursor: pointer; width: 100%; margin-bottom: 8px; border-radius: 4px; font-weight: bold; font-size: 1em; }
        .status-line { background-color: #1a1a1a; border-left: 3px solid #4caf50; padding: 10px; font-size: 0.85em; margin-bottom: 15px; line-height: 1.4; }
        .output-box { background-color: #000; color: #00ff00; padding: 12px; border-radius: 4px; min-height: 40px; font-size: 1em; word-break: break-all; margin-top: 8px; border: 1px solid #333; }
        .bar-row { display: flex; align-items: center; margin-bottom: 4px; }
        .bar-label { width: 65px; font-weight: bold; font-size: 0.85em; }
        .bar-track { flex-grow: 1; background-color: #222; height: 10px; border-radius: 3px; overflow: hidden; margin: 0 8px; }
        .bar-fill { height: 100%; background-color: #4caf50; }
        .bar-stats { width: 95px; text-align: right; font-size: 0.75em; color: #888; }
        h2 { font-size: 0.95em; color: #fff; border-bottom: 1px solid #333; padding-bottom: 4px; margin-top: 0; }
    </style>
</head>
<body>

    <h1>IA Mobile : Mémoire Contextuelle (Optimisée & Ponctuation)</h1>
    
    <div class="control-panel">
        <button onclick="selectionnerFichierMemoire()" id="btn-fichier" style="background-color: #333;">1. Choisir ton fichier JSON principal</button>
        <button onclick="importerSavoirExterieur()" style="background-color: #6a1b9a;">📥 Importer un savoir extérieur</button>
        <button onclick="lancerEntrainementContinu()" style="background-color: #0d47a1;">2. Lancer l'Apprentissage (Filtré)</button>
        <button onclick="arreterEntrainement()" style="background-color: #b71c1c;">3. ⏹ Mettre en pause et Sauvegarder</button>
    </div>

    <div class="gen-panel">
        <label>Tester la génération intelligente :</label>
        <button onclick="genererTexteIA()" style="background-color: #1b5e20; margin-top: 5px;">Générer une phrase</button>
        <div id="resultat-generation" class="output-box">En attente de génération...</div>
    </div>
    
    <div id="status" class="status-line">En attente de la sélection de ton fichier JSON...</div>
    
    <div class="control-panel">
        <h2>État des Transitions & Santé de la Mémoire</h2>
        <div id="chart">Liez ton fichier pour voir les statistiques...</div>
    </div>

    <script>
        let fichierHandle = null;
        let memoirePaires = {}; 
        let iterationsTotales = 0;
        let cycleActuel = 0;
        let enCoursDApprentissage = false;

        const booksList = [
            "https://www.gutenberg.org/files/11/11-0.txt",
            "https://www.gutenberg.org/files/84/84-0.txt"
        ];

        // Filtre complet incluant lettres, chiffres, espaces et ponctuation courante (. , ' ! ? - : ; " ( ))
        function nettoyerMemoireExistante() {
            const regexValide = /^[a-zA-Z0-9àâäéèêëîïôöùûüçÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ\s.,'!?;:\-"()]$/;
            let transitionsSupprimees = 0;

            for (let charActuel in memoirePaires) {
                if (!regexValide.test(charActuel)) {
                    delete memoirePaires[charActuel];
                    continue;
                }

                for (let charSuivant in memoirePaires[charActuel]) {
                    if (!regexValide.test(charSuivant) || memoirePaires[charActuel][charSuivant] < 5) {
                        delete memoirePaires[charActuel][charSuivant];
                        transitionsSupprimees++;
                    }
                }

                if (Object.keys(memoirePaires[charActuel]).length === 0) {
                    delete memoirePaires[charActuel];
                }
            }
            console.log(`Nettoyage effectué : ${transitionsSupprimees} parasites purgés.`);
        }

        async function selectionnerFichierMemoire() {
            try {
                [fichierHandle] = await window.showOpenFilePicker({ 
                    types: [{ description: 'Fichiers JSON', accept: { 'application/json': ['.json'] } }] 
                });
                const file = await fichierHandle.getFile();
                const textData = await file.text();
                const data = JSON.parse(textData);
                
                iterationsTotales = data.iteration || 0;
                cycleActuel = Math.floor(iterationsTotales / 15000);

                if (data.memoire_paires) {
                    memoirePaires = data.memoire_paires;
                } else {
                    memoirePaires = {};
                }

                nettoyerMemoireExistante();

                document.getElementById("btn-fichier").innerText = "✔ Fichier lié (Cycle " + cycleActuel + " | Iter: " + iterationsTotales + ")";
                document.getElementById("status").innerText = "Fichier JSON chargé, nettoyé et prêt !";
                majAffichage();
            } catch (e) { 
                document.getElementById("status").innerText = "Sélection annulée ou non prise en charge."; 
            }
        }

        async function importerSavoirExterieur() {
            if (!fichierHandle) {
                alert("Veuillez d'abord lier votre fichier JSON principal (Bouton 1) !");
                return;
            }
            try {
                const [savoirHandle] = await window.showOpenFilePicker({ 
                    types: [{ description: 'Fichiers JSON de savoir', accept: { 'application/json': ['.json'] } }] 
                });
                const file = await savoirHandle.getFile();
                const textData = await file.text();
                const dataSavoir = JSON.parse(textData);

                const pairesAjoutees = dataSavoir.memoire_paires || dataSavoir;

                let ajoutsCount = 0;
                for (let charActuel in pairesAjoutees) {
                    if (!memoirePaires[charActuel]) {
                        memoirePaires[charActuel] = {};
                    }
                    for (let charSuivant in pairesAjoutees[charActuel]) {
                        let poids = pairesAjoutees[charActuel][charSuivant];
                        if (!memoirePaires[charActuel][charSuivant]) {
                            memoirePaires[charActuel][charSuivant] = 0;
                        }
                        memoirePaires[charActuel][charSuivant] += poids;
                        ajoutsCount++;
                    }
                }

                await ecrireFichierDirect();
                majAffichage();
                document.getElementById("status").innerText = `✔ Savoir extérieur importé avec succès (${ajoutsCount} transitions fusionnées) !`;
                alert("Coup de pouce appliqué et fusionné !");
            } catch (e) {
                console.error(e);
                document.getElementById("status").innerText = "Importation du savoir annulée ou erreur de format.";
            }
        }

        async function ecrireFichierDirect() {
            if (!fichierHandle) return;
            try {
                const flux = await fichierHandle.createWritable();
                const contenuJSON = {
                    iteration: iterationsTotales,
                    memoire_paires: memoirePaires
                };
                await flux.write(JSON.stringify(contenuJSON, null, 2));
                await flux.close();
            } catch (e) {
                console.error("Erreur lors de l'écriture du fichier.");
            }
        }

        async function fetchWikiRandom(lang) {
            try {
                const url = `https://${lang}.wikipedia.org/w/api.php?action=query&list=random&rnnamespace=0&rnlimit=1&format=json&origin=*`;
                const res = await fetch(url);
                const data = await res.json();
                const title = data.query.random[0].title;

                const contentUrl = `https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext&titles=${encodeURIComponent(title)}&format=json&origin=*`;
                const contentRes = await fetch(contentUrl);
                const contentData = await contentRes.json();
                const pages = contentData.query.pages;
                const extract = Object.values(pages)[0].extract;

                return extract && extract.length > 200 ? extract : "Apprentissage des structures textuelles.";
            } catch (e) {
                return "Erreur réseau, poursuite de l'entraînement.";
            }
        }

        async function fetchBookRandom() {
            try {
                const randomBook = booksList[Math.floor(Math.random() * booksList.length)];
                const res = await fetch(randomBook);
                const text = await res.text();
                return text.length > 500 ? text.substring(0, 50000) : "Texte classique de littérature.";
            } catch (e) {
                return "Module de secours littéraire.";
            }
        }

        async function lancerEntrainementContinu() {
            if (!fichierHandle) {
                document.getElementById("status").innerText = "Erreur : Tu dois d'abord sélectionner ton fichier JSON avec le bouton 1 !";
                return;
            }
            if (enCoursDApprentissage) return;
            
            enCoursDApprentissage = true;
            
            while (enCoursDApprentissage) {
                cycleActuel++;
                const modules = [
                    { nom: "Wiki FR", getData: () => fetchWikiRandom("fr") },
                    { nom: "Wiki EN", getData: () => fetchWikiRandom("en") },
                    { nom: "Livres EN", getData: fetchBookRandom }
                ];
                
                for (let m = 0; m < modules.length; m++) {
                    if (!enCoursDApprentissage) break;
                    let mod = modules[m];
                    
                    document.getElementById("status").innerHTML = `🔄 <b>Cycle n° ${cycleActuel}</b><br>📖 Chargement de <b>${mod.nom}</b>...`;
                    let texte = await mod.getData();
                    
                    // Nettoyage incluant la ponctuation élargie
                    texte = texte.replace(/\s+/g, ' ').replace(/[^a-zA-Z0-9àâäéèêëîïôöùûüçÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ\s.,'!?;:\-"()]/g, "");

                    document.getElementById("status").innerHTML = `🔄 <b>Cycle n° ${cycleActuel}</b><br>📖 Apprentissage filtré sur <b>${mod.nom}</b>`;
                    
                    for (let i = 0; i < texte.length - 1; i++) {
                        if (!enCoursDApprentissage) break;
                        iterationsTotales++;
                        
                        let charActuel = texte[i];
                        let charSuivant = texte[i + 1];

                        if (!memoirePaires[charActuel]) {
                            memoirePaires[charActuel] = {};
                        }
                        if (!memoirePaires[charActuel][charSuivant]) {
                            memoirePaires[charActuel][charSuivant] = 0;
                        }
                        memoirePaires[charActuel][charSuivant]++;

                        if (iterationsTotales % 1000 === 0) {
                            majAffichage();
                        }
                        if (i % 500 === 0) {
                            await new Promise(r => setTimeout(r, 1));
                        }
                    }
                }
                
                if (enCoursDApprentissage) {
                    document.getElementById("status").innerHTML = `💾 <b>Fin du Cycle n° ${cycleActuel} !</b> Sauvegarde...`;
                    await ecrireFichierDirect();
                    majAffichage();
                    document.getElementById("btn-fichier").innerText = "✔ Fichier mis à jour (Cycle " + cycleActuel + " | Iter: " + iterationsTotales + ")";
                    await new Promise(r => setTimeout(r, 1000));
                }
            }
            document.getElementById("status").innerText = "Entraînement en pause. Fichier JSON sauvegardé.";
        }

        async function arreterEntrainement() {
            enCoursDApprentissage = false;
            await ecrireFichierDirect();
            document.getElementById("status").innerText = "Arrêté. Fichier JSON sauvegardé.";
        }

        function majAffichage() {
            let totalCles = Object.keys(memoirePaires).length;
            let clesValides = Object.keys(memoirePaires).filter(k => /^[a-zA-Z0-9\s.,'!?;:\-"()]$/.test(k)).length;
            let qualiteMemoire = totalCles > 0 ? Math.round((clesValides / totalCles) * 100) : 0;

            let html = `<div style="font-size: 0.8em; color: #4caf50; margin-bottom: 8px;"><b>Santé / Propreté du JSON :</b> ${qualiteMemoire}% de clarté</div>`;
            
            let keys = Object.keys(memoirePaires).slice(0, 7);
            keys.forEach(char => {
                let displayChar = char === ' ' ? '[espace]' : char;
                let totalSuivantes = Object.values(memoirePaires[char]).reduce((a, b) => a + b, 0);
                html += `<div class="bar-row">
                    <div class="bar-label">${displayChar}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:100%"></div></div>
                    <div class="bar-stats">${totalSuivantes} liens</div>
                </div>`;
            });
            document.getElementById("chart").innerHTML = html || "Apprentissage des paires en cours...";
        }

        function genererTexteIA() {
            const lettresDisponibles = Object.keys(memoirePaires);
            if (lettresDisponibles.length === 0) {
                document.getElementById("resultat-generation").innerText = "Pas encore assez de données de paires. Lance un peu d'apprentissage !";
                return;
            }

            const lettresPossibles = Object.keys(memoirePaires).filter(l => /[A-ZÀ-Ü\s]/.test(l));
            let lettreCourante = lettresPossibles.length > 0 
                ? lettresPossibles[Math.floor(Math.random() * lettresPossibles.length)] 
                : lettresDisponibles[Math.floor(Math.random() * lettresDisponibles.length)];

            let texteGenere = lettreCourante;
            let dernieresLettres = [lettreCourante];

            for (let i = 0; i < 200; i++) {
                let suivantes = memoirePaires[lettreCourante];
                
                if (!suivantes || Object.keys(suivantes).length === 0) {
                    lettreCourante = lettresDisponibles[Math.floor(Math.random() * lettresDisponibles.length)];
                } else {
                    let options = Object.entries(suivantes);
                    
                    let totalOccurrences = options.reduce((sum, [_, poids]) => sum + poids, 0);
                    let seuilMinimum = totalOccurrences * 0.01;
                    let optionsFiltrees = options.filter(([_, poids]) => poids > seuilMinimum);

                    if (optionsFiltrees.length === 0) optionsFiltrees = options;

                    let optionsAntiBeguaiement = optionsFiltrees.filter(([suiv]) => {
                        let occurrencesRecentes = dernieresLettres.slice(-6).filter(l => l === suiv).length;
                        return occurrencesRecentes < 2;
                    });

                    if (optionsAntiBeguaiement.length === 0) optionsAntiBeguaiement = optionsFiltrees;

                    optionsAntiBeguaiement.sort((a, b) => b[1] - a[1]);
                    
                    let choixPool = optionsAntiBeguaiement.slice(0, Math.min(3, optionsAntiBeguaiement.length));
                    let choixAleatoire = choixPool[Math.floor(Math.random() * choixPool.length)];
                    
                    lettreCourante = choixAleatoire[0];
                }

                texteGenere += lettreCourante;
                dernieresLettres.push(lettreCourante);
                if (dernieresLettres.length > 10) dernieresLettres.shift();
            }
            
            document.getElementById("resultat-generation").innerText = texteGenere;
        }
    </script>
</body>
</html>
